<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="var(--acc-ink)">
<title>Ranket — protótipo navegável</title>
<!-- 11/08: o app não tinha ícone nem manifest — na tela de início do celular
     ele aparecia como um retângulo em branco. O ícone usa o símbolo COM fundo
     porque o iOS não respeita transparência aqui: PNG transparente vira um
     quadrado preto com o desenho perdido dentro.
     Isto também é o primeiro degrau pra notificação: web push só existe pra
     app instalado na tela de início. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/ranket-192.png">
<link rel="apple-touch-icon" href="icones/ranket-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranket">
<style>
/* 11/08: paleta RANKET. Quatro cores da marca, medidas dos arquivos oficiais:
   preto var(--acc-ink) (tem viés verde, não é neutro) · laranja var(--marca) · off-white
   var(--ink) · lime da bola var(--acc). As demais são degraus derivados delas.

   DUAS DECISÕES QUE NÃO SÃO ÓBVIAS:
   · O laranja é a marca, então ele NÃO pode significar "caiu de nível" — quem
     desce virou vermelho (--dn), que antes era um terracota vizinho do saibro.
   · `--clay` virou `--marca`: a variável guardava o saibro e agora guarda o
     laranja da raquetada. Nome que descreve a cor antiga mente sobre a nova. */
/* 25/08: paleta das TELAS RANKET (telas-referencia/, medidas por canvas):
   fundo frio #00060C→#0A0E06 · cards neutros #0C0F13 · laranja var(--marca) vira o
   botão de AÇÃO (com texto branco) · lime var(--acc) vira SELEÇÃO e estado ativo
   (com texto preto). --acc deixou de ser o giz: agora é o lime da seleção —
   quem age é o laranja (--marca), quem confirma escolha é o lime (--acc). */
:root{
  /* 03/09 — ID NOVA, medida no arquivo `RANKET - TELAS FINAIS`
     (`dac5VU1eoiqruZCVhOykgY`), que NÃO é o arquivo de onde a paleta de 25/08 e
     29/08 saiu. O desenho mudou de casa, e com ele a temperatura: o fundo deixa
     de ser esverdeado (#060B08) e as superfícies deixam de ser azuladas
     (#0C1013 / #131920). A ID nova é NEUTRA sobre carvão.
     Medidas na HOME (node 1:1819): fundo var(--bg) · cartão sólido var(--bg) ·
     cartão translúcido rgba(18,18,18,.5–.6) · barra inferior var(--bar).
     O lime, o laranja, o var(--ink) e o var(--ink3) não mudaram — só o chão mudou. */
  --bg:#0B0B0B; --sup:#121212; --sup2:#1E1E1E; --linha:#1B2320; --linha2:#2A3430;
  --sup-a:rgba(18,18,18,.6);   /* cartão SOBRE foto: deixa o fundo aparecer */
  --bar:#06090E;               /* a barra inferior é mais escura que o fundo */
  /* 29/08 — AS DUAS RÉGUAS DO BOARD. `--linha` e `--linha2` foram feitas pra
     contornar CARTÃO: escuras de propósito, pra que a borda não competisse com
     o conteúdo. O board usa a linha de outro jeito — como DIVISOR estrutural,
     e ali ela precisa ser vista: medidas ~#636461 na régua de cabeçalho (topo,
     abas, filete da classe) e ~#4D504A no separador entre linhas de lista.
     São dois valores porque no board são dois: a régua que separa SEÇÕES é
     mais forte que a que separa ITENS de uma mesma lista, e usar um só apaga
     essa hierarquia. As antigas continuam onde sempre estiveram — contorno de
     cartão segue discreto, inclusive no board. */
  --linha3:#636461; --linha4:#4D504A;
  --ink:#FFFEFD; --ink2:#BFC6B6; --ink3:#BCBCBC;   /* 29/08: --ink3 era #A6A6A7; o board mede #BCBCBC — mais claro, contrasta melhor no preto */
  --acc:#83E000; --acc-ink:#0A1100;          /* lime = seleção/ativo */
  --up:#83E000; --up-bg:#16240A;             /* o lime da bola premia */
  --dn:#E8433C; --dn-bg:#2B0F0C;             /* vermelho, não laranja */
  /* 02/09 — o RÓTULO do laranja deixa de ser branco.
     É a única falha de contraste real do arquivo (§7, R3): var(--ink) sobre
     var(--marca) dá 2,87:1 e reprova o AA em texto normal (4,5:1) e até em texto
     grande (3:1). Afeta o CTA principal — "Ver oponentes no seu radar",
     "Publicar", "Convidar", "Aplicar filtros" —, ou seja, o botão que mais
     importa em cada tela. Com var(--acc-ink) sobe pra 6,7:1.
     E não é invenção minha: var(--acc-ink) é exatamente o que o próprio arquivo já
     usa como texto sobre o lime. O laranja passa a seguir a mesma regra do
     verde em vez de ter uma própria. A COR DE MARCA não muda — a alternativa
     era escurecer o laranja pra ~#C24E00, e essa sim mexeria na identidade. */
  /* 03/09 — REVERTIDO POR DECISÃO DO NUNO: o rótulo do laranja volta a ser
     BRANCO, seguindo o arquivo `RANKET - TELAS FINAIS` ao pé da letra.
     O custo que 02/09 mediu continua valendo e fica aqui pra não se perder:
     #FFFEFD sobre #FF6A00 dá 2,87:1 e reprova o AA em texto normal (4,5:1) e
     em texto grande (3:1) — e é o CTA principal de cada tela. A escolha foi
     paridade com o desenho em vez de contraste; não é descuido.
     Se voltar à mesa, o caminho sem mexer na marca é escurecer o laranja pra
     ~#C24E00, não trocar o rótulo de novo. */
  --marca:#FF6A00; --marca-ink:#FFFEFD;      /* laranja = ação */
  --gold:#E0C48A; --gold-bg:#26220F;
  /* 03/09: o raio do cartão sobe de 14 pra 20. O arquivo novo desenha cartão em
     20px e bloco grande (notícias) em 30px — o 14 era do board anterior. */
  --r:20px; --r-lg:30px; --rp:999px;
  /* 29/08 — A MARGEM LATERAL, agora proporcional.
     O board pede ~10% da largura (107 de 1080). Em 393pt de iPhone isso são
     39px, contra os 18px fixos que o app usava: era essa a desproporção. Mas
     10% cru também não serve — num iPhone SE (375) sobraria pouco miolo, e num
     Pro Max viraria desperdício.
     `clamp` resolve os dois: piso de 18px (o valor antigo, que nunca aperta),
     6vw no meio (23.6px no iPhone 16, 26.4px no Pro Max — mais perto do
     desenho) e teto de 30px pra não abrir demais em tela grande. */
  --pad-lado:clamp(18px,6vw,30px);
  /* 29/08: o BRILHO do board. Toda tela do Figma tem um gradiente radial lime
     vindo do alto, que é o que tira o fundo do preto morto. O original é um
     radialGradient com matriz de transformação que o CSS não reproduz igual;
     isto é a leitura do efeito, não a cópia da matriz — mesma cor, mesma
     origem, mesma queda. Medido contra o screenshot de 29:256.

     03/09: os STOPS eram fracos demais. O arquivo novo mede .10 → .30 → .40 →
     .50 (rgba 131,224,0 / 70,121,0 / 40,69,0 / 10,17,0) — o brilho não some no
     transparente, ele FECHA num verde quase preto. Era por isso que a tela do
     app lia mais chapada que a do Figma. */
  --brilho:radial-gradient(ellipse 120% 60% at 88% -6%,
    rgba(131,224,0,.10) 0%, rgba(70,121,0,.30) 38%, rgba(40,69,0,.40) 62%, rgba(10,17,0,.50) 100%);
  /* 11/08: era Bodoni/Didot, e a regra virou "sem webfont, e não vai começar
     agora" — Avenir Next era a mais próxima do logo entre as já instaladas.
     29/08: o board do Figma inteiro é desenhado em INTER, e o Nuno decidiu
     adotá-la. A regra antiga cai, mas a razão dela não: por isso a fonte é
     SERVIDA PELO PRÓPRIO APP (app/fontes/), não puxada do Google. O app é PWA
     e abre no 4G da quadra; texto que só aparece depois de um terceiro
     responder é regressão, e o Google veria o IP de cada jogador.
     Um arquivo só, 47 KB: é variable (400..800), então todo peso do board sai
     dele. Subset latin, que cobre ã ç õ é — o resto do português inclusive.
     `swap` é deliberado: melhor ler em San Francisco por 200ms do que encarar
     um retângulo em branco. A pilha de fallback é a de antes, na ordem. */
  --f-disp:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --f-ui:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@font-face{
  font-family:'Inter';
  font-style:normal;
  font-weight:400 800;
  font-display:swap;
  src:url('fontes/inter-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 29/08: `100dvh` depois do `100%`, como fallback. No Safari do iPhone a
   altura do documento não acompanha a barra de endereço retraindo — o app
   ficava mais curto que a tela e sobrava uma faixa do fundo embaixo da nav.
   `dvh` é a altura DINÂMICA: acompanha a barra aparecendo e sumindo. Quem não
   entende a unidade ignora a segunda linha e fica no comportamento de antes. */
html,body{height:100%;height:100dvh}
/* 01/09 — O FUNDO DAS TELAS, pelo código dos nodes (10 de 10 telas do Figma
   têm a mesma camada, ex. node 28:155 no Radar): base var(--acc-ink) com um brilho
   RADIAL lime (var(--acc) a 10%) descendo do canto superior direito.
   O app tinha var(--bg) chapado — é a divergência que mais aparece no
   levantamento: 50 ocorrências nas 10 telas.
   ⚠️ Na HOME ele quase não se vê, porque lá a foto da quadra fica na frente
   dele. Nas telas sem foto, ele É o fundo. */
body{
  /* usa a var(--brilho) que já existia desde 29/08 e nunca tinha sido ligada em
     lugar nenhum — o brilho estava definido e apagado. Base var(--acc-ink), que é a cor
     do node, no lugar do var(--bg) que estava aqui. */
  background:var(--brilho), var(--acc-ink);
  color:var(--ink);font:14px/1.5 var(--f-ui);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}

/* ---------- moldura ---------- */
#fone{
  /* 29/08: `100dvh` depois de `100vh`, nesta ordem, é fallback de propósito —
     quem não entende dvh (Safari < 15.4) fica no vh e nada quebra.
     No Safari do iPhone o `vh` mede a tela com a barra de endereço RETRAÍDA:
     enquanto ela está visível, o app é mais alto que o espaço real e a barra
     de baixo cai atrás dela. `dvh` acompanha a barra aparecendo e sumindo. */
  width:400px;height:860px;max-height:100vh;max-height:100dvh;background:var(--bg);position:relative;
  overflow:hidden;display:flex;flex-direction:column;
  border-radius:38px;box-shadow:0 30px 90px rgba(0,0,0,.65);border:1px solid #20301A;
}
@media(max-width:640px){
  body{align-items:stretch}
  #fone{width:100%;height:100%;max-height:none;border-radius:0;border:0;box-shadow:none}
}

/* linha de cal no fundo */
#fone::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(58deg,transparent 0 30px,rgba(232,222,210,.028) 30px 32px);
}

/* ---------- topo ---------- */
/* 29/08: a SAFE AREA DE CIMA. O app protegia só o rodapé (a nav já usava
   env(safe-area-inset-bottom) desde sempre) e encostava o topo em y=0 — nos
   iPhones com notch ou Dynamic Island, o voltar, o título, o sino e o avatar
   nasciam POR BAIXO da ilha. `max()` porque em aparelho sem recorte o inset é
   0 e o padding original tem que continuar valendo. */
.topo{
  flex:0 0 auto;padding:max(6px,env(safe-area-inset-top)) var(--pad-lado) 13px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--linha3);background:var(--bg);z-index:2;position:relative;
}
.topo .voltar{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--linha2);
  background:none;display:none;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
}
.topo.temvoltar .voltar{display:flex}
.topo h1{
  font-family:var(--f-disp);font-size:var(--t-title-s);font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topo .dir{font-size:11px;color:var(--ink3);white-space:nowrap}
/* 11/08: o outro "P" de placeholder — este ficou de fora da primeira troca.
   O círculo virou o preto da marca porque o símbolo é laranja e laranja sobre
   laranja some, igual ao do onboarding. */
.topo .marca{
  width:28px;height:28px;border-radius:50%;background:var(--bg);border:1.5px solid var(--acc);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 28px;
}
.topo .marca img{width:74%;height:74%;object-fit:contain}

/* ---------- corpo ---------- */
#tela{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;padding-bottom:16px}
#tela::-webkit-scrollbar{width:0}
.pad{padding:16px var(--pad-lado)}
.sec{padding:18px var(--pad-lado) 0}
/* 01/09 — O TÍTULO DE SEÇÃO DO FIGMA é branco, caixa normal, sem tracking
   (conferido em 6 telas do levantamento: Radar, Feed, Ranking, Grupos, Feed do
   grupo e Perfil). O app usava rótulo miúdo em CAIXA ALTA cinza em todas.
   A variante `.rot.tit` com o desenho certo existia desde 29/08 e nunca foi
   aplicada em lugar nenhum — então em vez de trocar dezenas de chamadas, a
   BASE passa a ser a do Figma, e o rótulo miúdo vira a variante `.rot.mini`
   pra onde ele ainda fizer sentido. */
.rot{font-size:var(--t-body);letter-spacing:0;text-transform:none;color:var(--ink);
  font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.rot span{font-size:var(--t-caption);color:var(--ink3);font-weight:400}
.rot.mini{font-size:var(--t-nav);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.rot span{letter-spacing:0;text-transform:none;font-size:var(--t-caption);font-weight:400}
/* 29/08 — O RÓTULO DAS TELAS DO BOARD. No app o `.rot` é o texto mais FRACO da
   tela: 9,5px, caixa alta, tracking largo, `--ink3`. No board ele é dos mais
   FORTES — "Notícias do tennis", "Seus Grupos" são 15px brancos, caixa normal,
   sem tracking. Não é ajuste de gosto: é inversão de hierarquia, e ela muda o
   que o olho encontra primeiro ao abrir a tela.
   Entra como VARIANTE e não como troca do `.rot`: o rótulo fraco está certo em
   dezenas de blocos que o board não desenha (o radar, o registrar, a agenda),
   onde ele é etiqueta de apoio e não título. Trocar o global acertaria seis
   telas e desarrumaria as outras. */
.rot.tit{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);
  font-weight:700;margin-bottom:12px}
.rot.tit span{font-size:var(--t-caption);color:var(--ink3)}
/* a notícia tem rótulo próprio (`.news-rot`) porque nasceu na home; no escopo
   `.noticias` ela é o título da seção, então segue a mesma regra */
.noticias .news-rot{font-size:15px;letter-spacing:0;text-transform:none;
  color:var(--ink);font-weight:700;margin-bottom:11px}

/* ---------- componentes ---------- */
/* 01/09 — o card do Figma tem raio 20 e NÃO tem stroke: o contorno vem de um
   segundo retângulo em rgba(11,11,11,.2) deslocado 2px (node 28:149 e outros 6).
   O app usava raio 14 e borda #1B2320, que é linha de divisor, não de card. */
.card{
  background:var(--sup);border:1px solid rgba(11,11,11,.2);border-radius:20px;
  padding:14px;margin-bottom:10px;
}
.card.clic{cursor:pointer;transition:.12s}
.card.clic:active{background:var(--sup2)}
.linha-item{display:flex;align-items:center;gap:12px}
.linha-item .txt{flex:1;min-width:0}
.linha-item .txt b{font-size:var(--t-label);font-weight:650;display:block;letter-spacing:-.005em}
.linha-item .txt small{font-size:var(--t-caption);color:var(--ink3);display:block;margin-top:2px}
.linha-item .seta{color:var(--ink3);font-size:15px}

/* avatar = boneco recortado + aro na cor da camisa (a cor é o identificador) */
.av{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--sup2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2);
  position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--camisa,var(--linha2));
}
/* 15/08: era `.av img` com width:250% e top:-14% iguais pros nove — o mesmo
   deslocamento fixo que a nota do ROSTO diz ter sido abandonado por dar rosto
   borrado e descentralizado. O círculo agora usa o retângulo medido dentro de
   cada sprite, igual ao seletor do vestiário. */
.av .ro{position:absolute;inset:0;background-repeat:no-repeat}
.av.g{width:52px;height:52px;flex:0 0 52px;font-size:16px;box-shadow:0 0 0 2.5px var(--camisa,var(--linha2))}
.av.gg{width:76px;height:76px;flex:0 0 76px;box-shadow:0 0 0 3px var(--camisa,var(--linha2))}
.av.eu{background:var(--marca);color:var(--ink)}

.pil{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;
  font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
}
.pil.acc{background:var(--acc);color:var(--acc-ink)}
.pil.up{background:var(--up-bg);color:var(--up)}
.pil.dn{background:var(--dn-bg);color:var(--dn)}
.pil.gold{background:var(--gold-bg);color:var(--gold)}
.pil.gh{border:1px solid var(--linha2);color:var(--ink3)}

/* 25/08: botão de ação vira PÍLULA LARANJA com texto branco (telas novas).
   Caixa alta saiu: o design novo escreve "Avançar", não "AVANÇAR". */
.btn{
  display:block;width:100%;padding:15px;border:0;border-radius:var(--rp);
  background:var(--marca);color:var(--marca-ink);font-weight:700;font-size:15px;
  letter-spacing:0;cursor:pointer;margin-bottom:9px;
}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:transparent;border:1px solid var(--linha2);color:var(--ink2);letter-spacing:.06em}
.btn.gh{background:transparent;border:1px dashed var(--linha2);color:var(--ink3);
  text-transform:none;letter-spacing:0;font-weight:500}

.nota{font-size:var(--t-caption);color:var(--ink3);line-height:1.55;margin-top:2px}
.nota b{color:var(--ink2)}

/* 29/08: CASCA — a marca de "esta tela está de pé, mas o dado por trás não
   existe ainda". Nasce com a leva das 24 telas do board: várias chegam antes
   da migração que as alimenta, e tela bonita com número plausível é demo
   enganosa. O precedente é a linha do estadoInicial: "não há mais elenco fake".
   LARANJA de propósito. Lime aqui leria como "confirmado" pela regra da casa
   (quem age é o laranja, quem confirma escolha é o lime), e confirmado é o
   sentido exatamente errado pra um bloco que não tem dado.
   A regra de uso está no helper `casca()`, lá embaixo: nome nenhum inventado,
   número nenhum inventado, foto nenhuma inventada. */
.casca{position:relative;border:1px dashed var(--marca);border-radius:var(--r);
  padding:26px 18px 18px;margin:10px 0;opacity:.78}
.casca::before{content:'SEM DADO REAL';position:absolute;top:8px;left:14px;
  font:700 var(--t-nav) var(--f-ui);letter-spacing:.14em;color:var(--marca)}
.casca .nota{color:var(--ink2)}

/* grade de seleção (propor horário) */
.grade{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sup);border:1px solid var(--linha2);color:var(--ink2);
  padding:10px 14px;border-radius:var(--r);font-size:var(--t-label);cursor:pointer;min-width:52px;text-align:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

/* hero do jogador */
.hero{padding:20px 18px 18px;border-bottom:1px solid var(--linha);position:relative}
.hero .cab-hero{display:flex;align-items:center;gap:14px;margin-bottom:2px}
.hero .cab-hero .txt{flex:1;min-width:0}
.hero .nm{font-family:var(--f-disp);font-size:var(--t-title-l);font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.08}
.hero .sub{font-size:var(--t-label);color:var(--ink3);margin-top:5px}
.hero .linha-nivel{display:flex;align-items:flex-end;gap:11px;margin-top:16px}
.hero .n{font-family:var(--f-disp);font-size:var(--t-display);font-weight:700;line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .d{font-family:var(--f-disp);font-size:var(--t-title-s);font-weight:700;padding-bottom:6px}
.hero .lb{font-size:var(--t-nav);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);padding-bottom:8px;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linha);
  border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-top:15px}
.stats>div{background:var(--sup);padding:11px 10px}
.stats .v{font-family:var(--f-disp);font-weight:700;font-size:var(--t-title-m);font-variant-numeric:tabular-nums}
.stats .k{font-size:var(--t-nav);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-top:3px;font-weight:700}

/* tabela */
.tab{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.tab .cab{display:grid;grid-template-columns:22px 30px 1fr 40px 48px;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--linha);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:700}
.tab .cab .r{text-align:right}
.tab .cab .c{text-align:center}
.ln{display:grid;grid-template-columns:22px 30px 1fr 40px 48px;gap:8px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--linha);font-size:var(--t-label);cursor:pointer}
.ln .av{width:30px;height:30px;flex:0 0 30px}
.ln:last-child{border-bottom:0}
.ln.eu{background:var(--sup2)}
.ln .pos{font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.ln.eu .pos{color:var(--acc)}
.ln .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .nm small{display:block;font-weight:400;font-size:var(--t-caption);color:var(--ink3);margin-top:1px}
.ln .mv{font-size:var(--t-nav);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ln .mv.up{color:var(--up)} .ln .mv.dn{color:var(--dn)} .ln .mv.eq{color:var(--ink3);opacity:.45}
.ln .pt{font-family:var(--f-disp);font-weight:700;text-align:right;font-size:var(--t-caption);font-variant-numeric:tabular-nums}

/* placar */
.placar{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:14px;margin-bottom:10px}
.pl-lado{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.pl-lado+.pl-lado{border-top:1px solid var(--linha)}
.pl-lado .q{display:flex;align-items:center;gap:9px;font-weight:650;font-size:var(--t-label);min-width:0}
.pl-lado .q span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets{display:flex;gap:6px;flex:0 0 auto}
.sets b{
  font-family:var(--f-disp);font-weight:700;font-size:19px;width:30px;height:36px;border-radius:4px;
  background:var(--sup2);display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;border:1px solid var(--linha);
}
.sets b.g{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sets b.vazio{color:var(--ink3);opacity:.4}

/* selos */
.selos{display:flex;gap:9px;flex-wrap:wrap}
.selo{width:54px;height:54px;border-radius:50%;background:var(--sup2);border:1px solid var(--linha);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:17px}
.selo b{font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.selo.off{opacity:.28}

/* a grade de conquistas do outro jogador (board 159:1470) — escudos, não os
   círculos de `.selo`: aqueles são a lista fixa de quem está logado. */
.cgrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-top:10px}
.cselo{aspect-ratio:5/6;border:1px solid var(--linha2);border-radius:10px;background:var(--sup);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;text-align:center}
.cselo i{font-style:normal;font-size:20px;color:var(--gold);line-height:1}
.cselo b{font:700 7.5px var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cselo small{font:700 7px var(--f-ui);color:var(--ink3)}

/* abas */
.abas{display:flex;border-bottom:1px solid var(--linha);padding:0 var(--pad-lado);gap:20px;position:sticky;top:0;background:var(--bg);z-index:3}
.abas button{background:none;border:0;padding:12px 0;font-size:12.5px;color:var(--ink3);
  cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.abas button.on{color:var(--ink);border-bottom-color:var(--acc)}
/* 29/08 — nas telas do board o sublinhado da aba ativa é BRANCO e mais grosso,
   não lime. O lime ali disputa atenção com o que ele marca em toda tela do
   app (o dado que premia: pontos, vitória, membro). Escopado em `.abas.esp`,
   que é a barra desenhada pelo board — o Histórico e o Perfil seguem lime até
   os boards deles serem lidos, e mudar o global sem olhá-los seria trocar
   quatro telas pra acertar duas. */
.abas.esp button.on{border-bottom-color:var(--ink);border-bottom-width:3px}
/* as abas do board dividem a LARGURA em partes iguais — sem isso o `gap:20px`
   as encosta à esquerda e sobra meia linha vazia. `esp` de espalhada e não
   `tres`: a barra do grupo (tela 17) tem duas, e uma classe chamada "tres"
   aplicada a duas abas é um nome que mente pra quem for ler o CSS depois. */
.abas.esp{gap:0;border-bottom-color:var(--linha3)}
.abas.esp button{flex:1}

/* ===== COMUNIDADE — telas 12 a 17 do board (29/08, Fase 2) ================
   Tudo daqui pra baixo nasce do board e não existia antes. As classes ficam
   juntas e prefixadas por superfície pra que apagar uma tela não deixe CSS
   órfão espalhado pelo arquivo. */

/* -- o pódio (tela 14 · node 169:1313) --
   Três colunas de larguras iguais alinhadas pela BASE, com o degrau do meio
   mais alto. `align-items:end` é o que faz o 1º subir sem posicionamento
   absoluto — o board desenha alturas 108/150/86 e a proporção é o que importa,
   não o pixel. */
/* O pódio do board é uma MASSA LARANJA CONTÍNUA, não três barras soltas: sem
   vão entre os degraus, sem canto arredondado no encontro deles e sem caixa em
   volta. E o degrau do campeão é o mais ESTREITO dos três, não o mais largo —
   ele ganha altura, não largura. Eu tinha invertido as duas coisas. */
.podio{display:grid;grid-template-columns:1fr .88fr 1fr;align-items:end;gap:0;
  padding:24px 10px 0;background:transparent}
.podio .col{display:flex;flex-direction:column;align-items:center;min-width:0}
.podio .qnome{font:700 var(--t-caption)/1.3 var(--f-ui);color:var(--ink);text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podio .qpts{font:700 var(--t-caption) var(--f-ui);color:var(--acc);margin-top:2px;text-align:center}
.podio .fig{margin:8px 0 0;height:96px;display:flex;align-items:flex-end;justify-content:center}
.podio .col.p1 .fig{height:118px}
.podio .deg{width:100%;background:linear-gradient(180deg,#F46400,#C85200);
  border-top:2px solid #5C2600;display:flex;align-items:flex-start;justify-content:center;
  padding-top:9px;font:800 var(--t-title-m) var(--f-ui);color:#5C2600}
/* só as pontas externas arredondam — por dentro os degraus se encostam */
.podio .col.p2 .deg{border-radius:6px 0 0 0}
.podio .col.p3 .deg{border-radius:0 6px 0 0}
.podio .col.p1 .deg{height:64px} .podio .col.p2 .deg{height:44px} .podio .col.p3 .deg{height:34px}
.podio .vazia{opacity:.35}

/* -- o cartão "sua classe" (tela 14, meio) -- */
.cls-hero{margin-top:12px}
.cls-hero .topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cls-hero .letra{font:800 var(--t-display)/0.9 var(--f-ui);color:var(--ink);display:flex;align-items:flex-start}
.cls-hero .letra sup{font:800 17px var(--f-ui);color:var(--acc);margin-left:2px;top:.15em;position:relative}
.cls-hero .dir{text-align:right}
.cls-hero .dir b{font:700 var(--t-title-s) var(--f-ui);color:var(--ink)}
/* 02/09: o "› B" é var(--ink3) no arquivo (node 174:1865), não o cinza-esverdeado
   do --ink2. É a classe de DESTINO, e ela é deliberadamente apagada: quem tem
   que puxar o olho ali é o "Faltam", que é lime. */
.cls-hero .dir .prox{color:var(--ink3);font-weight:700}
.cls-hero .dir small{display:block;font:700 var(--t-caption) var(--f-ui);color:var(--acc);margin-top:3px}
/* 02/09 — a BARRA pelo node 174:1874: trilho de 6px em var(--acc-ink) com raio 100 e
   preenchimento lime. O app tinha 3px sobre --linha2 (var(--linha2)): metade da
   altura e um trilho que se confunde com borda de cartão. O var(--acc-ink) é o mesmo
   quase-preto do cabeçalho — o trilho é um vazio, não uma linha. */
.cls-hero .barra{height:6px;border-radius:100px;background:var(--acc-ink);margin:12px 0 10px;overflow:hidden}
.cls-hero .barra i{display:block;height:100%;border-radius:100px;background:var(--acc)}

/* 02/09 — O ENVELOPE DA ABA RANKING (node 173:1809, "Rectangle 156").
   Pódio, cartão da sua classe e a lista de classes NÃO são três blocos soltos
   no arquivo: são o conteúdo de UM contêiner de 970 de largura, sem fundo,
   com raio 30 (→ 12pt pela §5) e borda de 1px em var(--acc). É a única borda
   lime de tela cheia do board inteiro, e é ela que diz "isto aqui é o
   ranking" — sem ela os três blocos leem como três assuntos.
   Sem fundo de propósito: o que se vê por dentro é o fundo da tela. */
.rk-env{border:1px solid var(--acc);border-radius:12px;padding:14px;margin-top:2px}
.rk-env .podio{margin-top:2px}
.rk-env .cls-hero{border:0;background:rgba(11,11,11,.8)}

/* -- a lista de classes (tela 14, embaixo) --
   O board põe foto de quadra atrás de cada card. Foto de classe não existe no
   app (é asset, não dado), então o fundo é o gradiente da marca — placeholder
   declarado, não foto inventada. */
.cls-card{position:relative;overflow:hidden;margin-top:10px;padding:15px;
  border:1px solid var(--linha2);border-radius:var(--r);
  background:linear-gradient(105deg,var(--sup2) 0%,var(--sup) 55%,rgba(131,224,0,.07) 100%);cursor:pointer}
.cls-card b{font:700 var(--t-title-s) var(--f-ui);color:var(--acc)}
.cls-card p{font:400 var(--t-caption)/1.45 var(--f-ui);color:var(--ink2);margin:3px 0 0}
.cls-card .pe{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.cls-card .pe .faixa{font:700 var(--t-nav) var(--f-ui);color:var(--ink)}
.cls-card .pe .ver{font:600 var(--t-nav) var(--f-ui);color:var(--ink2)}
.cls-card.aqui{border-color:var(--acc)}

/* -- o cabeçalho da classe e as linhas (tela 13 · node 176:1884) -- */
/* o filete passa POR BAIXO do badge e para onde o texto começa, como no board.
   Com o badge empurrando a linha (flex simples) ela nascia só depois dele e
   deixava de ler como régua — virava um traço solto à direita.
   ⚠️ A primeira tentativa foi filete absoluto de ponta a ponta com o texto
   mascarando por cima com `background`. Não serve AQUI: nas telas internas o
   fundo é a quadra translúcida, não existe cor sólida pra mascarar com, e a
   faixa saía como uma tarja preta cortando a linha. O badge invadindo o filete
   com margem negativa dá o mesmo desenho sem máscara nenhuma. */
.cls-cab{display:flex;align-items:center;margin:4px 0 6px;min-height:37px}
.cls-cab .cbadge{position:relative;z-index:2;margin-right:-14px}
.cls-cab .risco{flex:1;position:relative;z-index:1}
.cls-cab .faixa{margin-left:var(--t-nav)}
/* `cbadge` e não `chip`: `.chip` JÁ EXISTE no app (a pílula de filtro do radar)
   e tem a regra `#fone.noturno .chip:not(.on)`, que é mais específica que
   qualquer `.cls-cab .chip` e repintava o fundo de escuro — sobrando texto
   preto em cima de preto. Disputar especificidade com `!important` esconderia
   a colisão; o nome próprio a elimina, e de quebra impede que esta regra vaze
   pros chips do radar. */
.cls-cab .cbadge{flex:0 0 auto;min-width:37px;height:37px;padding:0 9px;border-radius:var(--rp);
  background:var(--ink);color:#0A0A0A;display:flex;align-items:center;justify-content:center;
  font:800 11px var(--f-ui)}
.cls-cab .risco{height:1px;background:#E0E1DD}
.cls-cab .faixa{flex:0 0 auto;font:600 11px var(--f-ui);color:var(--ink2)}
.rk-ln{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--linha4)}
.rk-ln .pos{flex:0 0 22px;text-align:center;font:700 14px var(--f-ui);color:var(--ink2)}
.rk-ln.p1 .pos{color:var(--marca)} .rk-ln.p2 .pos,.rk-ln.p3 .pos{color:var(--acc)}
.rk-ln .nm{flex:1;min-width:0}
/* o board cola o número grande NO NOME, na mesma linha de base — não o joga na
   borda direita. Com o nome de largura real a distância chegava a ~285px, e os
   dois deixavam de se ler como uma coisa só. */
.rk-ln .l1{display:flex;align-items:baseline;gap:12px;min-width:0}
.rk-ln .nm b{flex:0 1 auto;font:700 var(--t-label) var(--f-ui);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-ln.p1 .nm b{color:var(--marca)}
.rk-ln .nm small{display:block;font:600 var(--t-caption) var(--f-ui);color:var(--ink2)}
/* no board o pódio colore a LINHA INTEIRA, não só o número: a linha de pontos
   acompanha a posição. Sem isso o 1º lugar sai laranja em cima e cinza embaixo,
   e a cor deixa de significar "este é o primeiro" pra significar "esta palavra
   é laranja". */
.rk-ln.p1 .nm small{color:var(--marca)}
.rk-ln.p2 .nm small,.rk-ln.p3 .nm small{color:var(--acc)}
.rk-ln .nv{flex:0 0 auto;font:700 14px var(--f-ui);color:var(--ink)}
.rk-ln.p1 .nv{color:var(--marca)} .rk-ln.p2 .nv,.rk-ln.p3 .nv{color:var(--acc)}
.rk-ln.eu{background:linear-gradient(90deg,rgba(131,224,0,.09),transparent);
  border-radius:10px;padding-left:8px;padding-right:8px}

/* -- post do feed (telas 12 e 17) -- */
.post{margin-top:10px;padding:15px;border:1px solid var(--linha);border-radius:var(--r);background:var(--sup)}
.post .cab{display:flex;align-items:center;gap:11px}
.post .cab .txt{flex:1;min-width:0}
.post .cab b{display:block;font:700 var(--t-label) var(--f-ui);color:var(--ink)}
.post .cab small{font:600 var(--t-caption) var(--f-ui);color:var(--ink2)}
.post .cab .men{background:none;border:0;color:var(--ink2);font-size:17px;cursor:pointer;padding:0 2px;line-height:1}
.post .corpo{font:400 var(--t-body)/1.45 var(--f-ui);color:var(--ink);margin-top:16px;white-space:pre-wrap;word-break:break-word}
/* o board separa post de post mais do que separa o post do que vem antes dele */
.post + .post{margin-top:20px}

/* -- cartões de grupo (tela 15) --
   Tira horizontal com rolagem, como o board. `scroll-snap` porque o card é
   largo e parar no meio de dois é o defeito clássico da tira em celular. */
/* ⚠️ `scroll-padding-left` NÃO é redundante com o `padding-left`, e a tira
   nasce torta sem ele. Com `scroll-snap-type: x mandatory` o navegador faz um
   snap na primeira pintura: ele alinha o primeiro cartão ao início do
   SNAPPORT, que por padrão é a borda do container — e o padding de 26px fica
   do lado de fora, rolado pra trás. Medido: a tira abria com
   `scrollLeft: 26.5`, exatamente o padding, e o primeiro cartão encostava na
   borda esquerda enquanto a tira de baixo (que não rola, porque cabe) aparecia
   alinhada. Duas tiras iguais em posições diferentes.
   `scroll-padding-left` move o snapport pra dentro, e aí o snap alinha o cartão
   ONDE o padding o pôs. */
.tira{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 0 6px;margin:0 calc(var(--pad-lado)*-1);padding-left:var(--pad-lado);padding-right:var(--pad-lado);
  scroll-padding-left:var(--pad-lado);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
/* 28% e 6:7, medidos no board: com 44% quadrado cabiam dois cartões e um fio do
   terceiro, e a tira parecia truncada em vez de rolável. Em 28% entram três
   inteiros mais a espiada do quarto, que é o que diz "tem mais pro lado". */
.gcard{flex:0 0 28%;scroll-snap-align:start;position:relative;aspect-ratio:6/7;
  border:1px solid var(--linha2);border-radius:8px;overflow:hidden;cursor:pointer;
  background:linear-gradient(150deg,var(--sup2),var(--sup))}
.gcard .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:800 var(--t-display) var(--f-ui);color:var(--linha2)}
/* a capa cobre o cartão e o rodapé fica por cima dela — o `.pe` já tem
   gradiente próprio, então o nome continua legível sobre qualquer foto.
   A inicial e a capa NUNCA convivem: as duas são `inset:0`, e desenhar as
   duas poria a letra em cima da foto. Quem tem capa não desenha inicial. */
.gcard .capa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.gcard .pe{position:relative;z-index:1}
.gcard .pe{position:absolute;left:0;right:0;bottom:0;padding:10px;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
/* DUAS linhas, e não reticências. No board o cartão mede 28% e o nome cabe
   numa linha — mas o board escreve "Nome do grupo"; com nome real ("Panela do
   Bahiano", "Beach da Pituba") o mesmo cartão trunca no meio da palavra. Entre
   estreitar o cartão (e perder o terceiro inteiro que o board mostra) ou deixar
   o nome quebrar, quebra o nome: a tira continua com a proporção desenhada e
   ninguém perde o nome da própria comunidade. */
.gcard .pe b{font:700 12px/1.25 var(--f-ui);color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* o board põe o ÍCONE em lime e o número em cinza. Com a linha inteira lime, o
   número disputa com o nome do grupo — e o número é o dado menos importante
   dos dois. */
.gcard .pe small{display:flex;align-items:center;gap:4px;font:600 10px var(--f-ui);color:var(--ink2)}
.gcard .pe small svg{width:11px;height:11px;flex:0 0 11px;color:var(--acc);display:block}
.gnovo{display:flex;align-items:center;gap:14px;padding:16px;
  border:1px solid var(--linha2);border-radius:var(--r);background:var(--sup);cursor:pointer}
/* forma geométrica e não o glifo "+": o traço da fonte é mais grosso na
   horizontal que na vertical e desenha uma cruz torta neste tamanho. Duas
   barras de 2px dão a cruz simétrica do board. */
.gnovo .mais{flex:0 0 auto;position:relative;width:24px;height:24px}
.gnovo .mais::before,.gnovo .mais::after{content:'';position:absolute;background:var(--acc)}
.gnovo .mais::before{left:0;right:0;top:11px;height:2px}
.gnovo .mais::after{top:0;bottom:0;left:11px;width:2px}
.gnovo b{font:700 var(--t-title-s) var(--f-ui);color:var(--ink)}
.gnovo p{font:400 var(--t-caption)/1.45 var(--f-ui);color:var(--ink2);margin:3px 0 0}

/* -- hero do grupo (tela 17) -- */
/* a capa do grupo e o botão de trocar. O botão fica no canto de cima, acima
   da foto e fora do `.dentro` — dentro dele o gradiente do texto passaria por
   cima e ele sumiria justamente sobre as fotos claras. */
.ghero .capa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ghero .capa-bt{position:absolute;top:10px;right:10px;z-index:2;cursor:pointer;
  padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.28);
  background:rgba(0,0,0,.45);color:var(--ink);font:600 var(--t-nav) var(--f-ui);
  backdrop-filter:blur(4px)}
.ghero{position:relative;border:1px solid var(--linha2);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(150deg,var(--sup2),var(--sup));min-height:150px;display:flex;align-items:flex-end}
.ghero .dentro{position:relative;z-index:1;width:100%;padding:15px;
  background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ghero .l1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ghero h3{font:700 var(--t-title-m) var(--f-ui);color:var(--ink);margin:0}
.ghero .mem{font:700 var(--t-nav) var(--f-ui);color:var(--ink);white-space:nowrap}
.ghero p{font:400 var(--t-caption)/1.5 var(--f-ui);color:var(--ink2);margin:8px 0 0}

/* barra inferior */
.nav{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--linha);background:var(--sup);padding:8px 0 max(14px,env(safe-area-inset-bottom));z-index:3;
}
/* 02/09 — o RÓTULO da barra pelo token de nav.
   Estava em 8,5px, abaixo do piso de 11 que a especificação fixou (§3, token
   `nav`: Figma 16px uppercase → 11pt + tracking). 8,5px uppercase com tracking
   é o menor texto do app inteiro e fica na aresta do ilegível no aparelho. */
.nav button{background:none;border:0;cursor:pointer;text-align:center;
  font-size:var(--t-nav);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
/* 02/09 — os ÍCONES são os do arquivo, não glifos de texto.
   Eram ◈ ◎ ▣ 💬 — caracteres, não os desenhos do board. Agora saem dos SVGs
   exportados dos próprios nodes (Navigation/House_03, Navigation/Compass, o
   Vector da COMUNIDADE e Communication/Chat), inline pra que o traço herde a
   cor do botão: var(--ink3) parado, lime ativo, que é o que o Figma pinta.
   ⚠️ `opacity` saiu: com o traço em currentColor quem diz o estado é a COR, e
   meia opacidade sobre var(--ink3) derrubava o contraste sem motivo.
   Altura 24px por R12 da especificação — no arquivo eles medem 17,7 a 21,5pt,
   pequenos demais pro padrão de barra (24–28). A largura sai do viewBox de
   cada um, não de uma regra só: são três proporções diferentes. */
.nav button i{display:block;font-style:normal;font-size:17px;margin-bottom:3px;
  line-height:0;color:inherit}
.nav button i svg{display:block;margin:0 auto;height:24px;width:auto}
.nav button.on{color:var(--acc)}
/* 29/08 (board): o + central. É item do array da nav como qualquer outro —
   o grid e a delegação do clique não sabem que ele é diferente, só o CSS sabe.
   ⚠️ O lime aqui é EXCEÇÃO DECLARADA à regra de :20-34 (quem age é o laranja).
   O board desenhou assim e o Nuno confirmou em 29/08. A regra continua valendo
   pro resto: este é o único lime que age. */
.nav button.cta{display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;margin:-18px auto 0;border-radius:50%;
  background:var(--acc);color:var(--acc-ink);font-size:26px;font-weight:400;
  line-height:1;box-shadow:0 6px 18px rgba(131,224,0,.28)}
.nav button.cta i{margin:0;opacity:1;font-size:26px}
.nav button.cta.on{color:var(--acc-ink)}
.topo-acoes{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ic-topo{position:relative;width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  border:1px solid var(--linha2);background:none;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;padding:0}
.ic-topo svg{width:16px;height:16px;display:block}
.ic-topo .pt{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;
  background:var(--marca);border:1.5px solid var(--bg)}
/* o sino perde o aro (o board não o circula) — o avatar mantém o dele, que ali
   é a borda da foto e não um contorno de botão. Regra depois da .ic-topo pra
   vencer sem !important. */
#btSino.ic-topo{border-color:transparent;color:var(--ink)}
.av-topo{overflow:hidden;border-color:var(--acc)}
.av-topo .av{width:100%;height:100%}
/* a folha do + */
#mais[hidden]{display:none}
/* absolute, não fixed: a folha pertence ao aparelho (#fone é relative), e
   fixed a fazia cobrir a janela inteira no desktop, escapando da moldura.
   É o mesmo posicionamento do #cenas, que é a mesma peça — folha que sobe. */
#mais{position:absolute;inset:0;z-index:35;display:flex;align-items:flex-end}
#mais .mais-fundo{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
#mais .mais-folha{position:relative;width:100%;background:var(--sup);
  border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--linha2);
  padding:10px 18px max(18px,env(safe-area-inset-bottom))}
#mais .puxador{width:38px;height:4px;border-radius:99px;background:var(--linha2);margin:0 auto 14px}
#mais .mais-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:none;border:0;padding:var(--t-body) 4px;color:var(--ink);font:600 15px var(--f-ui);cursor:pointer}
#mais .mais-item + .mais-item{border-top:1px solid var(--linha)}
/* 03/09: `width:24px` sozinho quebrava o "1-1" em duas linhas — é texto, não
   ícone, e 24px não cabem dois dígitos e um hífen. `flex:0 0 24px` reserva a
   coluna sem espremer, e o nowrap garante que nenhum rótulo curto se parta. */
#mais .mais-item i{font-style:normal;font-size:19px;flex:0 0 24px;text-align:center;
  white-space:nowrap;color:var(--acc);display:flex;align-items:center;justify-content:center}
#mais .mais-item small{display:block;font:400 var(--t-label) var(--f-ui);color:var(--ink3);margin-top:2px}
/* o item que o board pede e o app ainda não tem. Não some da lista — some da
   lista seria esconder o que falta; fica visível, apagado e sem clique, e o
   subtítulo diz por quê. Laranja tracejado é a mesma marca da classe .casca. */
/* 03/09: `.casca` global é selo de BLOCO — tem `position:relative`, moldura
   tracejada, padding de 26px no topo e um `::before` "SEM DADO REAL" ancorado
   ali. Dentro de um item de lista isso cai por cima do próprio título. Aqui
   fica só o que a marca precisa comunicar: laranja e sem clique. O aviso de
   que não existe ainda já está escrito no subtítulo, em palavra. */
#mais .mais-item.casca{opacity:.5;cursor:default;border:0;padding:var(--t-body) 4px;margin:0}
#mais .mais-item.casca::before{content:none}
#mais .mais-item.casca i{color:var(--marca)}
#mais .mais-item.casca small{color:var(--marca)}
.nav button .badge{
  display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:99px;
  background:var(--up);color:var(--acc-ink);font-size:9px;font-weight:800;margin-left:3px;padding:0 4px;
}

/* efeitos / o que mexeu */
.mexeu{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.mexeu .l{display:flex;align-items:center;gap:11px;padding:12px 13px}
.mexeu .l+.l{border-top:1px solid var(--linha)}
.mexeu .l .i{flex:1;min-width:0}
.mexeu .l .t{font-size:var(--t-label);font-weight:650}
.mexeu .l .d{font-size:var(--t-caption);color:var(--ink3);margin-top:2px}
.mexeu .l .v{font-family:var(--f-disp);font-size:var(--t-title-s);font-weight:700;font-variant-numeric:tabular-nums}

.celebra{
  text-align:center;padding:30px 20px 22px;border-bottom:1px solid var(--linha);
  background:radial-gradient(120% 90% at 50% 0%,rgba(198,255,61,.09),transparent 62%);
}
.celebra .ic{font-size:40px}
.celebra .reacao{height:200px;width:auto;object-fit:contain;object-position:top;margin:-14px auto 0;display:block;
  -webkit-mask-image:radial-gradient(120% 92% at 50% 42%,#000 60%,transparent 92%);
          mask-image:radial-gradient(120% 92% at 50% 42%,#000 60%,transparent 92%)}
.celebra h2{font-family:var(--f-disp);font-size:var(--t-title-l);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.celebra p{font-size:var(--t-body);color:var(--ink2);margin-top:7px;line-height:1.55}
.celebra .big{font-family:var(--f-disp);font-size:var(--t-display);font-weight:700;color:var(--up);
  line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}

/* toast */
#toast{
  position:absolute;left:14px;right:14px;bottom:88px;z-index:20;
  background:var(--sup2);border:1px solid var(--linha2);border-radius:var(--r);
  padding:12px 14px;font-size:12.5px;box-shadow:0 12px 34px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;
}
#toast.on{opacity:1;transform:none}
#toast b{color:var(--up)}

/* 12/08: barra de versão nova.
   Fica no TOPO de propósito: o toast mora embaixo (bottom:88px) e a nav também,
   e esta barra precisa aparecer por cima de qualquer tela — inclusive com
   onboarding (z-40) ou gaveta (z-60) abertos, que é justamente quando alguém
   pode estar preso na versão velha sem saber. */
#vnova{
  position:absolute;left:0;right:0;top:0;z-index:70;
  background:var(--marca);color:var(--acc-ink);cursor:pointer;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  font-size:12.5px;line-height:1.35;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.45);
}
#vnova b{font-weight:700}

/* 18/08 — TELA DE CARREGAMENTO. Os três primeiros segundos de quem abre eram
   preto liso: o `index.html` pinta o corpo, mas o app só desenha depois de o
   Supabase vir do CDN (script bloqueante), o net.js carregar e o boot conectar.
   Em 4G ruim isso é tempo de gente achar que quebrou e fechar.

   Mora no HTML e no CSS de propósito — nada de JS, senão ela chegaria junto com
   o problema que existe pra cobrir. Some sozinha quando o app renderiza. */
#splash{
  position:absolute;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .32s ease;
}
#splash.sai{opacity:0;pointer-events:none}
#splash .marca{display:flex;flex-direction:column;align-items:center;gap:14px}
#splash img{width:212px;height:auto;opacity:.96;display:block}
/* a assinatura: caixa alta, espaçada, com os pontos em lime — o mesmo ritmo do
   desenho, onde ela é o que sustenta a marca no vazio da tela */
#splash .assina{font:800 12px var(--f-ui);letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink);opacity:.92;white-space:nowrap}
#splash .assina i{color:var(--acc);font-style:normal;margin:0 2px}
#splash .pulso{
  width:34px;height:3px;border-radius:99px;background:var(--linha2);overflow:hidden;position:relative;
}
#splash .pulso::after{
  content:'';position:absolute;inset:0;background:var(--marca);
  transform:translateX(-100%);animation:splashPulso 1.15s ease-in-out infinite;
}
@keyframes splashPulso{ 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }
/* quem pediu menos movimento não recebe a barra correndo — fica a marca parada */
@media (prefers-reduced-motion:reduce){ #splash .pulso::after{animation:none;transform:translateX(0)} }

/* 18/08 — INSTALAR NA TELA DE INÍCIO. Faixa acima da nav, some ao ser dispensada
   e não volta (a escolha fica no aparelho). Não aparece pra quem já instalou.

   Fica no FLUXO, como irmã da nav, em vez de flutuar por cima dela: a nav não
   tem altura fixa (é padding + safe-area, que muda de aparelho pra aparelho),
   então qualquer `bottom: calc(altura + x)` seria um chute que erra em algum
   iPhone. No fluxo ela encosta na nav sozinha, em qualquer aparelho. */
#instale{
  flex:0 0 auto;margin:0 8px 8px;
  background:var(--sup);border:1px solid var(--linha2);border-radius:14px;
  padding:12px 13px;display:flex;align-items:center;gap:11px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);
}
#instale[hidden]{display:none}
#instale .tx{flex:1;min-width:0;font-size:var(--t-caption);line-height:1.4;color:var(--ink2)}
#instale .tx b{color:var(--ink);font-size:12.5px}
#instale button{border-radius:10px;font:700 12px var(--f-ui);cursor:pointer;padding:9px 12px;white-space:nowrap}
#instale .sim{background:var(--marca);color:var(--acc-ink);border:none}
#instale .nao{background:none;color:var(--ink3);border:none;font-size:18px;line-height:1;padding:4px 6px}

/* 18/08: a gaveta de teste e a engrenagem que a abria saíram. Ela dizia de si
   mesma que "o app de verdade não tem essa tela", e um dos quatro botões
   (`resetar`) apagava o estado do aparelho sem perguntar. Com ela foram junto
   a barra `.status` — que só existia pra segurar a engrenagem — e o toast que
   mandava usar o ⚙: apontar pra um botão que não existe mais é o defeito de
   sempre, vocabulário revogado que sobrevive na tela. */

/* 07/08: folha do cenário da vitrine — miniatura de verdade da quadra, porque
   nome de superfície ("saibro", "grama") não diz nada até você ver a cor. */
#cenas{position:absolute;inset:0;background:rgba(11,8,6,.78);z-index:30;display:none;align-items:flex-end}
#cenas.on{display:flex}
#cenas .cx{width:100%;background:var(--sup);border-top:1px solid var(--linha2);
  border-radius:14px 14px 0 0;padding:18px 18px max(20px,env(safe-area-inset-bottom));
  max-height:82%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#cenas h3{font-size:var(--t-nav);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-weight:700}
#cenas .sub{font-size:var(--t-label);color:var(--ink3);margin-bottom:14px}
.qgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;padding:0;border:2px solid transparent;
  background:#0F0C09;aspect-ratio:16/10}
.qcard img{width:100%;height:100%;object-fit:cover;display:block}
.qcard span{position:absolute;left:0;right:0;bottom:0;padding:14px 9px 7px;text-align:left;
  font:700 var(--t-nav) var(--f-ui);color:#FBF6EE;background:linear-gradient(180deg,transparent,rgba(11,8,6,.9))}
.qcard.on{border-color:var(--acc)}
.qcard.on span{color:var(--acc)}

.vazio{text-align:center;padding:46px 24px;color:var(--ink3);font-size:var(--t-body);line-height:1.6}
.vazio .ic{font-size:34px;opacity:.4;display:block;margin-bottom:10px}

/* ===== RADAR (25/08 — telas novas: disponibilidade e oponentes) ===== */
.rajuste{border:0;border-radius:var(--rp);background:var(--marca);color:var(--marca-ink);font:600 11px var(--f-ui);padding:9px 13px;cursor:pointer;max-width:58%}
.dcard{cursor:pointer}
.dgrade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dcol{background:var(--sup2);border-radius:10px;min-height:64px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dcol.tem{background:rgba(131,224,0,.10);border:1px solid rgba(131,224,0,.4)}
.dcol b{margin-top:auto;font-size:var(--t-nav);letter-spacing:.08em;color:var(--ink3)}
.dcol.tem b{color:var(--up)}
.dsl{background:var(--up);color:var(--acc-ink);font-weight:800;font-size:9.5px;border-radius:6px;padding:2px 5px;white-space:nowrap}
.doff{font-size:var(--t-nav);color:var(--ink3);font-weight:700;margin:auto 0}
.rtabs{flex:1;display:flex;gap:4px;background:var(--sup);border:1px solid var(--linha2);border-radius:var(--rp);padding:3px}
.rtab{flex:1;border:0;border-radius:var(--rp);background:transparent;color:var(--ink2);font:600 12px var(--f-ui);padding:8px 4px;cursor:pointer;white-space:nowrap}
.rtab.on{background:var(--acc);color:var(--acc-ink);font-weight:800}
/* 29/08 (board, node 120:390) — "Sua disponibilidade de jogo hoje".
   ⚠️ 01/09: O BONECO VOLTOU, e a decisão de 29/08 caiu por premissa errada.
   Ela dizia: "no board há um boneco numa QUARTA COLUNA à esquerda; em 390pt,
   quatro colunas dariam menos de 100pt cada e a pílula Rápida não caberia".
   Só que no Figma ele não é uma coluna de largura igual — é uma faixa estreita,
   perto de 10% do card, e as três colunas de pílulas dividem o resto. Com 14%
   pra figura sobram ~28% pra cada coluna, que em 375px dá ~96px: "Rápida"
   ocupa ~45px ali. Medido na tela, não estimado.
   E ele não é decoração: é o mesmo boneco vestido do vestiário, na tela onde a
   pessoa se oferece pros outros — é ela se vendo como os outros vão ver. */
.dhoje{display:grid;grid-template-columns:15% repeat(3,1fr);gap:0;align-items:stretch;
  background:rgba(11,11,11,.82);border:1px solid var(--linha);border-radius:20px;padding:14px 4px}
/* a figura acompanha a ALTURA das colunas — quem manda no tamanho do card são
   as pílulas, não ela. Com `width` na imagem a altura vinha da proporção do
   sprite e esticava o card, deixando um vão embaixo das pílulas. */
.dhoje .dfig{position:relative;min-width:0;overflow:hidden}
/* `contain` e não altura cheia: com `height:100%` a figura ficava mais larga
   que a faixa e era cortada nas laterais — no Figma ela aparece inteira. */
.dhoje .dfig img{position:absolute;inset:0;height:100%;width:100%;
  object-fit:contain;object-position:bottom center;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.dhoje .col{padding:0 10px;min-width:0}
.dhoje .col + .col{border-left:1px solid var(--linha)}
/* 01/09: o rótulo do Figma é "Tipo de quadra" / "Tipo de Jogo" — inteiro, não
   "Quadra"/"Jogo". Em 92px de coluna ele não cabe numa linha, então QUEBRA em
   duas em vez de virar reticência: rótulo cortado ("Tipo de …") não diz do que
   é a coluna, que é a única coisa que ele precisa fazer. As três colunas ficam
   com a mesma altura de cabeçalho porque `min-height` reserva as duas linhas. */
.dhoje .cab{display:flex;align-items:flex-start;gap:4px;margin-bottom:10px;min-height:30px}
.dhoje .cab i{font-style:normal;font-size:12px;color:var(--acc);line-height:1.25}
.dhoje .cab b{font:700 var(--t-nav)/1.25 var(--f-ui);color:var(--ink);min-width:0}
.dhoje button{display:block;width:100%;margin-bottom:7px;padding:8px 4px;
  border-radius:99px;border:1px solid var(--ink3);background:transparent;
  color:var(--ink3);font:400 var(--t-caption) var(--f-ui);cursor:pointer}
.dhoje button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
/* node 89:179 pelo código: 263x50, raio 30, fundo rgba(18,18,18,.6), SEM
   borda, rótulo "Filtros" em bold var(--ink3) com um chevron SVG. O app tinha
   pílula com borda var(--linha2), fundo #0C1013 e o rótulo "Filtrar". */
/* node 31:738: pílula de 717x53 (66% da largura do topo), raio 100, borda 1px
   var(--ink3), fundo transparente, lupa à esquerda e placeholder "Buscar". */
/* node 58:1419 — o envelope dos filtros: var(--bg), raio 30 de 1080 (≈11px em
   375), sem borda. E `.dhoje-f`: o mesmo painel de 3 colunas do radar, mas sem
   a faixa do boneco, que ali não existe. */
.filtro-folha{background:var(--bg);border-radius:11px;padding:16px 14px;margin-bottom:14px}
.dhoje-f{grid-template-columns:repeat(3,1fr);background:transparent;border:1px solid var(--ink3);
  border-radius:20px}
.dhoje-f .col + .col{border-left:1px solid rgba(188,188,188,.45)}
.dhoje-f .chip{display:block;width:100%;margin-bottom:7px;padding:8px 4px;border-radius:99px;
  border:1px solid var(--ink3);background:transparent;color:var(--ink3);
  font:400 var(--t-nav) var(--f-ui);cursor:pointer;white-space:nowrap}
.dhoje-f .chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
/* node 58:1600: LIMPAR FILTROS em caixa alta, cinza, na linha do título */
.flimpar{border:0;background:transparent;cursor:pointer;color:var(--ink3);
  font:700 var(--t-nav) var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:0}
/* ⚠️ `display:flex` vence o atributo `hidden` — sem esta linha a pílula
   aparecia em TODAS as telas, e ainda espremia o título até virar "FILTR…". */
.topo-busca[hidden]{display:none}
.topo-busca{flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  height:38px;padding:0 14px;border-radius:100px;border:1px solid rgba(188,188,188,.55);
  background:transparent}
.topo-busca i{font-style:normal;color:var(--ink3);font-size:15px;line-height:1}
.topo-busca input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  color:var(--ink);font:400 var(--t-label) var(--f-ui)}
.topo-busca input::placeholder{color:var(--ink3)}
.topo-busca input::-webkit-search-cancel-button{filter:invert(.7)}
.rfiltro{border:0;border-radius:11px;background:rgba(18,18,18,.6);color:var(--ink3);
  font:700 var(--t-label) var(--f-ui);padding:9px 14px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
.rfiltro i{font-style:normal;font-size:11px;opacity:.85;transform:translateY(1px)}
.oc .txt small{display:block;font-size:var(--t-caption);color:var(--ink3);margin-top:3px}
.odir{display:flex;flex-direction:column;gap:7px;align-items:stretch;flex:0 0 122px}
.olivre{color:var(--up);font-size:10.5px;font-weight:700;text-align:right;white-space:nowrap}
/* node 28:149: os dois botões do card têm 228x55 e raio 10 — não são pílula.
   Convidar em var(--marca); Ver perfil com fundo var(--bg) e borda var(--ink3). */
.oconv{border:0;border-radius:10px;background:var(--marca);color:var(--marca-ink);font:700 var(--t-label) var(--f-ui);padding:11px 8px;cursor:pointer;min-height:44px}
.operf{border:1px solid var(--ink3);border-radius:10px;background:var(--bg);color:var(--ink3);font:400 var(--t-label) var(--f-ui);padding:11px 8px;cursor:pointer;min-height:44px}
.dpil{background:var(--up);color:var(--acc-ink);font-weight:800;font-size:var(--t-caption);border-radius:8px;padding:8px 10px;white-space:nowrap}
.dx{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--linha2);border-radius:50%;background:none;color:var(--ink2);font-size:15px;cursor:pointer}

/* ===== INÍCIO — a home vitrine (organização Tennis Clash, sem loot) ===== */
/* ===== ESCALA TIPOGRÁFICA DO APP (01/09) =====
   Oito tokens, extraídos da especificação do Figma (figma/ESPECIFICACAO-VISUAL.md).
   Vale para o app INTEIRO, não só a home — por isso vive no :root.

   POR QUE NÃO SÃO OS VALORES DO FIGMA: a GEOMETRIA do arquivo é exata e é
   copiada como está (1080x1920 ÷ 2,88 = 375x667, o iPhone SE ao pixel). A
   TIPOGRAFIA não pode ser: os corpos foram digitados como se o frame fosse 1x,
   então convertidos por 2,88 220 dos 226 textos ficariam abaixo de 11pt.
   Pior: o arquivo tem o MESMO elemento em tamanhos diferentes entre telas — o
   badge de nota é 14px no Radar e 30px no Ranking (2,14x), o sufixo "++" é
   18,86 na Home e 35,77 no Ranking (1,90x, com a razão interna do componente
   mudando de 2,93 para 2,60). Não há um "igual" a copiar ali.
   O que estes tokens preservam é a HIERARQUIA do desenho: o que é maior no
   Figma continua maior aqui, na mesma ordem.

   ⚠️ 11px é PISO. Nada abaixo disso — o app tinha 50 regras entre 7 e 10,5px. */
:root{
  --t-display:28px;   /* letra de classe, número gráfico     (Figma 55,19) */
  --t-title-l:22px;   /* nome próprio, título de tela        (Figma 30)    */
  --t-title-m:20px;   /* número de pontos, título de seção   (Figma 30)    */
  --t-title-s:17px;   /* CTA primário, título de card        (Figma 30)    */
  --t-body:15px;      /* texto de leitura                    (Figma 20)    */
  --t-label:13px;     /* rótulo de campo, metadado           (Figma 20)    */
  --t-caption:12px;   /* legenda, nota                       (Figma 12/16) */
  --t-nav:11px;       /* rótulo uppercase de navegação       (Figma 16)    */
}
.ini{position:relative;min-height:100%;display:flex;flex-direction:column}
/* 01/09 — O FUNDO DA HOME, PELAS CAMADAS DO FIGMA (frame 35:756).
   São TRÊS, nesta ordem, e nenhuma delas era o que estava aqui:
     35:771  a foto da quadra (app/fig/fundo-home.jpg, tirada do arquivo)
     35:769  um gradiente RADIAL verde por cima dela — é ele que dá o tom da
             tela inteira, e ele não existia: o app tinha um scrim linear PRETO,
             que escurece em vez de esverdear. Era a diferença de cor.
     35:772  uma faixa sólida var(--bar) de 422 de 1920 (22% da altura) no rodapé,
             atrás da barra inferior.
   O gradiente radial vem do próprio código do node, convertido de SVG para
   CSS: mesmos quatro stops, mesmas opacidades. */
.ini .cena{position:absolute;inset:0;z-index:0;
  background-image:url('fig/fundo-home.jpg');
  background-size:cover;background-position:center top}
/* O FUNDO, corrigido duas vezes e agora conferido contra a foto.
   1a tentativa: scrim linear PRETO (o que já existia) — escurecia, não era o
      desenho.
   2a: inventei um radial VERDE visível no meio. Errado por dois motivos.
   O verde da tela vem da PRÓPRIA FOTO (quadra à noite, iluminada) — não de
   overlay. E o radial do node 35:769 fica ATRÁS da foto: a foto o cobre, então
   ele quase não participa do que se vê. Composto, o efeito dele é de 8 a 15
   níveis em 255 (spec item 4).
   O que resta, e é o que o Figma mostra: a foto, mais a faixa var(--bar) do node
   35:772 fechando os 22% de baixo, atrás da barra. Nada de cor por cima. */
.ini .scrim{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(6,9,14,.30) 0%, rgba(6,9,14,.10) 22%,
    rgba(6,9,14,0) 46%, rgba(6,9,14,.55) 78%, var(--bar) 100%)}
.ini .hud{position:relative;z-index:2;
  padding:max(8px,env(safe-area-inset-top)) var(--pad-lado) 0}
.ini .linha1{display:flex;align-items:center;gap:10px}
/* node 35:836 pelo código: logo 179x52,6 de um frame de 1080 — 16,6% da
   largura. Estava com 30px de altura, que dá ~102px de largura (27% da tela):
   quase o dobro do desenho. Agora vai por largura relativa, que é como o Figma
   define, e a altura sai da proporção do SVG. */
.ini .logo{width:16.6%;max-width:74px;height:auto;display:block;margin-right:auto;
  filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
/* 01/09: no Figma o aro do avatar do topo é LARANJA (a cor da marca), não lime
   — conferido na HOME (35:756) e no radar (28:149), as duas telas que o
   desenham. O lime é a cor de estado/ação no resto do app; aqui ele estava
   dizendo "isto é uma ação", e o avatar é identidade. */
/* node 30:657: o avatar tem 71x71 de 1080 (6,6%) e aro laranja. */
.ini .av-topo{width:6.6%;min-width:38px;max-width:44px;aspect-ratio:1;flex:0 0 auto;
  border-radius:50%;overflow:hidden;cursor:pointer;
  border:2px solid var(--marca);background:var(--sup2);position:relative}
.ini .av-topo .ro{position:absolute;inset:0;background-repeat:no-repeat}
.ini .temp{flex:1;background:rgba(30,23,20,.72);border:1px solid var(--linha);border-radius:99px;
  padding:7px 14px;font-size:var(--t-caption);color:var(--ink2);display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.ini .temp b{color:var(--ink);font-weight:700}
.ini .temp .dot{width:6px;height:6px;border-radius:50%;background:var(--up)}
/* node 120:114: o sino tem 53x53 de 1080 (4,9%) e é um SVG, não um emoji —
   emoji muda de desenho a cada sistema, e este é ícone de marca.
   ⚠️ O DESENHO tem o tamanho do Figma; a ÁREA DE TOQUE não: o alvo fica em
   44px (o mínimo da Apple) por padding, invisível. Copiar 4,9% de 375px daria
   18px de alvo, que é desenho fiel e botão que ninguém acerta. */
.ini .ic{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:transparent;border:0;
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.ini .ic > img{width:64%;height:64%;display:block;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.55))}
/* 09/08: o ◈ era o terceiro círculo idêntico e ninguém achava o trocador de
   cenário. Mesmo padrão do trilho do vestiário — o ícone PRÉ-VISUALIZA a
   escolha atual: o próprio cenário aparece dentro do botão, com o glifo por
   cima. Fica diferente dos vizinhos sem virar enfeite, e diz o que faz. */
.ini .ic.vitrine{background-size:cover;background-position:center 62%;border-color:var(--linha2)}
.ini .ic.vitrine::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, rgba(21,16,13,.15), rgba(21,16,13,.72));}
.ini .ic.vitrine i{position:relative;z-index:1;font-style:normal;font-size:15px;
  color:var(--acc);text-shadow:0 1px 3px rgba(0,0,0,.85)}
.ini .ic .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;line-height:17px;
  border-radius:99px;background:var(--up);color:var(--acc-ink);font-size:10px;font-weight:800;text-align:center;padding:0 4px}
/* (51) o ponto de recado: PONTO e não número, porque S.novidades conta AÇÃO e
   recado não é ação. Mora embaixo pra não brigar com o badge de cima. O valor
   vem sempre do carimbo no banco (net.js netAvisos) — nunca de um zero local. */
.ini .ic .ponto{position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
  background:var(--up);border:2px solid rgba(30,23,20,.9)}
#nav .ponto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);
  vertical-align:top;margin-top:2px}
/* 29/08 (board, node 35:756) — O CARD DE PROGRESSO DA HOME.
   Substitui o anel do .degrau. O anel media a categoria num círculo de 58px;
   o board mede na horizontal, com a classe em corpo grande à esquerda e a
   barra atravessando o card. A régua é a mesma (categoria, não classe) — o
   que muda é a forma, e a forma horizontal cabe mais informação: os pontos, o
   próximo degrau e o quanto falta, tudo na mesma linha de leitura. */
/* 29/08 (board, node 58:1619) — PERFIL DO OPONENTE.
   Cabeçalho com avatar grande de aro lime, nome + classe, bio, três
   contadores e o CTA laranja. Depois as abas. */
/* 29/08 (board, nodes 159:2468 e 169:728) — HISTÓRICO.
   Card de partida com contorno que diz o resultado sem precisar ler: lime pra
   vitória, laranja pra derrota. É a mesma semântica de cor que o resto do app
   já usa (--up e --dn), então não precisou de token novo. */
/* 29/08 (board, node 159:1470) — CONQUISTAS EM GRADE.
   O board mostra os selos numa grade plana. A sala 3D (abrirTrofeus) NÃO sai:
   ela continua sendo o "abrir" de um troféu, e a grade é a vista de conjunto
   que faltava. auto-fill em vez das 5 colunas fixas do board — em 390pt de
   aparelho, 5 colunas dariam 70px e o nome do selo não caberia embaixo. */
.tgrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tsel{background:rgba(11,11,11,.6);border:1px solid var(--linha);border-radius:14px;
  padding:10px 6px;text-align:center;cursor:pointer}
.tsel img{width:100%;max-width:56px;height:auto;display:block;margin:0 auto 6px}
.tsel b{display:block;font:700 var(--t-caption) var(--f-ui);color:var(--ink);
  letter-spacing:.03em;line-height:1.3}
.tsel small{display:block;font:400 var(--t-nav) var(--f-ui);color:var(--ink3);margin-top:3px;line-height:1.3}
.tsel.tem{border-color:var(--acc)}
.tsel.nao{opacity:.42}
.tsel.nao img{filter:grayscale(1)}
/* o menu de 3 pontos do topo (board 159:1604) */
.tpmenu{background:none;border:0;color:var(--ink2);font-size:19px;cursor:pointer;
  padding:0 2px;line-height:1}

.hpart{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px;
  border:1px solid var(--linha);border-radius:16px;background:rgba(11,11,11,.6)}
.hpart.v{border-color:var(--up)}
.hpart.d{border-color:var(--dn)}
.hpart .pl{flex:0 0 auto;font:700 19px var(--f-disp);min-width:52px;text-align:center}
.hpart.v .pl{color:var(--up)}
.hpart.d .pl{color:var(--dn)}
.hpart .meio{flex:1;min-width:0}
.hpart .meio div{font:400 var(--t-caption) var(--f-ui);color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpart .meio i{font-style:normal;color:var(--ink3);margin-right:5px}
.hpart .dir{flex:0 0 auto;text-align:right}
.hpart .dir .dt{font:400 var(--t-caption) var(--f-ui);color:var(--ink3)}
.hpart .dir .pts{font:700 var(--t-title-s) var(--f-disp);margin-top:3px}
.hpart.v .dir .pts{color:var(--up)}
.hpart.d .dir .pts{color:var(--dn)}
/* o gráfico anual: 12 colunas, a do mês escolhido acesa */
/* 02/09 — A ANALISE ANUAL PELO NODE 169:728.
   A tela ja existia com o grafico certo (barras por mes, e so o mes ESCOLHIDO
   ganha cor) — o arquivo concorda com isso, entao a semantica nao mudou. O que
   mudou foi a superficie e duas coisas que faltavam.
   ⚠️ As barras do arquivo vem ACHATADAS num vetor unico (Group 259), entao os
   fills delas nao chegam no payload do codigo — e o R13 da especificacao. O que
   define a cor aqui e o app, nao o arquivo: lime vence, vermelho perde. */
.hano{background:rgba(11,11,11,.8);border:0;border-radius:8px;padding:16px 8px}
.hano-top{display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px}
/* a pilula do ano (node 169:1098): 108x39, raio 100, borda lime, rotulo var(--ink3).
   `S.histAno` existia desde sempre e NENHUMA tela deixava troca-lo — o ano
   ficava preso no atual. So aparece como botao quando ha mais de um ano com
   partida; com um ano so, um seletor de uma opcao e um controle que mente. */
.hano-ano{border:1px solid var(--acc);border-radius:999px;background:transparent;
  color:var(--ink3);font:700 var(--t-nav) var(--f-ui);padding:8px 15px;cursor:pointer;
  min-height:36px;font-variant-numeric:tabular-nums}
.hano-ano[disabled]{cursor:default;opacity:1}
/* gap de 2: com 12 colunas em 375px, os 4px de antes comiam 44px da largura e
   os rotulos encostavam ("MARABR"). */
.hbarras{display:flex;align-items:flex-end;gap:2px;height:150px;margin-bottom:8px}
.hbarras .m{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:2px;height:100%;cursor:pointer;min-width:0}
.hbarras .m .bs{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.hbarras .m .bs i{display:block;width:4px;border-radius:2px;background:var(--linha2);min-height:2px}
.hbarras .m.on .bs i.v{background:var(--up)}
.hbarras .m.on .bs i.d{background:var(--dn)}
/* o rotulo do mes estava em 8,5px — o menor texto do app inteiro, e abaixo do
   piso de 11 da especificacao. O arquivo usa 15,4 sobre 1080, que da 11pt. */
/* o tracking sai: em 11px com 12 colunas ele e a diferenca entre caber e
   colidir, e num rotulo de tres letras nao acrescenta legibilidade nenhuma. */
.hbarras .m .rot{font:700 var(--t-nav) var(--f-ui);color:var(--ink3);letter-spacing:0;
  text-align:center;overflow:hidden}
.hbarras .m.on .rot{color:var(--ink)}
/* O TRILHO DOS MESES (node 169:1052): doze retangulos sob o eixo, #1E1E1E, e o
   do mes escolhido em var(--ink). Nao e enfeite — e o que diz qual coluna esta
   selecionada quando o mes nao tem partida nenhuma e as duas barras tem altura
   zero. Sem ele, mes vazio escolhido e mes vazio qualquer sao identicos. */
.hbarras .m .trilho{display:block;height:4px;border-radius:2px;background:#1E1E1E;margin:5px 0 4px}
.hbarras .m.on .trilho{background:var(--ink)}
/* A LEGENDA. Sao duas series e a unica coisa que as separa era a cor — quem nao
   distingue vermelho de verde lia duas barras iguais. O ponto colorido carrega
   a identidade e o texto fica em cor de texto, nunca na cor da serie. */
.hleg{display:flex;gap:16px;justify-content:center;margin:2px 0 12px}
.hleg span{display:inline-flex;align-items:center;gap:6px;font:400 var(--t-caption) var(--f-ui);color:var(--ink3)}
.hleg i{width:8px;height:8px;border-radius:2px;display:block}
.hleg i.v{background:var(--up)} .hleg i.d{background:var(--dn)}
/* O BLOCO "DADOS DO MES" (nodes 169:1111 e 169:1112/1148): nao e uma grade
   plana de caixas — sao DOIS paineis contornados. O da esquerda junta o que se
   conta (vitorias, derrotas, partidas) em duas colunas; o da direita empilha o
   que se deriva (aproveitamento e pontos), um por linha, com o numero grande a
   esquerda e o rotulo a direita.
   A borda e var(--ink3) no arquivo, bem mais viva que a --linha de antes: aqui ela
   e divisoria estrutural, nao contorno discreto de cartao. */
.hmes{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
@media(min-width:390px){.hmes{grid-template-columns:1.35fr 1fr}}
.hpainel{border:1px solid var(--ink3);border-radius:8px;padding:13px}
.hpainel.contas{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.hpainel .cx b{font:700 var(--t-title-m) var(--f-disp);color:var(--ink);margin-right:7px;
  font-variant-numeric:tabular-nums}
.hpainel .cx small{font:400 var(--t-label) var(--f-ui);color:var(--ink3)}
.hlado{display:flex;flex-direction:column;gap:9px}
.hlado .hpainel{display:flex;align-items:center;gap:9px}
.hlado .seta{color:var(--acc);font-size:15px;line-height:1;flex:0 0 auto}

.pcab{display:flex;gap:14px;align-items:flex-start;padding:16px var(--pad-lado) 0}
.pcab .av.gg{flex:0 0 76px}
.pcab .info{flex:1;min-width:0}
.pcab .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcab .nm b{font:700 var(--t-title-l) var(--f-disp);color:var(--ink)}
.pcab .nm .cl{font:700 var(--t-title-s) var(--f-ui);color:var(--acc)}
/* 02/09 — A PÍLULA DO ESTILO DE JOGO (node 169:277, no perfil do oponente).
   A mig 90 criou a coluna `estilo` em 01/09 e o elenco já a traz no `select`
   desde então (net.js:208) — o dado estava na memória do app e nenhuma tela o
   mostrava. Era o caso do `matches.cantada`, em menor escala: coluna com
   valor e nenhuma superfície.
   Do arquivo: pílula de 203x41 (r=66, que satura em redondo), fundo
   rgba(18,18,18,.5), borda var(--acc) e rótulo var(--acc).
   ⚠️ A borda do arquivo é 0,664 — sub-pixel, invisível. Vira 1px, que é o
   `hairline` da especificação. */
.pcab .nm .estilo{font:600 var(--t-caption) var(--f-ui);color:var(--acc);
  background:rgba(18,18,18,.5);border:1px solid var(--acc);border-radius:999px;
  padding:4px 11px;white-space:nowrap}
.pcab .bio{font:400 var(--t-body)/1.5 var(--f-ui);color:var(--ink3);margin-top:7px}
/* 02/09 — A LISTA DE FEEDBACKS (node 169:387/508/536, aba Feed > Feedbacks).
   Linha, nao cartao: sem fundo e sem contorno, separadas por uma regua de 1px.
   O nome divide a primeira linha com a data, que encosta na direita.
   A regua usa --linha4, que e a das linhas de uma MESMA lista (as duas reguas
   do board, medidas em 29/08) — nao a --linha3, que separa secoes. */
.fbl{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--linha4)}
.fbl:last-child{border-bottom:0}
.fbl .av{flex:0 0 40px;width:40px;height:40px}
.fbl .txt{flex:1;min-width:0}
.fbl .l1{display:flex;align-items:baseline;gap:10px}
.fbl .l1 b{font:700 var(--t-label) var(--f-ui);color:var(--ink);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbl .l1 .dt{font:400 var(--t-caption) var(--f-ui);color:var(--ink3);flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.fbl p{font:400 var(--t-body)/1.5 var(--f-ui);color:var(--ink3);margin:5px 0 0;
  white-space:pre-wrap;word-break:break-word}

/* 02/09 — A LISTA DE CONVERSAS (node 64:569, "CHAT GERAL").
   Era uma pilha de `.card` com seta; no arquivo e uma LISTA com regua, no
   mesmo material da lista de feedbacks. O que muda de verdade em relacao aos
   cartoes: o avatar e a foto da pessoa (126 no arquivo → 44pt, que e tambem o
   minimo de toque), o nome divide a linha com a hora, e o nao-lido deixa de
   ser pilula de texto pra ser DISCO lime com o numero dentro. */
.convl{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linha4);
  cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.convl:last-child{border-bottom:0}
.convl .av{flex:0 0 44px;width:44px;height:44px}
.convl .txt{flex:1;min-width:0}
.convl .txt b{display:block;font:700 var(--t-title-s) var(--f-ui);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convl .txt small{display:block;font:400 var(--t-label) var(--f-ui);color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convl .dir{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
/* o disco do nao-lido: 38 no arquivo (→13pt) e pequeno demais pra caber
   numero legivel, entao vai a 20px com o texto no piso de 11. */
.convl .naolido{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc);
  color:var(--acc-ink);font:700 var(--t-nav) var(--f-ui);display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums}
/* os filtros do topo (nodes 299:1135/1139/1142): pilula de 172x49, contorno
   var(--ink3), rotulo var(--ink3). O arquivo desenha os tres APAGADOS — nao ha estado
   escolhido desenhado —, entao o aceso segue a convencao do app: lime cheio. */
.convf{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.convf button{border:1px solid var(--ink3);border-radius:999px;background:transparent;
  color:var(--ink3);font:400 var(--t-label) var(--f-ui);padding:9px 18px;cursor:pointer;min-height:36px}
.convf button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

/* 02/09 — A GRADE DE POSTAGENS (node 150:1044).
   Duas colunas, celulas de altura variavel com a legenda por cima da foto.
   O raio e o `r-md` do arquivo (20 → 8pt), o mesmo dos cartoes de lista. */
.pgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pcel{position:relative;border-radius:8px;overflow:hidden;background:rgba(11,11,11,.8);
  border:1px solid var(--linha4);min-height:150px;display:flex;align-items:flex-end}
/* com foto a celula e a IMAGEM: a borda sai (o recorte ja a define) e a
   legenda desce sobre um veu, que e o que da contraste sem escurecer a foto
   inteira. Sem foto nao ha o que velar, e a celula fica sendo cartao. */
.pcel.comfoto{border:0;background:#000}
.pcel.comfoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcel.comfoto .leg{position:relative;width:100%;
