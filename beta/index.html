<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1100">
<title>Ranket — protótipo navegável</title>
<!-- 11/08: o app não tinha ícone nem manifest — na tela de início do celular
     ele aparecia como um retângulo em branco. O ícone usa o símbolo COM fundo
     porque o iOS não respeita transparência aqui: PNG transparente vira um
     quadrado preto com o desenho perdido dentro.
     Isto também é o primeiro degrau pra notificação: web push só existe pra
     app instalado na tela de início. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icones/ranket-192.png">
<link rel="apple-touch-icon" href="icones/ranket-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranket">
<style>
/* 11/08: paleta RANKET. Quatro cores da marca, medidas dos arquivos oficiais:
   preto #0A1100 (tem viés verde, não é neutro) · laranja #FF6A00 · off-white
   #FFFEFD · lime da bola #83E000. As demais são degraus derivados delas.

   DUAS DECISÕES QUE NÃO SÃO ÓBVIAS:
   · O laranja é a marca, então ele NÃO pode significar "caiu de nível" — quem
     desce virou vermelho (--dn), que antes era um terracota vizinho do saibro.
   · `--clay` virou `--marca`: a variável guardava o saibro e agora guarda o
     laranja da raquetada. Nome que descreve a cor antiga mente sobre a nova. */
/* 25/08: paleta das TELAS RANKET (telas-referencia/, medidas por canvas):
   fundo frio #00060C→#0A0E06 · cards neutros #0C0F13 · laranja #FF6A00 vira o
   botão de AÇÃO (com texto branco) · lime #83E000 vira SELEÇÃO e estado ativo
   (com texto preto). --acc deixou de ser o giz: agora é o lime da seleção —
   quem age é o laranja (--marca), quem confirma escolha é o lime (--acc). */
:root{
  --bg:#060B08; --sup:#0C1013; --sup2:#131920; --linha:#1B2320; --linha2:#2A3430;
  --ink:#FFFEFD; --ink2:#BFC6B6; --ink3:#BCBCBC;   /* 29/08: --ink3 era #A6A6A7; o board mede #BCBCBC — mais claro, contrasta melhor no preto */
  --acc:#83E000; --acc-ink:#0A1100;          /* lime = seleção/ativo */
  --up:#83E000; --up-bg:#16240A;             /* o lime da bola premia */
  --dn:#E8433C; --dn-bg:#2B0F0C;             /* vermelho, não laranja */
  --marca:#FF6A00; --marca-ink:#FFFEFD;      /* laranja = ação */
  --gold:#E0C48A; --gold-bg:#26220F;
  --r:14px; --rp:999px;
  /* 29/08: o BRILHO do board. Toda tela do Figma tem um gradiente radial lime
     vindo do alto, que é o que tira o fundo do preto morto. O original é um
     radialGradient com matriz de transformação que o CSS não reproduz igual;
     isto é a leitura do efeito, não a cópia da matriz — mesma cor, mesma
     origem, mesma queda. Medido contra o screenshot de 29:256. */
  --brilho:radial-gradient(ellipse 120% 60% at 88% -6%,
    rgba(131,224,0,.10) 0%, rgba(70,121,0,.07) 38%, rgba(40,69,0,.04) 62%, transparent 82%);
  /* 11/08: era Bodoni/Didot, e a regra virou "sem webfont, e não vai começar
     agora" — Avenir Next era a mais próxima do logo entre as já instaladas.
     29/08: o board do Figma inteiro é desenhado em INTER, e o Nuno decidiu
     adotá-la. A regra antiga cai, mas a razão dela não: por isso a fonte é
     SERVIDA PELO PRÓPRIO APP (app/fontes/), não puxada do Google. O app é PWA
     e abre no 4G da quadra; texto que só aparece depois de um terceiro
     responder é regressão, e o Google veria o IP de cada jogador.
     Um arquivo só, 47 KB: é variable (400..800), então todo peso do board sai
     dele. Subset latin, que cobre ã ç õ é — o resto do português inclusive.
     `swap` é deliberado: melhor ler em San Francisco por 200ms do que encarar
     um retângulo em branco. A pilha de fallback é a de antes, na ordem. */
  --f-disp:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --f-ui:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@font-face{
  font-family:'Inter';
  font-style:normal;
  font-weight:400 800;
  font-display:swap;
  src:url('fontes/inter-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#060A00;color:var(--ink);font:14px/1.5 var(--f-ui);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}

/* ---------- moldura ---------- */
#fone{
  width:400px;height:860px;max-height:100vh;background:var(--bg);position:relative;
  overflow:hidden;display:flex;flex-direction:column;
  border-radius:38px;box-shadow:0 30px 90px rgba(0,0,0,.65);border:1px solid #20301A;
}
@media(max-width:640px){
  body{align-items:stretch}
  #fone{width:100%;height:100%;max-height:none;border-radius:0;border:0;box-shadow:none}
}

/* linha de cal no fundo */
#fone::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(58deg,transparent 0 30px,rgba(232,222,210,.028) 30px 32px);
}

/* ---------- topo ---------- */
.topo{
  flex:0 0 auto;padding:6px 18px 13px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--linha);background:var(--bg);z-index:2;position:relative;
}
.topo .voltar{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--linha2);
  background:none;display:none;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
}
.topo.temvoltar .voltar{display:flex}
.topo h1{
  font-family:var(--f-disp);font-size:17px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topo .dir{font-size:11px;color:var(--ink3);white-space:nowrap}
/* 11/08: o outro "P" de placeholder — este ficou de fora da primeira troca.
   O círculo virou o preto da marca porque o símbolo é laranja e laranja sobre
   laranja some, igual ao do onboarding. */
.topo .marca{
  width:28px;height:28px;border-radius:50%;background:var(--bg);border:1.5px solid var(--acc);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 28px;
}
.topo .marca img{width:74%;height:74%;object-fit:contain}

/* ---------- corpo ---------- */
#tela{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;padding-bottom:16px}
#tela::-webkit-scrollbar{width:0}
.pad{padding:16px 18px}
.sec{padding:18px 18px 0}
.rot{
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin-bottom:11px;display:flex;justify-content:space-between;align-items:baseline;
}
.rot span{letter-spacing:0;text-transform:none;font-size:10.5px;font-weight:400}

/* ---------- componentes ---------- */
.card{
  background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);
  padding:14px;margin-bottom:10px;
}
.card.clic{cursor:pointer;transition:.12s}
.card.clic:active{background:var(--sup2)}
.linha-item{display:flex;align-items:center;gap:12px}
.linha-item .txt{flex:1;min-width:0}
.linha-item .txt b{font-size:13.5px;font-weight:650;display:block;letter-spacing:-.005em}
.linha-item .txt small{font-size:11px;color:var(--ink3);display:block;margin-top:2px}
.linha-item .seta{color:var(--ink3);font-size:15px}

/* avatar = boneco recortado + aro na cor da camisa (a cor é o identificador) */
.av{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--sup2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2);
  position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--camisa,var(--linha2));
}
/* 15/08: era `.av img` com width:250% e top:-14% iguais pros nove — o mesmo
   deslocamento fixo que a nota do ROSTO diz ter sido abandonado por dar rosto
   borrado e descentralizado. O círculo agora usa o retângulo medido dentro de
   cada sprite, igual ao seletor do vestiário. */
.av .ro{position:absolute;inset:0;background-repeat:no-repeat}
.av.g{width:52px;height:52px;flex:0 0 52px;font-size:16px;box-shadow:0 0 0 2.5px var(--camisa,var(--linha2))}
.av.gg{width:76px;height:76px;flex:0 0 76px;box-shadow:0 0 0 3px var(--camisa,var(--linha2))}
.av.eu{background:var(--marca);color:#FFFEFD}

.pil{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;
  font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
}
.pil.acc{background:var(--acc);color:var(--acc-ink)}
.pil.up{background:var(--up-bg);color:var(--up)}
.pil.dn{background:var(--dn-bg);color:var(--dn)}
.pil.gold{background:var(--gold-bg);color:var(--gold)}
.pil.gh{border:1px solid var(--linha2);color:var(--ink3)}

/* 25/08: botão de ação vira PÍLULA LARANJA com texto branco (telas novas).
   Caixa alta saiu: o design novo escreve "Avançar", não "AVANÇAR". */
.btn{
  display:block;width:100%;padding:15px;border:0;border-radius:var(--rp);
  background:var(--marca);color:var(--marca-ink);font-weight:700;font-size:15px;
  letter-spacing:0;cursor:pointer;margin-bottom:9px;
}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:transparent;border:1px solid var(--linha2);color:var(--ink2);letter-spacing:.06em}
.btn.gh{background:transparent;border:1px dashed var(--linha2);color:var(--ink3);
  text-transform:none;letter-spacing:0;font-weight:500}

.nota{font-size:11px;color:var(--ink3);line-height:1.55;margin-top:2px}
.nota b{color:var(--ink2)}

/* 29/08: CASCA — a marca de "esta tela está de pé, mas o dado por trás não
   existe ainda". Nasce com a leva das 24 telas do board: várias chegam antes
   da migração que as alimenta, e tela bonita com número plausível é demo
   enganosa. O precedente é a linha do estadoInicial: "não há mais elenco fake".
   LARANJA de propósito. Lime aqui leria como "confirmado" pela regra da casa
   (quem age é o laranja, quem confirma escolha é o lime), e confirmado é o
   sentido exatamente errado pra um bloco que não tem dado.
   A regra de uso está no helper `casca()`, lá embaixo: nome nenhum inventado,
   número nenhum inventado, foto nenhuma inventada. */
.casca{position:relative;border:1px dashed var(--marca);border-radius:var(--r);
  padding:26px 18px 18px;margin:10px 0;opacity:.78}
.casca::before{content:'SEM DADO REAL';position:absolute;top:8px;left:14px;
  font:700 8.5px var(--f-ui);letter-spacing:.14em;color:var(--marca)}
.casca .nota{color:var(--ink2)}

/* grade de seleção (propor horário) */
.grade{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sup);border:1px solid var(--linha2);color:var(--ink2);
  padding:10px 14px;border-radius:var(--r);font-size:13px;cursor:pointer;min-width:52px;text-align:center}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

/* hero do jogador */
.hero{padding:20px 18px 18px;border-bottom:1px solid var(--linha);position:relative}
.hero .cab-hero{display:flex;align-items:center;gap:14px;margin-bottom:2px}
.hero .cab-hero .txt{flex:1;min-width:0}
.hero .nm{font-family:var(--f-disp);font-size:25px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.08}
.hero .sub{font-size:11.5px;color:var(--ink3);margin-top:5px}
.hero .linha-nivel{display:flex;align-items:flex-end;gap:11px;margin-top:16px}
.hero .n{font-family:var(--f-disp);font-size:54px;font-weight:700;line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .d{font-family:var(--f-disp);font-size:17px;font-weight:700;padding-bottom:6px}
.hero .lb{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);padding-bottom:8px;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linha);
  border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-top:15px}
.stats>div{background:var(--sup);padding:11px 10px}
.stats .v{font-family:var(--f-disp);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.stats .k{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-top:3px;font-weight:700}

/* tabela */
.tab{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.tab .cab{display:grid;grid-template-columns:22px 30px 1fr 40px 48px;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--linha);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:700}
.tab .cab .r{text-align:right}
.tab .cab .c{text-align:center}
.ln{display:grid;grid-template-columns:22px 30px 1fr 40px 48px;gap:8px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--linha);font-size:13px;cursor:pointer}
.ln .av{width:30px;height:30px;flex:0 0 30px}
.ln:last-child{border-bottom:0}
.ln.eu{background:var(--sup2)}
.ln .pos{font-family:var(--f-disp);font-weight:700;font-size:14px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.ln.eu .pos{color:var(--acc)}
.ln .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .nm small{display:block;font-weight:400;font-size:10.5px;color:var(--ink3);margin-top:1px}
.ln .mv{font-size:11px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ln .mv.up{color:var(--up)} .ln .mv.dn{color:var(--dn)} .ln .mv.eq{color:var(--ink3);opacity:.45}
.ln .pt{font-family:var(--f-disp);font-weight:700;text-align:right;font-size:15px;font-variant-numeric:tabular-nums}

/* placar */
.placar{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);padding:14px;margin-bottom:10px}
.pl-lado{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.pl-lado+.pl-lado{border-top:1px solid var(--linha)}
.pl-lado .q{display:flex;align-items:center;gap:9px;font-weight:650;font-size:13.5px;min-width:0}
.pl-lado .q span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets{display:flex;gap:6px;flex:0 0 auto}
.sets b{
  font-family:var(--f-disp);font-weight:700;font-size:19px;width:30px;height:36px;border-radius:4px;
  background:var(--sup2);display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;border:1px solid var(--linha);
}
.sets b.g{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sets b.vazio{color:var(--ink3);opacity:.4}

/* selos */
.selos{display:flex;gap:9px;flex-wrap:wrap}
.selo{width:54px;height:54px;border-radius:50%;background:var(--sup2);border:1px solid var(--linha);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:17px}
.selo b{font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.selo.off{opacity:.28}

/* abas */
.abas{display:flex;border-bottom:1px solid var(--linha);padding:0 18px;gap:20px;position:sticky;top:0;background:var(--bg);z-index:3}
.abas button{background:none;border:0;padding:12px 0;font-size:12.5px;color:var(--ink3);
  cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.abas button.on{color:var(--ink);border-bottom-color:var(--acc)}

/* barra inferior */
.nav{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--linha);background:var(--sup);padding:8px 0 max(14px,env(safe-area-inset-bottom));z-index:3;
}
.nav button{background:none;border:0;cursor:pointer;text-align:center;
  font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.nav button i{display:block;font-style:normal;font-size:17px;margin-bottom:3px;opacity:.5}
.nav button.on{color:var(--acc)}
.nav button.on i{opacity:1}
/* 29/08 (board): o + central. É item do array da nav como qualquer outro —
   o grid e a delegação do clique não sabem que ele é diferente, só o CSS sabe.
   ⚠️ O lime aqui é EXCEÇÃO DECLARADA à regra de :20-34 (quem age é o laranja).
   O board desenhou assim e o Nuno confirmou em 29/08. A regra continua valendo
   pro resto: este é o único lime que age. */
.nav button.cta{display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;margin:-18px auto 0;border-radius:50%;
  background:var(--acc);color:var(--acc-ink);font-size:26px;font-weight:400;
  line-height:1;box-shadow:0 6px 18px rgba(131,224,0,.28)}
.nav button.cta i{margin:0;opacity:1;font-size:26px}
.nav button.cta.on{color:var(--acc-ink)}
.topo-acoes{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ic-topo{position:relative;width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  border:1px solid var(--linha2);background:none;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;padding:0}
.ic-topo svg{width:16px;height:16px;display:block}
.ic-topo .pt{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;
  background:var(--marca);border:1.5px solid var(--bg)}
.av-topo{overflow:hidden;border-color:var(--acc)}
.av-topo .av{width:100%;height:100%}
/* a folha do + */
#mais[hidden]{display:none}
/* absolute, não fixed: a folha pertence ao aparelho (#fone é relative), e
   fixed a fazia cobrir a janela inteira no desktop, escapando da moldura.
   É o mesmo posicionamento do #cenas, que é a mesma peça — folha que sobe. */
#mais{position:absolute;inset:0;z-index:35;display:flex;align-items:flex-end}
#mais .mais-fundo{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
#mais .mais-folha{position:relative;width:100%;background:var(--sup);
  border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--linha2);
  padding:10px 18px max(18px,env(safe-area-inset-bottom))}
#mais .puxador{width:38px;height:4px;border-radius:99px;background:var(--linha2);margin:0 auto 14px}
#mais .mais-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:none;border:0;padding:15px 4px;color:var(--ink);font:600 15px var(--f-ui);cursor:pointer}
#mais .mais-item + .mais-item{border-top:1px solid var(--linha)}
#mais .mais-item i{font-style:normal;font-size:19px;width:24px;text-align:center;color:var(--acc)}
#mais .mais-item small{display:block;font:400 11.5px var(--f-ui);color:var(--ink3);margin-top:2px}
/* o item que o board pede e o app ainda não tem. Não some da lista — some da
   lista seria esconder o que falta; fica visível, apagado e sem clique, e o
   subtítulo diz por quê. Laranja tracejado é a mesma marca da classe .casca. */
#mais .mais-item.casca{opacity:.5;cursor:default}
#mais .mais-item.casca i{color:var(--marca)}
#mais .mais-item.casca small{color:var(--marca)}
.nav button .badge{
  display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:99px;
  background:var(--up);color:#0A1100;font-size:9px;font-weight:800;margin-left:3px;padding:0 4px;
}

/* efeitos / o que mexeu */
.mexeu{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.mexeu .l{display:flex;align-items:center;gap:11px;padding:12px 13px}
.mexeu .l+.l{border-top:1px solid var(--linha)}
.mexeu .l .i{flex:1;min-width:0}
.mexeu .l .t{font-size:12.5px;font-weight:650}
.mexeu .l .d{font-size:10.5px;color:var(--ink3);margin-top:2px}
.mexeu .l .v{font-family:var(--f-disp);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

.celebra{
  text-align:center;padding:30px 20px 22px;border-bottom:1px solid var(--linha);
  background:radial-gradient(120% 90% at 50% 0%,rgba(198,255,61,.09),transparent 62%);
}
.celebra .ic{font-size:40px}
.celebra .reacao{height:200px;width:auto;object-fit:contain;object-position:top;margin:-14px auto 0;display:block;
  -webkit-mask-image:radial-gradient(120% 92% at 50% 42%,#000 60%,transparent 92%);
          mask-image:radial-gradient(120% 92% at 50% 42%,#000 60%,transparent 92%)}
.celebra h2{font-family:var(--f-disp);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.celebra p{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.55}
.celebra .big{font-family:var(--f-disp);font-size:52px;font-weight:700;color:var(--up);
  line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}

/* toast */
#toast{
  position:absolute;left:14px;right:14px;bottom:88px;z-index:20;
  background:var(--sup2);border:1px solid var(--linha2);border-radius:var(--r);
  padding:12px 14px;font-size:12.5px;box-shadow:0 12px 34px rgba(0,0,0,.5);
  opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;
}
#toast.on{opacity:1;transform:none}
#toast b{color:var(--up)}

/* 12/08: barra de versão nova.
   Fica no TOPO de propósito: o toast mora embaixo (bottom:88px) e a nav também,
   e esta barra precisa aparecer por cima de qualquer tela — inclusive com
   onboarding (z-40) ou gaveta (z-60) abertos, que é justamente quando alguém
   pode estar preso na versão velha sem saber. */
#vnova{
  position:absolute;left:0;right:0;top:0;z-index:70;
  background:var(--marca);color:#0A1100;cursor:pointer;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  font-size:12.5px;line-height:1.35;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.45);
}
#vnova b{font-weight:700}

/* 18/08 — TELA DE CARREGAMENTO. Os três primeiros segundos de quem abre eram
   preto liso: o `index.html` pinta o corpo, mas o app só desenha depois de o
   Supabase vir do CDN (script bloqueante), o net.js carregar e o boot conectar.
   Em 4G ruim isso é tempo de gente achar que quebrou e fechar.

   Mora no HTML e no CSS de propósito — nada de JS, senão ela chegaria junto com
   o problema que existe pra cobrir. Some sozinha quando o app renderiza. */
#splash{
  position:absolute;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .32s ease;
}
#splash.sai{opacity:0;pointer-events:none}
#splash .marca{display:flex;flex-direction:column;align-items:center;gap:14px}
#splash img{width:212px;height:auto;opacity:.96;display:block}
/* a assinatura: caixa alta, espaçada, com os pontos em lime — o mesmo ritmo do
   desenho, onde ela é o que sustenta a marca no vazio da tela */
#splash .assina{font:800 12px var(--f-ui),system-ui;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink);opacity:.92;white-space:nowrap}
#splash .assina i{color:var(--acc);font-style:normal;margin:0 2px}
#splash .pulso{
  width:34px;height:3px;border-radius:99px;background:var(--linha2);overflow:hidden;position:relative;
}
#splash .pulso::after{
  content:'';position:absolute;inset:0;background:var(--marca);
  transform:translateX(-100%);animation:splashPulso 1.15s ease-in-out infinite;
}
@keyframes splashPulso{ 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }
/* quem pediu menos movimento não recebe a barra correndo — fica a marca parada */
@media (prefers-reduced-motion:reduce){ #splash .pulso::after{animation:none;transform:translateX(0)} }

/* 18/08 — INSTALAR NA TELA DE INÍCIO. Faixa acima da nav, some ao ser dispensada
   e não volta (a escolha fica no aparelho). Não aparece pra quem já instalou.

   Fica no FLUXO, como irmã da nav, em vez de flutuar por cima dela: a nav não
   tem altura fixa (é padding + safe-area, que muda de aparelho pra aparelho),
   então qualquer `bottom: calc(altura + x)` seria um chute que erra em algum
   iPhone. No fluxo ela encosta na nav sozinha, em qualquer aparelho. */
#instale{
  flex:0 0 auto;margin:0 8px 8px;
  background:var(--sup);border:1px solid var(--linha2);border-radius:14px;
  padding:12px 13px;display:flex;align-items:center;gap:11px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);
}
#instale[hidden]{display:none}
#instale .tx{flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--ink2)}
#instale .tx b{color:var(--ink);font-size:12.5px}
#instale button{border-radius:10px;font:700 12px system-ui;cursor:pointer;padding:9px 12px;white-space:nowrap}
#instale .sim{background:var(--marca);color:#0A1100;border:none}
#instale .nao{background:none;color:var(--ink3);border:none;font-size:18px;line-height:1;padding:4px 6px}

/* 18/08: a gaveta de teste e a engrenagem que a abria saíram. Ela dizia de si
   mesma que "o app de verdade não tem essa tela", e um dos quatro botões
   (`resetar`) apagava o estado do aparelho sem perguntar. Com ela foram junto
   a barra `.status` — que só existia pra segurar a engrenagem — e o toast que
   mandava usar o ⚙: apontar pra um botão que não existe mais é o defeito de
   sempre, vocabulário revogado que sobrevive na tela. */

/* 07/08: folha do cenário da vitrine — miniatura de verdade da quadra, porque
   nome de superfície ("saibro", "grama") não diz nada até você ver a cor. */
#cenas{position:absolute;inset:0;background:rgba(11,8,6,.78);z-index:30;display:none;align-items:flex-end}
#cenas.on{display:flex}
#cenas .cx{width:100%;background:var(--sup);border-top:1px solid var(--linha2);
  border-radius:14px 14px 0 0;padding:18px 18px max(20px,env(safe-area-inset-bottom));
  max-height:82%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#cenas h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-weight:700}
#cenas .sub{font-size:11.5px;color:var(--ink3);margin-bottom:14px}
.qgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;padding:0;border:2px solid transparent;
  background:#0F0C09;aspect-ratio:16/10}
.qcard img{width:100%;height:100%;object-fit:cover;display:block}
.qcard span{position:absolute;left:0;right:0;bottom:0;padding:14px 9px 7px;text-align:left;
  font:700 11.5px system-ui;color:#FBF6EE;background:linear-gradient(180deg,transparent,rgba(11,8,6,.9))}
.qcard.on{border-color:var(--acc)}
.qcard.on span{color:var(--acc)}

.vazio{text-align:center;padding:46px 24px;color:var(--ink3);font-size:12.5px;line-height:1.6}
.vazio .ic{font-size:34px;opacity:.4;display:block;margin-bottom:10px}

/* ===== RADAR (25/08 — telas novas: disponibilidade e oponentes) ===== */
.rajuste{border:0;border-radius:var(--rp);background:var(--marca);color:#FFFEFD;font:600 11px var(--f-ui);padding:9px 13px;cursor:pointer;max-width:58%}
.dcard{cursor:pointer}
.dgrade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dcol{background:var(--sup2);border-radius:10px;min-height:64px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dcol.tem{background:rgba(131,224,0,.10);border:1px solid rgba(131,224,0,.4)}
.dcol b{margin-top:auto;font-size:8.5px;letter-spacing:.08em;color:var(--ink3)}
.dcol.tem b{color:var(--up)}
.dsl{background:var(--up);color:#0A1100;font-weight:800;font-size:9.5px;border-radius:6px;padding:2px 5px;white-space:nowrap}
.doff{font-size:9px;color:var(--ink3);font-weight:700;margin:auto 0}
.rtabs{flex:1;display:flex;gap:4px;background:var(--sup);border:1px solid var(--linha2);border-radius:var(--rp);padding:3px}
.rtab{flex:1;border:0;border-radius:var(--rp);background:transparent;color:var(--ink2);font:600 12px var(--f-ui);padding:8px 4px;cursor:pointer;white-space:nowrap}
.rtab.on{background:var(--acc);color:var(--acc-ink);font-weight:800}
/* 29/08 (board, node 120:390) — "Sua disponibilidade de jogo hoje".
   Três colunas de pílulas separadas por fio. No board há um boneco numa quarta
   coluna à esquerda; em 390pt de aparelho, quatro colunas dariam menos de 100pt
   cada e a pílula "Rápida" não caberia. O boneco saiu — ele já está na home,
   grande, e aqui era decoração. */
.dhoje{display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  background:rgba(11,11,11,.82);border:1px solid var(--linha);border-radius:20px;padding:14px 4px}
.dhoje .col{padding:0 10px;min-width:0}
.dhoje .col + .col{border-left:1px solid var(--linha)}
.dhoje .cab{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.dhoje .cab i{font-style:normal;font-size:12px;color:var(--acc)}
.dhoje .cab b{font:700 11px var(--f-ui);color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.dhoje button{display:block;width:100%;margin-bottom:7px;padding:8px 4px;
  border-radius:99px;border:1px solid var(--ink3);background:transparent;
  color:var(--ink3);font:400 11.5px var(--f-ui);cursor:pointer}
.dhoje button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.rfiltro{border:1px solid var(--linha2);border-radius:var(--rp);background:var(--sup);color:var(--ink2);font:600 12px var(--f-ui);padding:9px 13px;cursor:pointer;white-space:nowrap}
.oc .txt small{display:block;font-size:11px;color:var(--ink3);margin-top:3px}
.odir{display:flex;flex-direction:column;gap:7px;align-items:stretch;flex:0 0 122px}
.olivre{color:var(--up);font-size:10.5px;font-weight:700;text-align:right;white-space:nowrap}
.oconv{border:0;border-radius:var(--rp);background:var(--marca);color:#FFFEFD;font:700 12.5px var(--f-ui);padding:10px 8px;cursor:pointer}
.operf{border:1px solid var(--linha2);border-radius:var(--rp);background:transparent;color:var(--ink2);font:600 12px var(--f-ui);padding:9px 8px;cursor:pointer}
.dpil{background:var(--up);color:#0A1100;font-weight:800;font-size:12px;border-radius:8px;padding:8px 10px;white-space:nowrap}
.dx{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--linha2);border-radius:50%;background:none;color:var(--ink2);font-size:15px;cursor:pointer}

/* ===== INÍCIO — a home vitrine (organização Tennis Clash, sem loot) ===== */
.ini{position:relative;min-height:100%;display:flex;flex-direction:column}
.ini .cena{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center top}
.ini .scrim{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,8,6,.55) 0%,rgba(11,8,6,.12) 24%,rgba(11,8,6,.08) 52%,rgba(11,8,6,.34) 82%,rgba(11,8,6,.62) 100%)}
.ini .hud{position:relative;z-index:2;padding:8px 16px 0}
.ini .linha1{display:flex;align-items:center;gap:10px}
/* 25/08 (telas novas): o topo da home é logo + sino + avatar */
.ini .logo{height:30px;width:auto;display:block;margin-right:auto;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
.ini .av-topo{width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;cursor:pointer;
  border:2px solid var(--acc);background:var(--sup2);position:relative}
.ini .av-topo .ro{position:absolute;inset:0;background-repeat:no-repeat}
.ini .temp{flex:1;background:rgba(30,23,20,.72);border:1px solid var(--linha);border-radius:99px;
  padding:7px 14px;font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.ini .temp b{color:var(--ink);font-weight:700}
.ini .temp .dot{width:6px;height:6px;border-radius:50%;background:var(--up)}
.ini .ic{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:rgba(30,23,20,.72);border:1px solid var(--linha);
  display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;backdrop-filter:blur(6px);cursor:pointer}
/* 09/08: o ◈ era o terceiro círculo idêntico e ninguém achava o trocador de
   cenário. Mesmo padrão do trilho do vestiário — o ícone PRÉ-VISUALIZA a
   escolha atual: o próprio cenário aparece dentro do botão, com o glifo por
   cima. Fica diferente dos vizinhos sem virar enfeite, e diz o que faz. */
.ini .ic.vitrine{background-size:cover;background-position:center 62%;border-color:var(--linha2)}
.ini .ic.vitrine::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, rgba(21,16,13,.15), rgba(21,16,13,.72));}
.ini .ic.vitrine i{position:relative;z-index:1;font-style:normal;font-size:15px;
  color:var(--acc);text-shadow:0 1px 3px rgba(0,0,0,.85)}
.ini .ic .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;line-height:17px;
  border-radius:99px;background:var(--up);color:#0A1100;font-size:10px;font-weight:800;text-align:center;padding:0 4px}
/* (51) o ponto de recado: PONTO e não número, porque S.novidades conta AÇÃO e
   recado não é ação. Mora embaixo pra não brigar com o badge de cima. O valor
   vem sempre do carimbo no banco (net.js netAvisos) — nunca de um zero local. */
.ini .ic .ponto{position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
  background:var(--up);border:2px solid rgba(30,23,20,.9)}
#nav .ponto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);
  vertical-align:top;margin-top:2px}
.ini /* 29/08 (board, node 35:756) — O CARD DE PROGRESSO DA HOME.
   Substitui o anel do .degrau. O anel media a categoria num círculo de 58px;
   o board mede na horizontal, com a classe em corpo grande à esquerda e a
   barra atravessando o card. A régua é a mesma (categoria, não classe) — o
   que muda é a forma, e a forma horizontal cabe mais informação: os pontos, o
   próximo degrau e o quanto falta, tudo na mesma linha de leitura. */
.hcard{margin-top:11px;background:rgba(11,11,11,.82);border:1px solid var(--linha);
  border-radius:20px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hcard .l1{display:flex;align-items:baseline;gap:8px}
.hcard .cls{font:700 34px/1 var(--f-disp);color:var(--ink);letter-spacing:-.02em}
.hcard .suf{font:600 14px var(--f-ui);color:var(--acc);margin-left:-4px}
.hcard .pts{flex:1;text-align:right;font:700 17px var(--f-ui);color:var(--ink);white-space:nowrap}
.hcard .prox{font:700 17px var(--f-ui);color:var(--ink3)}
.hcard .faltam{text-align:right;font:600 11px var(--f-ui);color:var(--acc);margin-top:3px}
.hcard .barra{height:6px;border-radius:99px;background:var(--acc-ink);margin:9px 0 8px;overflow:hidden}
.hcard .barra i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.hcard .fim{font:400 12px/1.5 var(--f-ui);color:var(--ink3)}
.hcard .fim b{color:var(--ink2)}

/* O card "Let's Ranket" — o convite pra entrar no radar. É o único bloco da
   home do board com botão LIME, e não é exceção à regra de :20-34: ele não
   compete com o laranja de "Ver oponentes", está um degrau abaixo dele na
   hierarquia. Some quando a pessoa já tem disponibilidade marcada, senão
   viraria moldura pedindo o que já foi feito. */
.hlets{margin-top:11px;background:rgba(11,11,11,.86);border:1px solid var(--linha);
  border-radius:20px;padding:20px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hlets h3{font:700 30px/1.06 var(--f-disp);color:var(--ink);letter-spacing:-.02em}
.hlets p{font:300 12.5px/1.5 var(--f-ui);color:var(--ink3);margin:10px 0 16px;max-width:30ch}
.hlets button{width:100%;border:0;border-radius:var(--rp);padding:14px;
  background:var(--acc);color:var(--acc-ink);font:700 11.5px var(--f-ui);
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer}

.degrau{margin-top:11px;background:rgba(10,14,12,.78);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:13px}
/* 25/08: o anel de progressão das telas novas — progresso da CATEGORIA (a
   mesma conta da barra antiga), com a etiqueta C4 no centro */
.ini .degrau .anel{position:relative;width:58px;height:58px;flex:0 0 58px}
.ini .degrau .anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.ini .degrau .anel .tri{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-disp);font-weight:800;font-size:19px}
.ini .degrau .anel .tri small{font-size:11px;color:var(--up);font-weight:800;margin-left:1px}
.ini .degrau .dtx{flex:1;min-width:0}
.ini .degrau .top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--ink3)}
.ini .degrau .top b{font-family:var(--f-disp);font-size:14px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.ini .degrau .bar{height:6px;border-radius:99px;background:var(--sup2);margin-top:8px;overflow:hidden}
.ini .degrau .bar i{display:block;height:100%;background:var(--up);border-radius:99px}
.ini .degrau .fim{font-size:10px;color:var(--ink3);margin-top:6px}
/* 28/08: o painel do PROFESSOR ocupa o lugar do degrau — mesmo material
   (vidro escuro sobre a cena), conteúdo outro: ele não sobe de classe, ele
   tem turma. Três números e nada mais: alunos, aulas na semana e quem espera
   resposta. `.q` acende em lime quando há alguém esperando — número que pede
   ação não pode ter a mesma cor de número que só informa. */
.ini .painel{margin-top:11px;background:rgba(10,14,12,.78);border:1px solid var(--linha);border-radius:16px;
  padding:11px 6px;backdrop-filter:blur(6px);display:grid;grid-template-columns:repeat(3,1fr)}
.ini .painel .q{text-align:center;position:relative}
.ini .painel .q+.q::before{content:'';position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--linha)}
.ini .painel .q b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1.1}
.ini .painel .q small{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.ini .painel .q.acende b{color:var(--up)}
.ini .palco{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:220px;z-index:1;padding:0 18px}
.ini .sombra{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:170px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(11px);z-index:0}
.ini .glow{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:230px;height:66px;border-radius:50%;
  background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.30;filter:blur(6px)}
.ini .boneco{position:relative;height:300px;max-height:44vh;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.ini .boneco img{height:100%;width:auto;display:block}
/* 06/08: o boneco virou corpo inteiro e ficou mais alto — a placa no topo
   passou a cortar a cabeça. Desceu pro pé do palco, sobre a sombra. */
.ini .placa{position:absolute;bottom:2px;left:0;right:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 14px;padding:12px 18px;border-radius:var(--rp);
  border:1px solid var(--acc);background:rgba(11,11,11,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.placa .pos{flex:0 0 auto;font:700 9.5px var(--f-ui);color:var(--ink);
  letter-spacing:.11em;text-transform:uppercase}
.ini .placa .nm{font:700 15px var(--f-ui);color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.ini .placa .meta{display:inline-flex;align-items:center;gap:7px;margin-top:6px;background:rgba(21,16,13,.62);border:1px solid var(--linha);border-radius:99px;padding:4px 12px;font-size:11.5px;color:var(--ink2);backdrop-filter:blur(4px)}
.ini .placa .meta b{font-family:var(--f-disp);font-size:14px;color:var(--ink)}
.ini .placa .meta .pil2{background:var(--up);color:#0A1100;font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.06em}
.ini .acao{position:relative;z-index:2;padding:0 16px 8px}
/* 25/08 (telas novas): a ação da home é a pílula LARANJA */
.ini .acao .big{width:100%;border:0;border-radius:var(--rp);padding:16px;background:var(--marca);color:var(--marca-ink);font-weight:800;font-size:16px;letter-spacing:.01em;box-shadow:0 8px 24px rgba(255,106,0,.25);cursor:pointer;font-family:var(--f-ui)}
.ini .acao .big small{display:block;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.62;margin-top:3px}
.ini .acao .big.up{background:var(--up);box-shadow:0 8px 24px rgba(198,255,61,.18)}
.ini .acao .big.marcado{background:rgba(30,23,20,.82);color:var(--ink);border:1px solid var(--linha2);box-shadow:none;backdrop-filter:blur(6px)}
.ini .acao .big.marcado small{opacity:.8;color:var(--ink3)}
.ini .strip-wrap{position:relative;z-index:2;padding:0 16px 14px}
/* Ações secundárias sob o botão grande. Vidro escuro e texto discreto de
   propósito: elas precisam EXISTIR sem competir com o registro, que é o elo
   frágil do ciclo e a única ação que merece peso visual. */
.acoes-sec{display:flex;gap:7px;margin-top:9px}
.acoes-sec button{flex:1;padding:9px 4px;border-radius:10px;cursor:pointer;
  background:rgba(30,23,20,.72);border:1px solid var(--linha);color:var(--ink2);
  font:600 11px var(--f-ui);backdrop-filter:blur(6px);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.acoes-sec button:active{transform:scale(.97)}
.ini .strip-rot{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.ini .strip-rot a{color:var(--ink3);text-decoration:none;cursor:pointer}
.ini .strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ini .strip::-webkit-scrollbar{display:none}
/* 19/08 — notícias do esporte, fechando a home. Lista vertical e não carrossel:
   manchete que passa de raspão não é lida, e aqui a peça É o texto. A miniatura
   é opcional de propósito — notícia sem foto continua valendo, e exigir imagem
   faria a curadoria travar por falta de arte. */
.ini .news-wrap{position:relative;z-index:2;padding:0 16px 20px}
.ini .news-rot{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.ini .news{display:flex;flex-direction:column;gap:8px}
.ini .nitem{display:flex;gap:10px;align-items:center;text-decoration:none;
  background:rgba(30,23,20,.82);border:1px solid var(--linha);border-radius:10px;
  padding:10px 12px;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}
.ini .nitem:active{background:var(--sup2)}
.ini .nthumb{flex:0 0 52px;width:52px;height:52px;border-radius:8px;object-fit:cover;
  background:var(--sup2);display:block}
.ini .ntxt{flex:1;min-width:0}
.ini .ntxt b{display:block;font-size:12.5px;color:var(--ink);font-weight:700;line-height:1.32;
  /* duas linhas e reticências: manchete longa não pode empurrar a nav pra fora */
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ini .ntxt small{display:block;font-size:10.5px;color:var(--ink3);margin-top:3px}
.ini .nseta{color:var(--ink3);font-size:15px;flex:0 0 auto}
/* 19/08 — o espaço de mídia da home (inventário próprio, no molde do Cartola:
   uma peça só, no fim do feed, vendida por nós e não sorteada por rede).

   O `aspect-ratio` no WRAPPER, não na imagem, é o que impede o pulo de layout:
   a altura fica reservada antes de o JPEG chegar, então o strip acima não
   desce sozinho no meio da leitura no 4G da quadra. `--ads-prop` vem da
   campanha; o valor aqui é só o padrão de quem não declarou. */
.ini .ads-wrap{position:relative;z-index:2;padding:0 16px 18px}
.ini .ads-rot{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;margin-bottom:6px;opacity:.75}
.ini .ads{display:block;aspect-ratio:var(--ads-prop,1/1);border-radius:12px;
  overflow:hidden;border:1px solid var(--linha);background:var(--sup);
  -webkit-tap-highlight-color:transparent}
.ini .ads img{width:100%;height:100%;object-fit:cover;display:block}
/* peça que é LOGO, não foto: cabe inteira e respira, em vez de ser cortada */
.ini .ads.conter{background:var(--sup2);display:flex;align-items:center;justify-content:center;padding:8% 12%}
.ini .ads.conter img{width:100%;height:100%;object-fit:contain}
.ini .ads:active{transform:scale(.99)}
.ini .mcard{flex:0 0 auto;min-width:158px;background:rgba(30,23,20,.82);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px)}
.ini .mcard .mic{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--sup2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink2)}
.ini .mcard .mtx{min-width:0}
.ini .mcard .mtx b{font-size:11.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini .mcard .mtx small{font-size:10px;color:var(--ink3)}
.ini .mcard .mv{margin-left:auto;font-family:var(--f-disp);font-size:15px;font-weight:700;color:var(--up)}

/* ===== AMBIENTE NOTURNO — a mesma quadra Saibro Noturno corre por baixo das telas internas ===== */
#amb{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:
    linear-gradient(180deg,rgba(11,8,6,.64) 0%,rgba(11,8,6,.44) 15%,rgba(11,8,6,.42) 46%,rgba(11,8,6,.58) 70%,rgba(11,8,6,.90) 100%),
    var(--cena-url,url('../quadras/saibro-noite.jpg')) center 14% / cover no-repeat;}
#fone.noturno #amb{opacity:1}
/* topo e nav viram vidro pra a quadra correr contínua por baixo */
#fone.noturno .topo{background:rgba(21,16,13,.60);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom-color:rgba(122,106,92,.18)}
#fone.noturno .nav{background:rgba(21,16,13,.64);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top-color:rgba(122,106,92,.18)}
/* superfícies flutuam como painéis de vidro sobre a quadra */
#fone.noturno .card,
#fone.noturno .tab,
#fone.noturno .placar,
#fone.noturno .mexeu{background:rgba(30,23,20,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(122,106,92,.30)}
#fone.noturno .card.clic:active{background:rgba(40,32,26,.84)}
#fone.noturno .stats{background:rgba(122,106,92,.18);border-color:rgba(122,106,92,.30)}
#fone.noturno .stats>div{background:rgba(30,23,20,.70);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#fone.noturno .tab .cab{border-bottom-color:rgba(122,106,92,.2)}
#fone.noturno .ln{border-bottom-color:rgba(122,106,92,.14)}
#fone.noturno .ln.eu{background:rgba(201,102,60,.15)}
#fone.noturno .selo{background:rgba(30,23,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-color:rgba(122,106,92,.22)}
#fone.noturno .sets b{background:rgba(30,23,20,.62)}
/* 15/08 — o `:not(.on)` é o conserto, e a razão é de especificidade.
   Este seletor tem ID (1,2,0) e o `.chip.on` tem só classes (0,2,0), então no
   modo noturno o fundo translúcido escuro ganhava do fundo claro do chip
   SELECIONADO — que continuava com `color:var(--acc-ink)`, quase preto. Dava
   preto sobre preto: 1,05:1 medido, contra os 4,5:1 que o WCAG AA pede pra
   texto pequeno. Fora do noturno o mesmo chip dá 19,07:1.
   O vidro fosco existe pra o chip NÃO escolhido se dissolver na cena; o
   escolhido precisa do oposto, então ele fica de fora da regra. */
#fone.noturno .chip:not(.on){background:rgba(30,23,20,.60);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#fone.noturno .abas{background:rgba(21,16,13,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#fone.noturno #toast{background:rgba(36,28,24,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* o hero deixa a quadra aparecer e ganha um respiro de luz lime no topo, como a celebra */
#fone.noturno .hero{background:radial-gradient(120% 80% at 50% 0%,rgba(198,255,61,.07),transparent 60%);border-bottom-color:rgba(122,106,92,.18)}
/* texto que pousa direto na quadra (rótulos de seção, herói, notas soltas) ganha respiro pra não brigar com o saibro */
#fone.noturno .rot,
#fone.noturno .hero .nm,#fone.noturno .hero .n,#fone.noturno .hero .sub,#fone.noturno .hero .lb,#fone.noturno .hero .d,
#fone.noturno .sec>.nota,#fone.noturno .vazio{text-shadow:0 1px 10px rgba(11,8,6,.85),0 1px 2px rgba(11,8,6,.7)}

/* ===== VESTIÁRIO / PERSONALIZAR ===== */
.ini .boneco{cursor:pointer}
.edit-hint{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:3;
  background:rgba(21,16,13,.74);border:1px solid var(--linha2);border-radius:99px;
  padding:5px 12px;font-size:10px;letter-spacing:.06em;color:var(--ink2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
/* 07/08: o vestiário virou coluna de altura fixa — palco em faixa que não sai do
   lugar, e o PAINEL é quem rola. Antes o palco era `sticky` e o painel passava
   POR BAIXO dele, tapando os controles.
   Como a tela toda não rola mais, a cena pode voltar a ser `absolute`: ela não
   estica com o conteúdo, então some o motivo do `fixed` — e com ele o risco do
   Safari iOS, onde `fixed` pula quando a barra de endereço aparece e some. */
.vest{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.vest .cena{position:absolute;inset:0;z-index:0;background-position:center top;background-repeat:no-repeat;background-size:cover;
  background-image:var(--vest-url,url('../vestiario/tunel.jpg')),
    radial-gradient(120% 70% at 50% 16%,rgba(96,54,32,.55),transparent 70%),
    linear-gradient(180deg,#1c1410,#0B0806);}
/* 06/08: o personagem é o preview inteiro, ancorado no chão do vestiário — de pé
   no lugar, não flutuando. 07/08: faixa de altura fixa no topo da coluna; o
   escudo e o patrocinador agora já vêm desenhados dentro do próprio canvas. */
/* 07/08 (3ª volta): o personagem estava GRANDE DEMAIS e por isso lia como
   adesivo colado na frente do vestiário. Integrar é questão de escala e de
   ancoragem: ele volta pro tamanho medido (altura ~52% da tela, pés na linha do
   chão da cena) — o mesmo enquadramento do QA, onde ele fica DENTRO da sala.
   Ganha-se de brinde a margem que o trilho de ícones precisava. */
.vpalco{position:absolute;inset:0;z-index:2}
.vpalco img.bcv{position:absolute;width:auto;transform:translate(-50%,-100%);
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.vpalco .vsombra{position:absolute;border-radius:50%;background:#000;filter:blur(12px);
  transform:translate(-50%,-50%);pointer-events:none}
.vpalco .vglow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--camisa),transparent);
  transform:translate(-50%,-50%);opacity:.26;filter:blur(9px)}

/* Botão de confirmar. Só aparece quando há mudança pendente — botão que vive
   aceso vira parte do cenário e para de significar "falta fazer isso".
   Mora DENTRO da bandeja: flutuando sobre a cena ele cobria as pernas do
   personagem, que é justamente o que a pessoa está tentando olhar. */
.vestir{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;
  padding:14px;cursor:pointer;background:var(--acc);color:var(--acc-ink);
  font:800 13px system-ui;letter-spacing:.08em;text-transform:uppercase}
.vestir:active{transform:scale(.985)}
/* bandeja que carrega só o botão (categoria fechada, mas troca pendente) */
.vtray.so-vestir{padding-top:14px}
/* 26/08: a linha de ações da bandeja. Lado a lado quando os dois existem —
   o `margin-top` do .vestir já dá o respiro, então a linha não repete. */
.vtray-acoes{display:flex;gap:8px;align-items:stretch}
.vtray-acoes .vestir{margin-top:12px}
.vtray-acoes > *{flex:1}
/* O Concluir dentro da bandeja: mesma altura e mesmo peso do Vestir, na cor da
   marca — é saída de fluxo, não a ação principal da tela. Quando está sozinho
   ocupa a linha inteira (o flex:1 acima), que é o caso mais comum: escolher
   sem trocar nada e sair. */
.vest-concluir-tray{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;
  padding:14px;cursor:pointer;background:var(--marca);color:#FFFEFD;
  font:800 13px system-ui;letter-spacing:.08em;text-transform:uppercase}
.vest-concluir-tray:active{transform:scale(.985)}
.vest-preview .vfig{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.vest-preview .vfig .chao{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(11,8,6,.55) 55%,rgba(11,8,6,.9));pointer-events:none}
.vest-preview .vfig .boneco{position:relative;z-index:1;height:97%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.vest-preview .vfig .boneco > .bfig{height:100%}
.vest-preview .vfig .sombra{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:150px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(12px)}
.vest-preview .vfig .glow{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:190px;height:54px;border-radius:50%;background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.32;filter:blur(7px)}
/* 07/08: a figura é uma imagem só — o canvas já entrega o boneco pintado com o
   escudo e o patrocinador desenhados no peito. Nada de máscara nem de multiply:
   a composição pixel-exata mora no canvas, não no CSS, porque no CSS a imagem e
   a máscara são dimensionadas por regras diferentes e nunca coincidem. */
.bfig{position:relative;display:block;height:100%}
.bfig img{display:block;height:100%;width:auto;margin:0 auto}

/* 06/08: switch de esporte. Tênis e beach são trilhos paralelos — trocar aqui
   troca Nível, divisão, quadro e pontos de uma vez. Nada é convertido. */
.esp-sw{display:flex;gap:4px;margin-top:9px;padding:3px;border-radius:999px;
  background:rgba(11,8,6,.5);border:1px solid rgba(232,222,210,.12);backdrop-filter:blur(8px);width:fit-content}
.esp-sw button{border:0;cursor:pointer;padding:5px 15px;border-radius:999px;background:transparent;
  color:var(--ink3);font:700 11px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;transition:.18s}
.esp-sw button.on{background:var(--acc);color:#14100c}

/* os dois esportes na ficha, lado a lado */
.dois-esp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dois-esp .de{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;cursor:pointer;text-align:left;
  background:rgba(30,23,20,.6);border:1px solid rgba(232,222,210,.10)}
.dois-esp .de.on{border-color:rgba(198,255,61,.45);background:rgba(198,255,61,.09)}
.dois-esp .de-ic{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:rgba(232,222,210,.07);color:var(--ink2);font-size:15px}
.dois-esp .de.on .de-ic{background:rgba(198,255,61,.16);color:var(--acc)}
.dois-esp .de-tx b{display:block;font-size:12.5px;color:var(--ink)}
.dois-esp .de-tx small{display:block;font-size:10px;color:var(--ink3);white-space:nowrap}

/* carrossel de atalhos da home. Registrar fica FORA daqui, no botão fixo —
   o registro é o elo frágil do ciclo e não pode depender de rolagem. */
.wgt-wrap{position:relative;z-index:1;margin-top:14px}
.wgt{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding:0 18px 2px}
.wgt::-webkit-scrollbar{display:none}
.wgt .w{scroll-snap-align:start;flex:0 0 168px;display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left;
  background:rgba(30,23,20,.80);border:1px solid rgba(232,222,210,.10);backdrop-filter:blur(10px)}
.wgt .w:active{transform:scale(.975)}
.wgt .w .wic{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(198,255,61,.12);color:var(--acc);font-size:15px}
.wgt .w .wfig{flex:0 0 34px;height:42px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.wgt .w .wfig img{height:64px;width:auto;object-fit:contain;object-position:top}
.wgt .w .wtx{min-width:0}
.wgt .w .wtx b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgt .w .wtx small{display:block;font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgt .w.vest{background:linear-gradient(135deg,rgba(198,255,61,.14),rgba(30,23,20,.86))}

/* 07/08: escurecimento MUITO mais leve. O anterior fechava em preto sólido a
   74% da tela pra dar fundo ao painel de controles — e junto com o painel foi
   embora o motivo. Agora o vestiário precisa aparecer: é a sala que integra o
   personagem, e a bandeja já tem o próprio fundo. */
.vest .scrim{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,8,6,.38) 0%,rgba(11,8,6,.10) 26%,rgba(11,8,6,.20) 62%,rgba(11,8,6,.55) 100%)}
.vest .palco{position:relative;z-index:1;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px}
.vest .palco .sombra{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:150px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(11px)}
.vest .palco .glow{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:200px;height:56px;border-radius:50%;background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.30;filter:blur(6px)}
.vest .palco .boneco{position:relative;z-index:1;height:288px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.vest .palco .boneco img{height:100%;width:auto;display:block}
/* =========================================================================
   07/08 (2ª volta) — O VESTIÁRIO NÃO ROLA.
   A lista de controles empilhada obrigava a rolar, e rolar num provador é
   errado: você perde o personagem de vista bem na hora de julgar a roupa.
   Agora a tela é o personagem inteiro, e as categorias vivem num TRILHO de
   ícones na borda. Tocar um ícone abre só as opções DELE numa bandeja curta;
   tocar de novo fecha. Nenhuma vem aberta — é o que deixa a tela cheia de
   opção sem ficar poluída.
   ========================================================================= */
.vrail{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:6;
  display:flex;flex-direction:column;gap:9px;max-height:calc(100% - 16px);overflow-y:auto;
  scrollbar-width:none}
.vrail::-webkit-scrollbar{display:none}
.vrail button{width:53px;padding:7px 0 5px;border-radius:15px;cursor:pointer;
  background:rgba(21,16,13,.70);border:1px solid var(--linha2);color:var(--ink2);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:.16s}
.vrail button:active{transform:scale(.94)}
.vrail button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.vrail .vi{height:22px;display:grid;place-items:center;font-size:17px;line-height:1}
.vrail .vl{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-weight:700}
/* o ícone PRÉ-VISUALIZA a escolha atual: a cor é a bolinha da cor, a pessoa é o
   rosto de quem está vestido. Assim o trilho informa sem precisar de rótulo longo. */
.vrail .sw{width:21px;height:21px;border-radius:50%;border:2px solid rgba(251,246,238,.6)}
.vrail .mn{width:23px;height:23px;border-radius:50%;overflow:hidden;position:relative;
  background:rgba(0,0,0,.35);background-repeat:no-repeat}

.vtray{position:absolute;left:0;right:0;bottom:0;z-index:7;
  background:linear-gradient(180deg,rgba(11,8,6,.35),rgba(19,14,11,.97) 20%);
  border-top:1px solid var(--linha2);
  padding:13px 16px max(15px,env(safe-area-inset-bottom));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.vtray .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:11px}
.vtray .tt b{font:700 10px system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.vtray .tt span{font-size:10.5px;color:var(--ink3);text-align:right}
/* 6 colunas: com a 11ª cor (o preto), 5 colunas jogava a paleta pra TRÊS
   fileiras e a bandeja passava a rolar — e rolagem num provador é erro de
   conceito, faz perder o personagem de vista bem na hora de julgar a roupa.
   Em 6, tanto os 9 personagens quanto as 11 cores cabem em duas fileiras. */
.vgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
/* O rosto entra como BACKGROUND posicionado pelo retângulo medido (ver ROSTO,
   lá embaixo), não como <img> esticada. A imagem esticada era o defeito: um
   deslocamento só pros 9 bonecos, e o sprite -mini (52x150) ampliado a 220%. */
.vopt{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;padding:0;
  background:rgba(30,23,20,.72);background-repeat:no-repeat;border:2px solid transparent}
.vopt.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(198,255,61,.28)}
/* Anel interno nos swatches de cor: sem ele o preto se dissolve no painel
   escuro e a opção fica invisível — cor que não aparece não é opção. */
.vopt.cor{box-shadow:inset 0 0 0 1px rgba(251,246,238,.26)}
.vopt.cor.on{box-shadow:inset 0 0 0 1px rgba(251,246,238,.26),0 0 0 2px rgba(198,255,61,.28)}
.pick{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pick::-webkit-scrollbar{display:none}
.pboneco{flex:0 0 auto;width:60px;height:60px;border-radius:50%;overflow:hidden;position:relative;
  background:rgba(30,23,20,.72);border:2px solid transparent;cursor:pointer;padding:0}
.pboneco img{position:absolute;left:50%;top:-6%;transform:translateX(-50%);width:220%}
.pboneco.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(198,255,61,.25)}
.pcores{display:flex;flex-wrap:wrap;gap:10px}
.pcor{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.pcor.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(198,255,61,.3)}
.seg2{display:flex;gap:8px}
/* 29/08 (board, node 29:256): o seletor de TRÊS. O .seg2 é a peça de duas
   escolhas; gênero tem três e no desenho elas são pílulas separadas, com
   contorno lime em todas e preenchimento lime só na ativa. */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{border:1px solid var(--acc);background:transparent;color:var(--ink3);
  border-radius:10px;padding:11px 4px;font:700 12px var(--f-ui);cursor:pointer}
.seg3 button.on{background:var(--acc);color:var(--acc-ink)}
/* rótulo em negrito ACIMA do campo, como o board faz em "Data de nascimento"
   e "Bio" — diferente do .rot, que é caixa-alta e menor */
.onb-rot{font:700 14px var(--f-ui);color:var(--ink);margin:16px 0 8px}
.onb-area{width:100%;min-height:86px;padding:15px;border-radius:16px;resize:vertical;
  background:rgba(30,23,20,.72);border:1px solid rgba(255,254,253,.55);color:var(--ink);
  font:400 15px var(--f-ui);margin-bottom:4px}
.onb-area:focus{outline:none;border-color:var(--acc)}
/* o aceite: botão, não <input type=checkbox> — o app inteiro pinta estado por
   classe .on e re-render, e um checkbox nativo guardaria estado no DOM, que o
   render() destrói. A caixinha é o ::before. */
.onb-check{display:flex;align-items:flex-start;gap:10px;background:none;border:0;
  padding:12px 0;cursor:pointer;text-align:left;color:var(--ink);font:400 13px var(--f-ui)}
.onb-check::before{content:'';flex:0 0 18px;width:18px;height:18px;border-radius:3px;
  border:2px solid var(--acc);margin-top:1px}
.onb-check.on::before{background:var(--acc);
  box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 9px var(--acc)}
/* o texto inteiro num <span>: sendo filhos diretos do flex, "Termos de Uso"
   e o ponto final viravam dois itens e o gap de 10px caía entre eles. */
.onb-check span{flex:1;line-height:1.45}
.onb-check u{text-underline-offset:2px}
.seg2 button{flex:1;padding:12px 10px;border-radius:8px;background:rgba(30,23,20,.7);border:1px solid var(--linha2);
  color:var(--ink2);font-size:13px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg2 button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

/* ===== CADASTRO / ONBOARDING ===== */
#onb{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:#060A00;overflow:hidden}
#onb.on{display:flex}
#onb .onb-bg{position:absolute;inset:0;z-index:0;background:var(--cena-url,url('../quadras/saibro-noite.jpg')) center/cover}
#onb .onb-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,8,6,.74),rgba(11,8,6,.88) 52%,rgba(11,8,6,.97))}
#onb .onb-wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:18px 22px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
#onb .onb-wrap::-webkit-scrollbar{width:0}
#onb .onb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:30px}
#onb .onb-voltar{width:30px;height:30px;border-radius:50%;border:1px solid var(--linha2);background:rgba(30,23,20,.6);color:var(--ink2);font-size:15px;cursor:pointer}
#onb .onb-dots{display:flex;gap:6px;margin-left:auto}
#onb .onb-dots span{width:6px;height:6px;border-radius:99px;background:var(--linha2);transition:.2s}
#onb .onb-dots span.on{background:var(--acc);width:18px}
#onb .onb-brand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
/* 10/08: o "P" de placeholder virou o símbolo da marca. Sem o círculo laranja
   por baixo: o R já é laranja, e laranja sobre laranja some. Sobre o preto da
   marca o símbolo lê sozinho — é o que o próprio logo vertical faz.
   13/08: na abertura o símbolo sozinho não bastava — o nome da marca não
   aparecia ESCRITO em nenhum lugar do app, e esta é a única tela onde alguém
   ainda não sabe como o app se chama. Entra o lockup horizontal (o lettering
   já é branco no arquivo, então lê sobre o preto). Altura livre: o arquivo é
   3,43:1 e travar num quadrado de 78px o deixaria com 23px de altura útil. */
#onb .onb-mark{width:min(272px,74%);display:flex;align-items:center;justify-content:center}
#onb .onb-mark img{width:100%;height:auto;display:block}
#onb .onb-brand h1{font-family:var(--f-disp);font-size:29px;text-transform:uppercase;letter-spacing:.03em}
#onb .onb-brand p{font-size:13px;color:var(--ink2);max-width:290px;line-height:1.5}
#onb .onb-acts{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
#onb .onb-fine{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:8px;line-height:1.5}
#onb .big{width:100%;padding:15px;border:0;border-radius:var(--rp);background:var(--marca);color:var(--marca-ink);font-weight:800;font-size:15px;cursor:pointer;font-family:var(--f-ui)}
#onb .big.alt{background:rgba(20,26,23,.72);color:var(--ink);border:1px solid var(--linha2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* 26/08 (telas do Figma) — o KICKER passa a vir ABAIXO do título.
   `column-reverse` em vez de mexer no markup: a ordem "kick, depois h2" se
   repete em NOVE telas do cadastro, e trocar as nove à mão é nove chances de
   deixar uma pra trás. O CSS vira a ordem de uma vez, e quem escrever a décima
   tela continua escrevendo na ordem antiga sem quebrar nada.
   A cor do kick já era `--up` (#83E000) — idêntica ao verde do desenho. */
#onb .onb-head{margin:4px 0 16px;display:flex;flex-direction:column-reverse;align-items:flex-start}
#onb .onb-head.center{text-align:center;align-items:center}
#onb .onb-kick{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--up);font-weight:700;margin:6px 0 0}
#onb .onb-head h2{font-family:var(--f-disp);font-size:24px;line-height:1.14;letter-spacing:.01em}
/* o título ganha o ícone circular do desenho, quando a tela tiver um */
#onb .onb-head .tt{display:flex;align-items:center;gap:10px}
#onb .onb-head .tt .ico{flex:0 0 26px;width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--acc)}
/* 26/08: borda BRANCA nos campos, como no desenho — a `--linha2` some no fundo
   escuro e o campo parecia um retângulo sem contorno.
   ⚠️ ESCALA: o Figma desenha 1px num canvas de 1080, que é 2x — ou seja, MEIO
   pixel em CSS. Copiada como 1px de branco puro, a borda dobra de peso e vira
   a coisa mais forte da tela (medido: o campo gritava mais que o botão de
   ação). `.55` de opacidade devolve o peso PERCEBIDO do desenho na espessura
   que o navegador sabe desenhar. É a mesma decisão pra qualquer traço de 1px
   que vier deste arquivo. */
.onb-input{width:100%;padding:15px;border-radius:16px;background:rgba(30,23,20,.72);border:1px solid rgba(255,254,253,.55);color:var(--ink);font-size:17px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:12px}
.onb-input:focus{outline:none;border-color:var(--acc)}
/* 25/08: o seletor perdeu o escopo #onb de propósito — o formulário de
   disponibilidade do radar usa a mesma peça fora do onboarding */
#onb .onb-preview{position:relative;height:236px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px}
/* 26/08 (Figma, node 29:416): no desenho o personagem ocupa quase toda a
   tela, de pé sobre a quadra que já é o fundo do cadastro. `min-height` com
   `vh` porque a altura útil muda muito entre um iPhone SE e um Pro Max, e
   altura fixa cortava os pés num e sobrava no outro. */
#onb .onb-preview.tall{height:auto;min-height:46vh;flex:1}
#onb .onb-preview .glow{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:200px;height:56px;border-radius:50%;background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.32;filter:blur(6px)}
#onb .onb-preview .boneco{position:relative;z-index:1;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#onb .onb-preview .boneco img{height:100%;width:auto;display:block}
#onb .onb-cards{display:flex;flex-direction:column;gap:10px}
#onb .onb-card{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border-radius:16px;background:rgba(30,23,20,.72);border:1px solid var(--linha2);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* 25/08 (telas novas): cartão escolhido fica LIME CHEIO com texto escuro */
#onb .onb-card.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
#onb .onb-card.on .dv{color:var(--acc-ink)}
#onb .onb-card.on .tx small{color:rgba(10,17,0,.72)}
#onb .onb-card .dv{font-family:var(--f-disp);font-size:26px;font-weight:700;width:38px;text-align:center;color:var(--acc);flex:0 0 38px}
#onb .onb-card .tx b{font-size:14px;display:block}
#onb .onb-card .tx small{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px}
#onb .onb-card>b{font-size:15px}
#onb .onb-link{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:12.5px;margin-top:14px;cursor:pointer;align-self:center}
#onb .onb-nav{margin-top:auto;padding-top:18px}
#onb .onb-prim{width:100%;padding:16px;border:0;border-radius:var(--rp);background:var(--marca);color:var(--marca-ink);font-weight:800;font-size:15px;letter-spacing:0;cursor:pointer;font-family:var(--f-ui)}
#onb .onb-prim:disabled{opacity:.4;cursor:default}
/* 26/08: o secundário do desenho é BOTÃO de fundo escuro, não link sublinhado
   — mesma altura e mesmo raio do primário, e é isso que faz os dois lerem como
   duas saídas do mesmo peso em vez de "a ação e a desistência". */
#onb .onb-sec{width:100%;padding:16px;border:0;border-radius:var(--rp);background:#121212;
  color:var(--ink2);font-weight:600;font-size:15px;cursor:pointer;font-family:var(--f-ui);margin-top:12px}
#onb .onb-prim.lime{background:var(--marca)}   /* 25/08: telas novas — o fechamento também é laranja */
#onb .nota.center{text-align:center}
/* 26/08: a porta pra quadra particular. Tracejada e sem preenchimento de
   propósito — é "acrescentar à lista", não uma opção da lista: se parecesse um
   .onb-card viraria um clube a mais entre os clubes. */
#onb .onb-quadra-nova{width:100%;margin-top:10px;padding:13px;cursor:pointer;
  border:1px dashed var(--linha2);border-radius:12px;background:none;
  color:var(--ink2);font:700 13px var(--f-ui);text-align:center}
#onb .onb-quadra-nova:active{transform:scale(.99)}

/* ===== SALA DE TROFÉUS (Bloco 3) — overlay dentro do #fone ===== */
#trofeus{position:absolute;inset:0;z-index:40;display:none;overflow:hidden;background:#0A0806}
#trofeus.on{display:block}
#trofeus .tr-cena{position:absolute;inset:0;z-index:0;background-repeat:no-repeat}
#trofeus .tr-veu{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,8,6,.82) 0%,rgba(10,8,6,.28) 13%,rgba(10,8,6,0) 26%,rgba(10,8,6,0) 74%,rgba(10,8,6,.9) 100%)}
#trofeus .tr-topo{position:absolute;top:0;left:0;right:0;z-index:4;padding:16px 54px 10px 18px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#trofeus .tr-topo h2{font:400 23px/1 var(--f-disp);margin:0;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#trofeus .tr-cnt{font:700 11px var(--f-ui);letter-spacing:.1em;color:var(--ink2);white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#trofeus .tr-cnt b{color:var(--gold)}
#trofeus .tr-abas{position:absolute;top:58px;left:0;right:0;z-index:4;display:flex;gap:8px;padding:0 18px}
#trofeus .tr-aba{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--linha);
  background:rgba(12,9,8,.55);backdrop-filter:blur(6px);color:var(--ink2);font:600 12px var(--f-ui);cursor:pointer}
#trofeus .tr-aba.on{background:var(--gold);color:#1a1208;border-color:var(--gold)}
#trofeus .tr-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(21,16,13,.7);border:1px solid var(--linha2);color:var(--ink);font-size:20px;cursor:pointer;z-index:5}
#trofeus .tr-prat{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:flex-end;justify-content:space-evenly;gap:2px;padding:0 26px}
#trofeus .tr-cint{position:absolute;left:0;right:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#trofeus .tr-peca{position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:0}
#trofeus .tr-peca img,#trofeus .tr-cint img{display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
#trofeus .tr-cint img{height:78px}
#trofeus .tr-peca.nao img,#trofeus .tr-cint.nao img{filter:brightness(0) opacity(.34) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#trofeus .tr-peca em,#trofeus .tr-cint em{position:absolute;top:100%;left:-8px;right:-8px;margin-top:3px;
  font:600 8.5px var(--f-ui);letter-spacing:.02em;text-align:center;color:var(--ink2);font-style:normal;
  text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trofeus .tr-peca.nao em{color:var(--ink3)}
/* 15/08 — a etiqueta do cinturão SOBE em vez de descer.
   Ela mora na prateleira de cima, e o `top:100%` das outras a jogava pra baixo,
   na mesma faixa por onde sobem as peças da 1ª prateleira. Na aba Selos essa
   prateleira está sempre cheia (12 de 12), e era por isso que só ali o
   "Sem dono na sua comunidade" aparecia atravessado nas peças.
   Não era camada velha não limpa: `#tr-camadas` é reescrito inteiro a cada
   render. Era colisão de layout mesmo. Acima do cinturão não há nada, então é
   pra lá que a etiqueta cabe. */
#trofeus .tr-peca.coroa em{top:auto;bottom:100%;margin:0 0 5px}
#trofeus .tr-peca.sel::after{content:"";position:absolute;inset:-6px -4px 12px;border:1px solid var(--gold);border-radius:8px}
#trofeus .tr-det{position:absolute;left:0;right:0;bottom:0;z-index:5;border-top:1px solid var(--linha);
  background:rgba(12,9,8,.9);backdrop-filter:blur(10px);padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
#trofeus .tr-det b{font:600 14px var(--f-ui);display:flex;align-items:center}
#trofeus .tr-det p{margin:5px 0 0;font-size:12px;color:var(--ink2)}
#trofeus .tr-pill{font:700 9px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-left:8px}
#trofeus .tr-pill.tem{background:var(--up-bg);color:var(--up)}
#trofeus .tr-pill.nao{background:var(--sup2);color:var(--ink3)}

/* ===== TELA DE DESAFIO — VS (estilo Cartola) ===== */
#vs{position:absolute;inset:0;z-index:60;display:none;overflow:hidden}
#vs.on{display:flex;flex-direction:column}
#vs .vs-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
#vs .vs-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,8,6,.9) 0%,rgba(11,8,6,.28) 24%,rgba(11,8,6,.2) 52%,rgba(11,8,6,.88) 88%,rgba(11,8,6,.98) 100%)}
#vs .vs-top{position:relative;z-index:3;padding:26px 20px 0;text-align:center}
#vs .vs-kick{font:400 22px/1.15 var(--f-disp);color:var(--ink);text-shadow:0 2px 12px rgba(0,0,0,.9)}
#vs .vs-arena{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
#vs .vs-lado{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
#vs .vs-lado .bfig{position:relative;height:250px;max-height:38vh;display:flex;align-items:flex-end;justify-content:center}
#vs .vs-lado .bfig::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(10px);z-index:-1}
#vs .vs-lado img.bcv{height:250px;max-height:38vh;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
#vs .vs-nome{margin-top:8px;font:700 13px var(--f-ui);color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#vs .vs-x{z-index:2;font:400 30px var(--f-disp);color:var(--acc);text-shadow:0 2px 14px rgba(0,0,0,.9);flex:0 0 auto;padding-bottom:34px}
#vs .vs-card{position:relative;z-index:3;padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:rgba(12,9,8,.72);backdrop-filter:blur(10px);border-top:1px solid var(--linha)}
#vs .vs-adv{text-align:center;margin-bottom:14px}
#vs .vs-adv b{font:600 17px var(--f-ui);color:var(--ink)}
#vs .vs-id{font-size:12px;color:var(--ink3);font-weight:400}
#vs .vs-meta{font-size:12.5px;color:var(--ink2);margin-top:3px}
#vs .vs-acoes{display:flex;gap:10px}
#vs .vs-acoes button{flex:1;padding:15px;border-radius:13px;border:none;font:700 15px var(--f-ui);cursor:pointer}
#vs .vs-no{background:#2a1a16;color:var(--ink);border:1px solid var(--linha2)}
#vs .vs-ok{background:var(--up);color:#0A1100}

/* botão Concluir do vestiário quando ele é aberto durante o cadastro */
.vest-concluir{position:absolute;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:30;
  padding:16px;border:0;border-radius:var(--rp);background:var(--marca);color:#FFFEFD;
  font:800 15px var(--f-ui);cursor:pointer;box-shadow:0 8px 24px rgba(255,106,0,.35)}
</style>
</head>
<body>

<div id="fone">
  <div id="amb"></div>
  <!-- 07/08: a barra de status falsa (hora + sinal) saiu — no celular de
       verdade ela duplica a barra do sistema, dois centímetros acima.
       18/08: saiu a engrenagem e, com ela, a faixa inteira. O app ganha os
       42px de volta no topo, que é onde eles fazem mais falta. -->

  <div class="topo" id="topo">
    <button class="voltar" id="voltar">‹</button>
    <div class="marca" id="marca"><img src="../marcas/ranket-r.png" alt="Ranket"></div>
    <h1 id="titulo">Quadro</h1>
    <div class="dir" id="dir"></div>
    <!-- 29/08 (board): sino e avatar sobem pro topo. É o que libera a barra de
