  background:linear-gradient(180deg,transparent,rgba(0,0,0,.82) 62%);padding:26px 10px 9px}
.pcel .leg{padding:11px 10px;width:100%}
.pcel .leg p{font:400 var(--t-caption)/1.45 var(--f-ui);color:var(--ink);margin:0;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word}
.pcel .leg span{display:block;margin-top:5px;font:400 10.5px var(--f-ui);color:var(--ink3);
  font-variant-numeric:tabular-nums}
.pcel.comfoto .leg p{color:var(--ink)}
/* a celula com foto precisa de altura propria: sem conteudo em fluxo atras da
   imagem absoluta, ela colapsaria na altura da legenda. */
.pcel.comfoto{min-height:200px}
/* 01/09: entraram Seguidores e Seguindo (mig 89), então a linha passou de um
   número + botão para TRÊS + botão. O gap caiu e os números podem encolher —
   em 375px a soma antiga estourava e empurrava o botão pra fora. */
.pnums{display:flex;align-items:center;gap:12px;padding:14px var(--pad-lado) 0}
.pnums .n{text-align:left;min-width:0}
.pnums .n b{display:block;font:700 19px var(--f-disp);color:var(--ink)}
.pnums .n small{font:400 var(--t-caption) var(--f-ui);color:var(--ink3)}
.pnums .seguir{margin-left:auto;flex:0 0 auto;padding:10px 16px;border-radius:10px;
  border:1px solid var(--linha2);background:transparent;color:var(--ink2);
  font:400 12.5px var(--f-ui);cursor:pointer}
/* seguindo é ESTADO, e estado precisa aparecer: sem isto o botão fica igual nos
   dois casos e a pessoa clica de novo pra descobrir em qual está. */
.pnums .seguir.on{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
.pnums .seguir:disabled{opacity:.5;cursor:default}
/* 01/09 (migs 91 e 92) — a barra de foto do compositor e a foto no post.
   `max-height` na imagem porque foto de celular é retrato e sem teto uma só
   ocupa a tela inteira, empurrando o resto do feed pra fora da primeira dobra. */
.postbar{display:flex;align-items:center;gap:10px;margin-top:8px}
.foto-bt{display:inline-flex;align-items:center;cursor:pointer;padding:8px 14px;
  border:1px solid var(--linha2);border-radius:10px;background:transparent;
  color:var(--ink2);font:400 var(--t-label) var(--f-ui)}
.foto-nome{color:var(--ink3);font:400 11.5px var(--f-ui);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.post-foto{display:block;width:100%;max-height:60vh;object-fit:cover;
  border-radius:10px;margin-top:10px;background:var(--sup)}
/* node 63:2050 — os três estilos como chips no mesmo card, o declarado em
   destaque. Quem não declarou mostra os três apagados, que é o desenho: a
   ausência aparece como opção não marcada, não como bloco de texto. */
.echips{display:flex;gap:8px;flex-wrap:wrap}
.echip{flex:1 1 auto;text-align:center;padding:10px 8px;border-radius:10px;
  border:1px solid rgba(232,222,210,.18);background:transparent;
  color:var(--ink3);font:600 var(--t-label) var(--f-ui);white-space:nowrap}
.echip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.pcta{padding:14px var(--pad-lado) 4px}
.pcta button{width:100%;border:0;border-radius:var(--rp);padding:15px;
  background:var(--marca);color:var(--marca-ink);font:700 var(--t-title-s) var(--f-ui);cursor:pointer}
/* os três números de estatística, no formato do board */
.pstats{display:flex;align-items:center;background:rgba(11,11,11,.6);
  border:1px solid var(--linha);border-radius:16px;padding:16px 6px;margin-bottom:14px}
.pstats > div{flex:1;text-align:center;min-width:0}
.pstats > div + div{border-left:1px solid var(--linha)}
.pstats .v{font:700 var(--t-title-m) var(--f-disp);color:var(--ink)}
.pstats .k{font:400 11px var(--f-ui);color:var(--ink3);margin-top:2px}
.pstats .ic{font-style:normal;color:var(--acc);font-size:13px;margin-right:4px}

/* 01/09 — VALORES DO CÓDIGO DO FIGMA (get_design_context no node 35:773), não
   estimados por screenshot: fundo é GRADIENTE diagonal a 101,1deg de var(--bg)
   até transparente, não cor chapada; raio 20px; sem contorno. */
/* o gradiente do node tem o 2o stop 4,5x além do fim da caixa: na borda oposta
   percorre só 10,7% dele, indo de 100% a 91,2% de opacidade (spec item 4).
   É quase chapado — e é assim que ele aparece de verdade. */
.hcard{margin-top:11px;border:0;border-radius:20px;padding:14px 16px;
  background:linear-gradient(101.1deg, rgba(11,11,11,1) 0%, rgba(11,11,11,.91) 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hcard .l1{display:flex;align-items:baseline;gap:8px}
/* 01/09: a coluna direita tem 44% da tela (board 35:773), então os corpos
   caem junto. `clamp` e não valor fixo: em 375px o card tem ~160px de largura
   e em 430px tem ~185px — a mesma fonte não serve pros dois. */
.hcard .cls{font:700 var(--t-display)/1 var(--f-disp);color:var(--ink);letter-spacing:-.02em}
.hcard .suf{font:600 var(--t-nav) var(--f-ui);color:var(--acc);margin-left:-3px}
.hcard .pts{flex:1;text-align:right;font:600 var(--t-title-m) var(--f-ui);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.hcard .prox{font:600 var(--t-title-m) var(--f-ui);color:var(--ink3)}
.hcard .faltam{text-align:right;font:400 var(--t-caption) var(--f-ui);color:var(--acc);margin-top:4px}
/* cores exatas do Figma (nodes 120:89 e 120:90): trilho var(--acc-ink), preenchimento
   var(--acc), 6px de altura, raio 100px. O trilho estava em var(--acc-ink), que é
   quase a mesma coisa por acaso — agora é o valor, não a coincidência. */
.hcard .barra{height:6px;border-radius:100px;background:var(--acc-ink);margin:9px 0 8px;overflow:hidden}
.hcard .barra i{display:block;height:100%;border-radius:100px;background:var(--acc)}
/* node 35:778: Inter Regular, var(--ink3) */
.hcard .fim{font:400 var(--t-label)/1.4 var(--f-ui);color:var(--ink3);margin-top:6px}
.hcard .fim b{color:var(--ink2)}

/* O card "Let's Ranket" — o convite pra entrar no radar. É o único bloco da
   home do board com botão LIME, e não é exceção à regra de :20-34: ele não
   compete com o laranja de "Ver oponentes", está um degrau abaixo dele na
   hierarquia. Some quando a pessoa já tem disponibilidade marcada, senão
   viraria moldura pedindo o que já foi feito. */
/* 01/09 — node 89:192 do Figma, pelo código: gradiente a 94,4deg, raio 20px.
   ⚠️ O "Let's Ranket" NÃO É TEXTO no Figma — é um LETTERING em SVG (223x125,
   node 89:186). Estava escrito aqui como <h3> com a fonte do app, e por isso
   nunca ia bater: desenho de letra não se reproduz com font-family. O arquivo
   veio do próprio Figma e vive em app/fig/lets-ranket.svg.
   O texto é Inter LIGHT 20px com entrelinha 30px em var(--ink3); o botão tem
   58px de altura, raio 100px, fundo var(--acc) e rótulo Inter Bold em var(--acc-ink). */
.hlets{margin-top:11px;border:0;border-radius:20px;padding:20px 18px;
  background:linear-gradient(94.4deg, rgba(11,11,11,1) 0%, rgba(11,11,11,.91) 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hlets .lets{display:block;width:min(100%,152px);height:auto;margin-bottom:2px}
/* Light 300 descartado (spec item 3): texto fino claro sobre quase-preto sofre
   halation em OLED. Regular 400. */
.hlets p{font:400 var(--t-label)/1.45 var(--f-ui);color:var(--ink3);margin:10px 0 16px}
/* ⚠️ ALVO DE TOQUE: no Figma este botão tem 58px de altura, que ÷2,88 dá
   20pt — menos da metade do mínimo utilizável (44pt). Todos os controles do
   arquivo reprovam nisso (spec item 2), porque foram dimensionados ao redor do
   texto de 1x. A altura sobe pra 48; a forma e a cor são as do node. */
.hlets button{width:100%;min-height:48px;border:0;border-radius:100px;padding:13px 10px;
  background:var(--acc);color:var(--acc-ink);font:600 var(--t-nav) var(--f-ui);
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;line-height:1.2}

.ini .degrau{margin-top:11px;background:rgba(10,14,12,.78);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:13px}
/* 25/08: o anel de progressão das telas novas — progresso da CATEGORIA (a
   mesma conta da barra antiga), com a etiqueta C4 no centro */
.ini .degrau .anel{position:relative;width:58px;height:58px;flex:0 0 58px}
.ini .degrau .anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.ini .degrau .anel .tri{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-disp);font-weight:800;font-size:19px}
.ini .degrau .anel .tri small{font-size:var(--t-nav);color:var(--up);font-weight:800;margin-left:1px}
.ini .degrau .dtx{flex:1;min-width:0}
.ini .degrau .top{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-nav);color:var(--ink3)}
.ini .degrau .top b{font-family:var(--f-disp);font-size:var(--t-body);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.ini .degrau .bar{height:6px;border-radius:99px;background:var(--sup2);margin-top:8px;overflow:hidden}
.ini .degrau .bar i{display:block;height:100%;background:var(--up);border-radius:99px}
.ini .degrau .fim{font-size:var(--t-caption);color:var(--ink3);margin-top:6px}
/* 28/08: o painel do PROFESSOR ocupa o lugar do degrau — mesmo material
   (vidro escuro sobre a cena), conteúdo outro: ele não sobe de classe, ele
   tem turma. Três números e nada mais: alunos, aulas na semana e quem espera
   resposta. `.q` acende em lime quando há alguém esperando — número que pede
   ação não pode ter a mesma cor de número que só informa. */
.ini .painel{margin-top:11px;background:rgba(10,14,12,.78);border:1px solid var(--linha);border-radius:16px;
  padding:11px 6px;backdrop-filter:blur(6px);display:grid;grid-template-columns:repeat(3,1fr)}
.ini .painel .q{text-align:center;position:relative}
.ini .painel .q+.q::before{content:'';position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--linha)}
.ini .painel .q b{display:block;font-family:var(--f-disp);font-size:var(--t-title-m);font-weight:700;line-height:1.1}
.ini .painel .q small{display:block;font-size:var(--t-nav);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.ini .painel .q.acende b{color:var(--up)}
/* 01/09 (board 35:756) — A FAIXA DE DUAS COLUNAS.
   Medidas tiradas do frame 1080x1920: boneco x 33→541 (47%), coluna de cards
   x 550→1026 (44%), os dois na mesma faixa y 267→1029 (39% da altura).
   `align-items:stretch` pra que o boneco acompanhe a altura dos cards em vez
   de definir a sua — quem manda na altura da faixa é o conteúdo da direita,
   que é texto e não pode ser cortado. */
.ini .htopo{display:flex;align-items:stretch;gap:2%;margin-top:10px}
.ini .hcol{flex:1 1 51%;min-width:0;display:flex;flex-direction:column;gap:10px;order:2}
/* o boneco fica à ESQUERDA (order:1) e não encolhe abaixo de 44%: abaixo disso
   a figura vira um risco e o uniforme, que é o ponto do vestiário, some. */
.ini .htopo .palco{flex:0 0 45%;order:1;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-end;
  min-height:0;z-index:1;padding:0}
.ini .palco-antigo{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:220px;z-index:1;padding:0 18px}
.ini .sombra{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:170px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(11px);z-index:0}
.ini .glow{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:230px;height:66px;border-radius:50%;
  background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.30;filter:blur(6px)}
/* 01/09: a altura passou a vir da FAIXA, não de um valor fixo. No board o
   boneco tem 762 de 1920 (39,7% da altura) e termina junto com os cards da
   direita — com 300px fixos ele estouraria pra fora da faixa em tela alta e
   ficaria pequeno demais em tela baixa. */
.ini .boneco{position:relative;height:min(40vh,40dvh);min-height:230px;z-index:1;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.ini .boneco img{height:100%;width:auto;display:block}
/* 06/08: o boneco virou corpo inteiro e ficou mais alto — a placa no topo
   passou a cortar a cabeça. Desceu pro pé do palco, sobre a sombra. */
/* 01/09 (board 35:794): a faixa do nome é largura total e vem DEPOIS da faixa
   de duas colunas — não flutua sobre o boneco. Enquanto era `absolute` ela
   cobria o card "Let's Ranket" da coluna direita, que agora ocupa a mesma
   altura do boneco. */
/* node 35:794 pelo código: 971x70 (raio 100px = pílula), contorno var(--acc) e
   SEM preenchimento — o retângulo de trás não tem fill. O app pintava
   rgba(11,11,11,.55) por baixo, o que fechava a faixa contra a quadra em vez
   de deixá-la vazada como no desenho. */
.ini .placa{position:relative;z-index:2;margin-top:12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 22px;border-radius:100px;
  border:1px solid var(--acc);background:transparent}
.placa .pos{flex:0 0 auto;font:700 var(--t-nav) var(--f-ui);color:var(--ink);
  letter-spacing:.5px;text-transform:uppercase;text-align:right}
/* nodes 35:796 e 35:797: os dois são Inter BOLD e brancos; o nome tem 30px e a
   posição 20px — razão de 1,5. A posição estava em 9,5px contra 15px do nome
   (razão 1,58) e, pior, com o corpo pequeno demais pra um rótulo que o desenho
   trata como segunda informação da faixa, não como legenda. */
.ini .placa .nm{font:700 var(--t-title-l) var(--f-ui);color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.ini .placa .meta{display:inline-flex;align-items:center;gap:7px;margin-top:6px;background:rgba(21,16,13,.62);border:1px solid var(--linha);border-radius:99px;padding:4px 12px;font-size:11.5px;color:var(--ink2);backdrop-filter:blur(4px)}
.ini .placa .meta b{font-family:var(--f-disp);font-size:var(--t-label);color:var(--ink)}
.ini .placa .meta .pil2{background:var(--up);color:var(--acc-ink);font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.06em}
.ini .acao{position:relative;z-index:2;padding:0 16px 8px}
/* 25/08 (telas novas): a ação da home é a pílula LARANJA */
/* 01/09 (board 35:808): o botão tem 668 de 1080 — 62% da largura, centralizado.
   Largura total fazia dele uma barra e não uma pílula, que é a forma do board. */
.ini .acao .big{width:min(100%,62%);min-width:280px;margin:0 auto;display:block;
  border:0;border-radius:100px;padding:16px;background:var(--marca);color:var(--marca-ink);font-weight:800;font-size:16px;letter-spacing:.01em;box-shadow:0 8px 24px rgba(255,106,0,.25);cursor:pointer;font-family:var(--f-ui)}
.ini .acao .big small{display:block;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.62;margin-top:3px}
.ini .acao .big.up{background:var(--up);box-shadow:0 8px 24px rgba(198,255,61,.18)}
.ini .acao .big.marcado{background:rgba(30,23,20,.82);color:var(--ink);border:1px solid var(--linha2);box-shadow:none;backdrop-filter:blur(6px)}
.ini .acao .big.marcado small{opacity:.8;color:var(--ink3)}
.ini .strip-wrap{position:relative;z-index:2;padding:0 16px 14px}
/* Ações secundárias sob o botão grande. Vidro escuro e texto discreto de
   propósito: elas precisam EXISTIR sem competir com o registro, que é o elo
   frágil do ciclo e a única ação que merece peso visual. */
/* 01/09 — O BOTÃO SECUNDÁRIO DO FIGMA. Ele existe: é o "Ver perfil" do card de
   oponente (node 28:149), que fica embaixo do "Convidar" laranja. A regra de lá
   é contorno claro sobre fundo transparente, texto claro e canto de 10px — e é
   isso que estes quatro passam a ser, em vez do vidro marrom que tinham.
   ⚠️ E viram GRADE 2x2: em fila de quatro numa tela de 375px cada um ficava com
   ~85px e o rótulo era cortado ("Marcar j…", "Minha c…"). Botão que não diz o
   que faz é enfeite — o Figma dá ao "Ver perfil" a largura do texto inteiro, e
   é essa a regra que importa copiar, não o número de colunas. */
.acoes-sec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acoes-sec button{min-height:44px;padding:11px 10px;border-radius:10px;cursor:pointer;
  background:transparent;border:1px solid rgba(232,222,210,.22);color:var(--ink);
  font:600 var(--t-label) var(--f-ui);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;transition:.16s}
.acoes-sec button:hover{border-color:rgba(232,222,210,.38);background:rgba(232,222,210,.05)}
.acoes-sec button:active{transform:scale(.97)}
.ini .strip-rot{font-size:var(--t-nav);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.ini .strip-rot a{color:var(--ink3);text-decoration:none;cursor:pointer}
.ini .strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ini .strip::-webkit-scrollbar{display:none}
/* 19/08 — notícias do esporte, fechando a home. Lista vertical e não carrossel:
   manchete que passa de raspão não é lida, e aqui a peça É o texto. A miniatura
   é opcional de propósito — notícia sem foto continua valendo, e exigir imagem
   faria a curadoria travar por falta de arte. */
/* 29/08 — O SEGUNDO ESCOPO. Estas quinze regras nasceram em 19/08 debaixo de
   `.ini` porque a home era o único lugar que tinha notícia. A aba Feed da
   Comunidade (board 159:2357) abre com o mesmo bloco, chamando a MESMA
   `noticiasHTML()` — e fora de `.ini` ele saía como uma lista de links azuis
   sublinhados, markup certo e CSS nenhum.
   O conserto não é copiar as regras: é dar a elas o segundo escopo, `.noticias`,
   pra que quem mexer na aparência da notícia mexa nos dois lugares de uma vez.
   Duas cópias divergem na primeira correção que só uma receber — foi assim que
   a ficha do jogador virou duas em 26/08. */
.ini .news-wrap,.noticias .news-wrap{position:relative;z-index:2;padding:0 16px 20px}
/* ⚠️ 01/09 — BUG DE CASCATA CORRIGIDO. Este seletor incluía `.noticias
   .news-rot`, com a MESMA especificidade da regra de 15px lá em cima (linha
   ~182) e vindo depois — então a anulava inteira. O comentário de lá dizia "no
   escopo .noticias ela é o título da seção", e isso nunca chegou a acontecer:
   o título saía como rótulo de 9px em caixa alta.
   Agora esta regra vale só na home (.ini), que é onde o rótulo pequeno é o
   certo, e a seção de notícias fica com o título que sempre foi pra ter. */
.ini .news-rot{font-size:var(--t-nav);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.ini .news,.noticias .news{display:flex;flex-direction:column;gap:8px}
.ini .nitem,.noticias .nitem{display:flex;gap:10px;align-items:center;text-decoration:none;
  background:rgba(30,23,20,.82);border:1px solid var(--linha);border-radius:10px;
  padding:10px 12px;backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}
.ini .nitem:active,.noticias .nitem:active{background:var(--sup2)}
.ini .nthumb,.noticias .nthumb{flex:0 0 52px;width:52px;height:52px;border-radius:8px;object-fit:cover;
  background:var(--sup2);display:block}
.ini .ntxt,.noticias .ntxt{flex:1;min-width:0}
.ini .ntxt b,.noticias .ntxt b{display:block;font-size:var(--t-label);color:var(--ink);font-weight:700;line-height:1.32;
  /* duas linhas e reticências: manchete longa não pode empurrar a nav pra fora */
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ini .ntxt small,.noticias .ntxt small{display:block;font-size:var(--t-caption);color:var(--ink3);margin-top:3px}
.ini .nseta,.noticias .nseta{color:var(--ink3);font-size:15px;flex:0 0 auto}
/* a home é full-bleed e paga a margem lateral aqui dentro; a aba Feed vive numa
   .sec, que já a paga. Só o padding muda entre os dois escopos. */
.noticias .news-wrap{padding:18px var(--pad-lado) 0}

/* -- o cartão-herói (board 159:2357). Só existe no escopo `.heroi`, e só
      quando a notícia tem foto — ver a nota em `noticiasHTML`. -- */
.heroi .nheroi{position:relative;display:block;aspect-ratio:2.13/1;border-radius:11px;
  overflow:hidden;text-decoration:none;margin-bottom:12px;background:var(--sup2);
  -webkit-tap-highlight-color:transparent}
.heroi .nheroi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.heroi .nheroi.semfoto img{display:none}
.heroi .nh-txt{position:absolute;left:0;right:0;bottom:0;padding:13px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.heroi .nh-txt b{display:block;font:700 14.5px/1.25 var(--f-ui);color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.heroi .nh-txt small{display:block;font:400 var(--t-caption) var(--f-ui);color:var(--ink3);margin-top:4px}
.heroi .nh-seta{position:absolute;right:11px;bottom:11px;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(255,254,253,.5);color:var(--ink);font-size:12px;
  display:flex;align-items:center;justify-content:center}
/* 19/08 — o espaço de mídia da home (inventário próprio, no molde do Cartola:
   uma peça só, no fim do feed, vendida por nós e não sorteada por rede).

   O `aspect-ratio` no WRAPPER, não na imagem, é o que impede o pulo de layout:
   a altura fica reservada antes de o JPEG chegar, então o strip acima não
   desce sozinho no meio da leitura no 4G da quadra. `--ads-prop` vem da
   campanha; o valor aqui é só o padrão de quem não declarou. */
.ini .ads-wrap{position:relative;z-index:2;padding:0 16px 18px}
.ini .ads-rot{font-size:var(--t-nav);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;margin-bottom:6px;opacity:.75}
.ini .ads{display:block;aspect-ratio:var(--ads-prop,1/1);border-radius:12px;
  overflow:hidden;border:1px solid var(--linha);background:var(--sup);
  -webkit-tap-highlight-color:transparent}
.ini .ads img{width:100%;height:100%;object-fit:cover;display:block}
/* peça que é LOGO, não foto: cabe inteira e respira, em vez de ser cortada */
.ini .ads.conter{background:var(--sup2);display:flex;align-items:center;justify-content:center;padding:8% 12%}
.ini .ads.conter img{width:100%;height:100%;object-fit:contain}
.ini .ads:active{transform:scale(.99)}
.ini .mcard{flex:0 0 auto;min-width:158px;background:rgba(30,23,20,.82);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;backdrop-filter:blur(6px)}
.ini .mcard .mic{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--sup2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink2)}
.ini .mcard .mtx{min-width:0}
.ini .mcard .mtx b{font-size:11.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini .mcard .mtx small{font-size:var(--t-caption);color:var(--ink3)}
.ini .mcard .mv{margin-left:auto;font-family:var(--f-disp);font-size:var(--t-body);font-weight:700;color:var(--up)}

/* ===== O FUNDO DAS TELAS INTERNAS =====
   02/09 — A QUADRA SAI DE BAIXO DAS TELAS INTERNAS.

   Até aqui a mesma foto (Saibro Noturno) corria por baixo de tudo o que não
   fosse a home, e sobre ela havia um SISTEMA INTEIRO construído para
   sobreviver à foto: cartões de vidro marrom `rgba(30,23,20,.74)`, topo e
   barra em `rgba(21,16,13,.6)`, blur de 10 a 12px em oito superfícies, e
   sombra de texto em todo rótulo que pousasse direto na quadra.

   No arquivo NENHUMA tela interna tem foto: são var(--bg) com o brilho radial
   lime, e as superfícies são os quase-pretos da paleta. Por isso o marrom sai
   junto com a foto — ele não era uma escolha de cor, era a resposta a ela.
   Mantido sobre fundo chapado, daria marrom sobre preto, que é a divergência
   que mais se via nas telas internas.

   Some junto tudo o que só existia por causa da foto:
     · o blur (não há o que desfocar atrás de uma cor chapada, e ele custa
       composição a cada rolagem no aparelho)
     · a sombra de texto (existia pra o rótulo não brigar com o saibro)
     · a régua translúcida do topo, que virou a régua sólida do board

   ⚠️ A FOTO NÃO MORREU. Ela continua sendo o fundo da HOME (que no arquivo
   TEM foto, node 35:771) e do VESTIÁRIO, que pintam a própria cena — as duas
   rotas que o `render()` marca como `cenaPropria`. O que muda é só o que
   corre por baixo das telas internas. */
#amb{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:var(--bg)}
#fone.noturno #amb{opacity:1;background:var(--bg)}
/* o brilho do arquivo, a mesma camada que já vale na home e no cadastro */
#fone.noturno #amb::after{content:"";position:absolute;inset:0;background:var(--brilho)}

/* topo e barra: o var(--acc-ink) do arquivo (bg/header), chapado. */
#fone.noturno .topo{background:var(--acc-ink);border-bottom-color:var(--linha3)}
#fone.noturno .nav{background:var(--acc-ink);border-top-color:var(--linha3)}

/* as superfícies: o `surface/card` do arquivo, rgba(11,11,11,.8). */
#fone.noturno .card,
#fone.noturno .tab,
#fone.noturno .placar,
#fone.noturno .mexeu{background:rgba(11,11,11,.8);border-color:var(--linha)}
#fone.noturno .card.clic:active{background:rgba(24,24,24,.9)}
#fone.noturno .stats{background:transparent;border-color:var(--linha)}
#fone.noturno .stats>div{background:rgba(11,11,11,.8)}
#fone.noturno .tab .cab{border-bottom-color:var(--linha4)}
#fone.noturno .ln{border-bottom-color:var(--linha4)}
/* a minha linha na tabela: era um lavado do laranja da camisa sobre a quadra.
   Sobre fundo chapado o mesmo lavado some, e o lime é quem marca "sou eu" no
   resto do app. */
#fone.noturno .ln.eu{background:rgba(131,224,0,.10)}
#fone.noturno .selo{background:rgba(18,18,18,.6);border-color:var(--linha2)}
#fone.noturno .sets b{background:rgba(18,18,18,.6)}
/* 15/08 — o `:not(.on)` continua sendo o conserto, e a razão continua sendo de
   especificidade: este seletor tem ID (1,2,0) e o `.chip.on` tem só classes
   (0,2,0), então sem ele o fundo escuro ganharia do fundo claro do chip
   ESCOLHIDO, que segue com `color:var(--acc-ink)` quase preto. Dava 1,05:1
   contra os 4,5:1 do AA. O material mudou; a armadilha de cascata não. */
#fone.noturno .chip:not(.on){background:rgba(18,18,18,.6)}
#fone.noturno .abas{background:transparent}
#fone.noturno #toast{background:rgba(18,18,18,.94)}
/* o respiro de luz lime no topo do herói fica: ele é do arquivo (o mesmo
   brilho), não da foto. */
#fone.noturno .hero{background:radial-gradient(120% 80% at 50% 0%,rgba(131,224,0,.07),transparent 60%);
  border-bottom-color:var(--linha)}

/* ===== VESTIÁRIO / PERSONALIZAR ===== */
.ini .boneco{cursor:pointer}
.edit-hint{position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:3;
  background:rgba(21,16,13,.74);border:1px solid var(--linha2);border-radius:99px;
  padding:5px 12px;font-size:var(--t-nav);letter-spacing:.06em;color:var(--ink2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
/* 07/08: o vestiário virou coluna de altura fixa — palco em faixa que não sai do
   lugar, e o PAINEL é quem rola. Antes o palco era `sticky` e o painel passava
   POR BAIXO dele, tapando os controles.
   Como a tela toda não rola mais, a cena pode voltar a ser `absolute`: ela não
   estica com o conteúdo, então some o motivo do `fixed` — e com ele o risco do
   Safari iOS, onde `fixed` pula quando a barra de endereço aparece e some. */
.vest{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.vest .cena{position:absolute;inset:0;z-index:0;background-position:center top;background-repeat:no-repeat;background-size:cover;
  background-image:var(--vest-url,url('../vestiario/tunel.jpg')),
    radial-gradient(120% 70% at 50% 16%,rgba(96,54,32,.55),transparent 70%),
    linear-gradient(180deg,#1c1410,#0B0806);}
/* 06/08: o personagem é o preview inteiro, ancorado no chão do vestiário — de pé
   no lugar, não flutuando. 07/08: faixa de altura fixa no topo da coluna; o
   escudo e o patrocinador agora já vêm desenhados dentro do próprio canvas. */
/* 07/08 (3ª volta): o personagem estava GRANDE DEMAIS e por isso lia como
   adesivo colado na frente do vestiário. Integrar é questão de escala e de
   ancoragem: ele volta pro tamanho medido (altura ~52% da tela, pés na linha do
   chão da cena) — o mesmo enquadramento do QA, onde ele fica DENTRO da sala.
   Ganha-se de brinde a margem que o trilho de ícones precisava. */
.vpalco{position:absolute;inset:0;z-index:2}
.vpalco img.bcv{position:absolute;width:auto;transform:translate(-50%,-100%);
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.vpalco .vsombra{position:absolute;border-radius:50%;background:#000;filter:blur(12px);
  transform:translate(-50%,-50%);pointer-events:none}
.vpalco .vglow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--camisa),transparent);
  transform:translate(-50%,-50%);opacity:.26;filter:blur(9px)}

/* Botão de confirmar. Só aparece quando há mudança pendente — botão que vive
   aceso vira parte do cenário e para de significar "falta fazer isso".
   Mora DENTRO da bandeja: flutuando sobre a cena ele cobria as pernas do
   personagem, que é justamente o que a pessoa está tentando olhar. */
.vestir{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;
  padding:14px;cursor:pointer;background:var(--acc);color:var(--acc-ink);
  font:800 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.vestir:active{transform:scale(.985)}
/* bandeja que carrega só o botão (categoria fechada, mas troca pendente) */
.vtray.so-vestir{padding-top:14px}
/* 26/08: a linha de ações da bandeja. Lado a lado quando os dois existem —
   o `margin-top` do .vestir já dá o respiro, então a linha não repete. */
.vtray-acoes{display:flex;gap:8px;align-items:stretch}
.vtray-acoes .vestir{margin-top:12px}
.vtray-acoes > *{flex:1}
/* O Concluir dentro da bandeja: mesma altura e mesmo peso do Vestir, na cor da
   marca — é saída de fluxo, não a ação principal da tela. Quando está sozinho
   ocupa a linha inteira (o flex:1 acima), que é o caso mais comum: escolher
   sem trocar nada e sair. */
.vest-concluir-tray{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;
  padding:14px;cursor:pointer;background:var(--marca);color:var(--marca-ink);
  font:800 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.vest-concluir-tray:active{transform:scale(.985)}
.vest-preview .vfig{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
.vest-preview .vfig .chao{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,rgba(11,8,6,.55) 55%,rgba(11,8,6,.9));pointer-events:none}
.vest-preview .vfig .boneco{position:relative;z-index:1;height:97%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.vest-preview .vfig .boneco > .bfig{height:100%}
.vest-preview .vfig .sombra{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:150px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(12px)}
.vest-preview .vfig .glow{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:190px;height:54px;border-radius:50%;background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.32;filter:blur(7px)}
/* 07/08: a figura é uma imagem só — o canvas já entrega o boneco pintado com o
   escudo e o patrocinador desenhados no peito. Nada de máscara nem de multiply:
   a composição pixel-exata mora no canvas, não no CSS, porque no CSS a imagem e
   a máscara são dimensionadas por regras diferentes e nunca coincidem. */
.bfig{position:relative;display:block;height:100%}
.bfig img{display:block;height:100%;width:auto;margin:0 auto}

/* 06/08: switch de esporte. Tênis e beach são trilhos paralelos — trocar aqui
   troca Nível, divisão, quadro e pontos de uma vez. Nada é convertido. */
.esp-sw{display:flex;gap:4px;margin-top:9px;padding:3px;border-radius:999px;
  background:rgba(11,8,6,.5);border:1px solid rgba(232,222,210,.12);backdrop-filter:blur(8px);width:fit-content}
/* 01/09: dentro da coluna de 44% (board 35:799) o rótulo "BEACH TENNIS"
   quebrava em duas linhas e a pílula virava um bloco de dois andares.
   `nowrap` + espaçamento menor resolvem sem encolher a fonte a ponto de
   sumir — o board tem as abas em 85% da coluna, e é o que isto entrega. */
.esp-sw button{border:0;cursor:pointer;min-height:36px;padding:5px 14px;border-radius:999px;background:transparent;
  color:var(--ink3);font:700 var(--t-nav)/1 var(--f-ui);letter-spacing:.04em;
  text-transform:uppercase;transition:.18s;white-space:nowrap}
.esp-sw button.on{background:var(--acc);color:#14100c}

/* os dois esportes na ficha, lado a lado */
.dois-esp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dois-esp .de{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;cursor:pointer;text-align:left;
  background:rgba(30,23,20,.6);border:1px solid rgba(232,222,210,.10)}
.dois-esp .de.on{border-color:rgba(198,255,61,.45);background:rgba(198,255,61,.09)}
.dois-esp .de-ic{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:rgba(232,222,210,.07);color:var(--ink2);font-size:15px}
.dois-esp .de.on .de-ic{background:rgba(198,255,61,.16);color:var(--acc)}
.dois-esp .de-tx b{display:block;font-size:12.5px;color:var(--ink)}
.dois-esp .de-tx small{display:block;font-size:10px;color:var(--ink3);white-space:nowrap}

/* carrossel de atalhos da home. Registrar fica FORA daqui, no botão fixo —
   o registro é o elo frágil do ciclo e não pode depender de rolagem. */
.wgt-wrap{position:relative;z-index:1;margin-top:14px}
.wgt{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding:0 18px 2px}
.wgt::-webkit-scrollbar{display:none}
.wgt .w{scroll-snap-align:start;flex:0 0 168px;display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left;
  background:rgba(30,23,20,.80);border:1px solid rgba(232,222,210,.10);backdrop-filter:blur(10px)}
.wgt .w:active{transform:scale(.975)}
.wgt .w .wic{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(198,255,61,.12);color:var(--acc);font-size:15px}
.wgt .w .wfig{flex:0 0 34px;height:42px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.wgt .w .wfig img{height:64px;width:auto;object-fit:contain;object-position:top}
.wgt .w .wtx{min-width:0}
.wgt .w .wtx b{display:block;font-size:var(--t-label);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgt .w .wtx small{display:block;font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgt .w.vest{background:linear-gradient(135deg,rgba(198,255,61,.14),rgba(30,23,20,.86))}

/* 07/08: escurecimento MUITO mais leve. O anterior fechava em preto sólido a
   74% da tela pra dar fundo ao painel de controles — e junto com o painel foi
   embora o motivo. Agora o vestiário precisa aparecer: é a sala que integra o
   personagem, e a bandeja já tem o próprio fundo. */
.vest .scrim{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,8,6,.38) 0%,rgba(11,8,6,.10) 26%,rgba(11,8,6,.20) 62%,rgba(11,8,6,.55) 100%)}
.vest .palco{position:relative;z-index:1;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px}
.vest .palco .sombra{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:150px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(11px)}
.vest .palco .glow{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:200px;height:56px;border-radius:50%;background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.30;filter:blur(6px)}
.vest .palco .boneco{position:relative;z-index:1;height:288px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.vest .palco .boneco img{height:100%;width:auto;display:block}
/* =========================================================================
   07/08 (2ª volta) — O VESTIÁRIO NÃO ROLA.
   A lista de controles empilhada obrigava a rolar, e rolar num provador é
   errado: você perde o personagem de vista bem na hora de julgar a roupa.
   Agora a tela é o personagem inteiro, e as categorias vivem num TRILHO de
   ícones na borda. Tocar um ícone abre só as opções DELE numa bandeja curta;
   tocar de novo fecha. Nenhuma vem aberta — é o que deixa a tela cheia de
   opção sem ficar poluída.
   ========================================================================= */
.vrail{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:6;
  display:flex;flex-direction:column;gap:9px;max-height:calc(100% - 16px);overflow-y:auto;
  scrollbar-width:none}
.vrail::-webkit-scrollbar{display:none}
.vrail button{width:53px;padding:7px 0 5px;border-radius:15px;cursor:pointer;
  background:rgba(21,16,13,.70);border:1px solid var(--linha2);color:var(--ink2);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:.16s}
.vrail button:active{transform:scale(.94)}
.vrail button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.vrail .vi{height:22px;display:grid;place-items:center;font-size:17px;line-height:1}
.vrail .vl{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-weight:700}
/* o ícone PRÉ-VISUALIZA a escolha atual: a cor é a bolinha da cor, a pessoa é o
   rosto de quem está vestido. Assim o trilho informa sem precisar de rótulo longo. */
.vrail .sw{width:21px;height:21px;border-radius:50%;border:2px solid rgba(251,246,238,.6)}
.vrail .mn{width:23px;height:23px;border-radius:50%;overflow:hidden;position:relative;
  background:rgba(0,0,0,.35);background-repeat:no-repeat}

.vtray{position:absolute;left:0;right:0;bottom:0;z-index:7;
  background:linear-gradient(180deg,rgba(11,8,6,.35),rgba(19,14,11,.97) 20%);
  border-top:1px solid var(--linha2);
  padding:13px 16px max(15px,env(safe-area-inset-bottom));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.vtray .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:11px}
.vtray .tt b{font:700 var(--t-nav) var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.vtray .tt span{font-size:var(--t-caption);color:var(--ink3);text-align:right}
/* 6 colunas: com a 11ª cor (o preto), 5 colunas jogava a paleta pra TRÊS
   fileiras e a bandeja passava a rolar — e rolagem num provador é erro de
   conceito, faz perder o personagem de vista bem na hora de julgar a roupa.
   Em 6, tanto os 9 personagens quanto as 11 cores cabem em duas fileiras. */
.vgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
/* O rosto entra como BACKGROUND posicionado pelo retângulo medido (ver ROSTO,
   lá embaixo), não como <img> esticada. A imagem esticada era o defeito: um
   deslocamento só pros 9 bonecos, e o sprite -mini (52x150) ampliado a 220%. */
.vopt{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;padding:0;
  background:rgba(30,23,20,.72);background-repeat:no-repeat;border:2px solid transparent}
.vopt.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(198,255,61,.28)}
/* Anel interno nos swatches de cor: sem ele o preto se dissolve no painel
   escuro e a opção fica invisível — cor que não aparece não é opção. */
.vopt.cor{box-shadow:inset 0 0 0 1px rgba(251,246,238,.26)}
.vopt.cor.on{box-shadow:inset 0 0 0 1px rgba(251,246,238,.26),0 0 0 2px rgba(198,255,61,.28)}
.pick{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pick::-webkit-scrollbar{display:none}
.pboneco{flex:0 0 auto;width:60px;height:60px;border-radius:50%;overflow:hidden;position:relative;
  background:rgba(30,23,20,.72);border:2px solid transparent;cursor:pointer;padding:0}
.pboneco img{position:absolute;left:50%;top:-6%;transform:translateX(-50%);width:220%}
.pboneco.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(198,255,61,.25)}
.pcores{display:flex;flex-wrap:wrap;gap:10px}
.pcor{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.pcor.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(198,255,61,.3)}
.seg2{display:flex;gap:8px}
/* 29/08 (board, node 29:256): o seletor de TRÊS. O .seg2 é a peça de duas
   escolhas; gênero tem três e no desenho elas são pílulas separadas, com
   contorno lime em todas e preenchimento lime só na ativa. */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{border:1px solid var(--acc);background:transparent;color:var(--ink3);
  border-radius:10px;padding:11px 4px;font:700 12px var(--f-ui);cursor:pointer}
.seg3 button.on{background:var(--acc);color:var(--acc-ink)}
/* rótulo em negrito ACIMA do campo, como o board faz em "Data de nascimento"
   e "Bio" — diferente do .rot, que é caixa-alta e menor */
.onb-rot{font:700 14px var(--f-ui);color:var(--ink);margin:16px 0 8px}
.onb-area{width:100%;min-height:86px;padding:var(--t-body);border-radius:16px;resize:vertical;
  background:rgba(30,23,20,.72);border:1px solid rgba(255,254,253,.55);color:var(--ink);
  font:400 15px var(--f-ui);margin-bottom:4px}
.onb-area:focus{outline:none;border-color:var(--acc)}
/* o aceite: botão, não <input type=checkbox> — o app inteiro pinta estado por
   classe .on e re-render, e um checkbox nativo guardaria estado no DOM, que o
   render() destrói. A caixinha é o ::before. */
.onb-check{display:flex;align-items:flex-start;gap:10px;background:none;border:0;
  padding:12px 0;cursor:pointer;text-align:left;color:var(--ink);font:400 13px var(--f-ui)}
.onb-check::before{content:'';flex:0 0 18px;width:18px;height:18px;border-radius:3px;
  border:2px solid var(--acc);margin-top:1px}
.onb-check.on::before{background:var(--acc);
  box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 9px var(--acc)}
/* o texto inteiro num <span>: sendo filhos diretos do flex, "Termos de Uso"
   e o ponto final viravam dois itens e o gap de 10px caía entre eles. */
.onb-check span{flex:1;line-height:1.45}
.onb-check u{text-underline-offset:2px}
.seg2 button{flex:1;padding:12px 10px;border-radius:8px;background:rgba(30,23,20,.7);border:1px solid var(--linha2);
  color:var(--ink2);font-size:var(--t-label);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg2 button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}

/* ===== CADASTRO / ONBOARDING ===== */
#onb{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg);overflow:hidden}
#onb.on{display:flex}
/* 02/09 — O FUNDO DO CADASTRO SAI DA FOTO E VAI PRO DO ARQUIVO.
   Era a quadra em `--cena-url` com um scrim escuro por cima. Nas 7 telas de
   entrada do board não há foto nenhuma: é var(--bg) com o MESMO brilho radial
   lime das outras telas — o node 28:211 do CADASTRE-SE traz exatamente a
   matriz que a `--brilho` já reproduz desde 29/08.
   O que forçou a troca foi o campo. No arquivo o campo não tem preenchimento:
   quem o desenha é a borda, sobre o fundo da tela. Com a foto atrás, o
   telhado e as luzes do prédio apareciam DENTRO do campo de e-mail — o
   marrom translúcido de antes escondia isso, e por isso ninguém tinha visto.
   Ou o campo é chapado, ou o fundo é; o arquivo escolheu o fundo.
   ⚠️ A foto continua sendo o fundo do app DEPOIS do cadastro (o `#fone`
   noturno). O que muda é só a porta de entrada. */
#onb .onb-bg{position:absolute;inset:0;z-index:0;background:var(--bg)}
#onb .onb-bg::after{content:"";position:absolute;inset:0;background:var(--brilho)}
#onb .onb-wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:18px 22px max(24px,env(safe-area-inset-bottom));overflow-y:auto}
#onb .onb-wrap::-webkit-scrollbar{width:0}
#onb .onb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:30px}
#onb .onb-voltar{width:30px;height:30px;border-radius:50%;border:1px solid var(--linha2);background:rgba(30,23,20,.6);color:var(--ink2);font-size:15px;cursor:pointer}
#onb .onb-dots{display:flex;gap:6px;margin-left:auto}
#onb .onb-dots span{width:6px;height:6px;border-radius:99px;background:var(--linha2);transition:.2s}
#onb .onb-dots span.on{background:var(--acc);width:18px}
#onb .onb-brand{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
/* 10/08: o "P" de placeholder virou o símbolo da marca. Sem o círculo laranja
   por baixo: o R já é laranja, e laranja sobre laranja some. Sobre o preto da
   marca o símbolo lê sozinho — é o que o próprio logo vertical faz.
   13/08: na abertura o símbolo sozinho não bastava — o nome da marca não
   aparecia ESCRITO em nenhum lugar do app, e esta é a única tela onde alguém
   ainda não sabe como o app se chama. Entra o lockup horizontal (o lettering
   já é branco no arquivo, então lê sobre o preto). Altura livre: o arquivo é
   3,43:1 e travar num quadrado de 78px o deixaria com 23px de altura útil. */
#onb .onb-mark{width:min(272px,74%);display:flex;align-items:center;justify-content:center}
#onb .onb-mark img{width:100%;height:auto;display:block}
#onb .onb-brand h1{font-family:var(--f-disp);font-size:var(--t-display);text-transform:uppercase;letter-spacing:.03em}
#onb .onb-brand p{font-size:var(--t-label);color:var(--ink2);max-width:290px;line-height:1.5}
#onb .onb-acts{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
#onb .onb-fine{font-size:var(--t-caption);color:var(--ink3);text-align:center;margin-top:8px;line-height:1.5}
#onb .big{width:100%;padding:var(--t-title-s);border:0;border-radius:var(--rp);background:var(--marca);color:var(--marca-ink);font-weight:800;font-size:15px;cursor:pointer;font-family:var(--f-ui)}
#onb .big.alt{background:rgba(20,26,23,.72);color:var(--ink);border:1px solid var(--linha2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* 26/08 (telas do Figma) — o KICKER passa a vir ABAIXO do título.
   `column-reverse` em vez de mexer no markup: a ordem "kick, depois h2" se
   repete em NOVE telas do cadastro, e trocar as nove à mão é nove chances de
   deixar uma pra trás. O CSS vira a ordem de uma vez, e quem escrever a décima
   tela continua escrevendo na ordem antiga sem quebrar nada.
   A cor do kick já era `--up` (var(--acc)) — idêntica ao verde do desenho. */
#onb .onb-head{margin:4px 0 16px;display:flex;flex-direction:column-reverse;align-items:flex-start}
#onb .onb-head.center{text-align:center;align-items:center}
#onb .onb-kick{font-size:var(--t-nav);letter-spacing:.15em;text-transform:uppercase;color:var(--up);font-weight:700;margin:6px 0 0}
#onb .onb-head h2{font-family:var(--f-disp);font-size:var(--t-title-l);line-height:1.14;letter-spacing:.01em}
/* o título ganha o ícone circular do desenho, quando a tela tiver um */
#onb .onb-head .tt{display:flex;align-items:center;gap:10px}
#onb .onb-head .tt .ico{flex:0 0 26px;width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--acc)}
/* 26/08: borda BRANCA nos campos, como no desenho — a `--linha2` some no fundo
   escuro e o campo parecia um retângulo sem contorno.
   ⚠️ ESCALA: o Figma desenha 1px num canvas de 1080, que é 2x — ou seja, MEIO
   pixel em CSS. Copiada como 1px de branco puro, a borda dobra de peso e vira
   a coisa mais forte da tela (medido: o campo gritava mais que o botão de
   ação). `.55` de opacidade devolve o peso PERCEBIDO do desenho na espessura
   que o navegador sabe desenhar. É a mesma decisão pra qualquer traço de 1px
   que vier deste arquivo. */
.onb-input{width:100%;padding:15px;border-radius:16px;background:rgba(30,23,20,.72);border:1px solid rgba(255,254,253,.55);color:var(--ink);font-size:17px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:12px}
.onb-input:focus{outline:none;border-color:var(--acc)}
/* 25/08: o seletor perdeu o escopo #onb de propósito — o formulário de
   disponibilidade do radar usa a mesma peça fora do onboarding */
#onb .onb-preview{position:relative;height:236px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px}
/* 26/08 (Figma, node 29:416): no desenho o personagem ocupa quase toda a
   tela, de pé sobre a quadra que já é o fundo do cadastro. `min-height` com
   `vh` porque a altura útil muda muito entre um iPhone SE e um Pro Max, e
   altura fixa cortava os pés num e sobrava no outro. */
#onb .onb-preview.tall{height:auto;min-height:46vh;min-height:46dvh;flex:1}
#onb .onb-preview .glow{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:200px;height:56px;border-radius:50%;background:radial-gradient(closest-side,var(--camisa),transparent);opacity:.32;filter:blur(6px)}
#onb .onb-preview .boneco{position:relative;z-index:1;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#onb .onb-preview .boneco img{height:100%;width:auto;display:block}
#onb .onb-cards{display:flex;flex-direction:column;gap:10px}
#onb .onb-card{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border-radius:16px;background:rgba(30,23,20,.72);border:1px solid var(--linha2);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* 25/08 (telas novas): cartão escolhido fica LIME CHEIO com texto escuro */
#onb .onb-card.on{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
#onb .onb-card.on .dv{color:var(--acc-ink)}
#onb .onb-card.on .tx small{color:rgba(10,17,0,.72)}
#onb .onb-card .dv{font-family:var(--f-disp);font-size:26px;font-weight:700;width:38px;text-align:center;color:var(--acc);flex:0 0 38px}
#onb .onb-card .tx b{font-size:var(--t-title-s);display:block}
#onb .onb-card .tx small{font-size:var(--t-caption);color:var(--ink3);display:block;margin-top:2px}
#onb .onb-card>b{font-size:var(--t-title-s)}
#onb .onb-link{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:var(--t-label);margin-top:14px;cursor:pointer;align-self:center}
#onb .onb-nav{margin-top:auto;padding-top:18px}
#onb .onb-prim{width:100%;padding:16px;border:0;border-radius:var(--rp);background:var(--marca);color:var(--marca-ink);font-weight:800;font-size:var(--t-title-s);letter-spacing:0;cursor:pointer;font-family:var(--f-ui)}
#onb .onb-prim:disabled{opacity:.4;cursor:default}
/* 26/08: o secundário do desenho é BOTÃO de fundo escuro, não link sublinhado
   — mesma altura e mesmo raio do primário, e é isso que faz os dois lerem como
   duas saídas do mesmo peso em vez de "a ação e a desistência". */
#onb .onb-sec{width:100%;padding:16px;border:0;border-radius:var(--rp);background:var(--sup);
  color:var(--ink2);font-weight:600;font-size:15px;cursor:pointer;font-family:var(--f-ui);margin-top:12px}
#onb .onb-prim.lime{background:var(--marca)}   /* 25/08: telas novas — o fechamento também é laranja */
#onb .nota.center{text-align:center}

/* =========================================================================
   02/09 — AS TELAS DE ENTRADA PELO CÓDIGO DOS NODES
   CADASTRE-SE (28:204) e FICHA ESPORTIVA (29:355), as duas que faltavam da
   fileira 1 — e as duas estão marcadas "Ready for development" no arquivo,
   então o desenho não deve mais mudar debaixo disto.

   O QUE ESTAVA ERRADO ERA A SUPERFÍCIE, NÃO A ESTRUTURA. Os campos, os chips
   e os cartões do onboarding ainda carregavam `rgba(30,23,20,.72)` — um
   marrom translúcido da paleta ANTERIOR à Ranket (11/08), que sobreviveu à
   troca porque ninguém reabriu o cadastro depois dela. No arquivo não existe
   preenchimento nenhum: o que desenha o campo é a BORDA, sobre o fundo da
   tela. Era essa a diferença que fazia as telas de entrada parecerem de
   outro app que o resto.

   ⚠️ Tudo aqui é escopado em `#onb` de propósito. `.seg2`, `.onb-input` e
   `.onb-card` vazam pra fora do cadastro — `.seg2` sozinho aparece em 18
   lugares, incluindo desafio, aula e filtros. Mexer neles sem escopo
   repintaria meia dúzia de telas que ninguém pediu. */

/* o campo: sem preenchimento, borda branca sólida, raio médio.
   (era fundo marrom, borda var(--ink) a 55% e raio 16 — o dobro do desenho) */
#onb .onb-input, #onb .onb-area{
  background:transparent;
  border:1px solid var(--ink);
  border-radius:8px;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}
#onb .onb-input::placeholder, #onb .onb-area::placeholder{color:var(--ink)}

/* o chip de escolha: parado é CONTORNO LIME sobre nada, escolhido é lime
   cheio com texto escuro. O contorno lime no estado parado é do arquivo e é o
   que diz "isto aqui é escolhível" — a borda `--linha2` de antes (var(--linha2))
   não se via sobre o fundo quase preto, e os chips liam como texto solto. */
#onb .seg2 button, #onb .seg3 button{
  background:transparent;
  border:1px solid var(--acc);
  border-radius:8px;
  color:var(--ink3);
  min-height:44px;               /* R2: nenhum controle abaixo de 44 */
}
#onb .seg2 button.on, #onb .seg3 button.on{
  background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700;
}

/* o cartão de opção segue a mesma regra do chip — no arquivo os dois são a
   mesma peça em dois tamanhos (405x87 e 858x94), não duas peças. */
#onb .onb-card{
  background:transparent;
  border:1px solid var(--acc);
  border-radius:8px;
  backdrop-filter:none;-webkit-backdrop-filter:none;
}

/* O CABEÇALHO COM SINAL. Nas duas telas o título vem precedido de um
   desenho — o "R" da marca no Criar Conta (node 28:227) e a bola de tênis na
   Ficha Esportiva (node 29:385) —, com o passo em lime logo abaixo do título.
   O `column-reverse` do `.onb-head` já punha o passo embaixo; o que faltava
   era o sinal à esquerda. Por isso o bloco vira uma linha de duas colunas. */
#onb .onb-head.comsinal{flex-direction:row;align-items:center;gap:14px}
#onb .onb-head.comsinal .sinal{flex:0 0 auto;display:flex;align-items:center}
#onb .onb-head.comsinal .sinal img{display:block;height:30px;width:auto}
#onb .onb-head.comsinal .sinal.bola img{height:24px}
#onb .onb-head.comsinal .txt{display:flex;flex-direction:column-reverse;align-items:flex-start;min-width:0}

/* A PERGUNTA DA SEÇÃO. Na Ficha Esportiva cada bloco abre com um título em
   branco (30px no arquivo) e uma linha de ajuda em cinza embaixo (20px) —
   duas linhas, duas hierarquias. O app dizia as duas coisas numa frase só,
   dentro de uma `.nota`: "Quais esportes você pratica? Selecione uma ou duas
   modalidades." Lia como observação de rodapé, e não como a pergunta que a
   tela está fazendo. */
#onb .onb-pergunta{margin:20px 0 10px}
#onb .onb-pergunta b{display:block;font:700 var(--t-title-s) var(--f-ui);color:var(--ink)}
#onb .onb-pergunta small{display:block;font:400 var(--t-label) var(--f-ui);color:var(--ink3);margin-top:3px}

/* o olho do campo de senha: o desenho do arquivo (node 37:122), não os
   glifos ◉/◎. Traço em currentColor pra acompanhar o estado. */
#onb .onb-olho{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--ink3);cursor:pointer;padding:0}
#onb .onb-olho svg{width:22px;height:auto;display:block}
#onb .onb-olho.on{color:var(--acc)}
/* 26/08: a porta pra quadra particular. Tracejada e sem preenchimento de
   propósito — é "acrescentar à lista", não uma opção da lista: se parecesse um
   .onb-card viraria um clube a mais entre os clubes. */
#onb .onb-quadra-nova{width:100%;margin-top:10px;padding:13px;cursor:pointer;
  border:1px dashed var(--linha2);border-radius:12px;background:none;
  color:var(--ink2);font:700 13px var(--f-ui);text-align:center}
#onb .onb-quadra-nova:active{transform:scale(.99)}

/* ===== SALA DE TROFÉUS (Bloco 3) — overlay dentro do #fone ===== */
#trofeus{position:absolute;inset:0;z-index:40;display:none;overflow:hidden;background:#0A0806}
#trofeus.on{display:block}
#trofeus .tr-cena{position:absolute;inset:0;z-index:0;background-repeat:no-repeat}
#trofeus .tr-veu{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,8,6,.82) 0%,rgba(10,8,6,.28) 13%,rgba(10,8,6,0) 26%,rgba(10,8,6,0) 74%,rgba(10,8,6,.9) 100%)}
#trofeus .tr-topo{position:absolute;top:0;left:0;right:0;z-index:4;padding:16px 54px 10px 18px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#trofeus .tr-topo h2{font:400 var(--t-title-l)/1 var(--f-disp);margin:0;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#trofeus .tr-cnt{font:700 var(--t-nav) var(--f-ui);letter-spacing:.1em;color:var(--ink2);white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#trofeus .tr-cnt b{color:var(--gold)}
#trofeus .tr-abas{position:absolute;top:58px;left:0;right:0;z-index:4;display:flex;gap:8px;padding:0 18px}
#trofeus .tr-aba{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--linha);
  background:rgba(12,9,8,.55);backdrop-filter:blur(6px);color:var(--ink2);font:600 12px var(--f-ui);cursor:pointer}
#trofeus .tr-aba.on{background:var(--gold);color:#1a1208;border-color:var(--gold)}
#trofeus .tr-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  background:rgba(21,16,13,.7);border:1px solid var(--linha2);color:var(--ink);font-size:20px;cursor:pointer;z-index:5}
#trofeus .tr-prat{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:flex-end;justify-content:space-evenly;gap:2px;padding:0 26px}
#trofeus .tr-cint{position:absolute;left:0;right:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#trofeus .tr-peca{position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:0}
#trofeus .tr-peca img,#trofeus .tr-cint img{display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
#trofeus .tr-cint img{height:78px}
#trofeus .tr-peca.nao img,#trofeus .tr-cint.nao img{filter:brightness(0) opacity(.34) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
#trofeus .tr-peca em,#trofeus .tr-cint em{position:absolute;top:100%;left:-8px;right:-8px;margin-top:3px;
  font:600 8.5px var(--f-ui);letter-spacing:.02em;text-align:center;color:var(--ink2);font-style:normal;
  text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trofeus .tr-peca.nao em{color:var(--ink3)}
/* 15/08 — a etiqueta do cinturão SOBE em vez de descer.
   Ela mora na prateleira de cima, e o `top:100%` das outras a jogava pra baixo,
   na mesma faixa por onde sobem as peças da 1ª prateleira. Na aba Selos essa
   prateleira está sempre cheia (12 de 12), e era por isso que só ali o
   "Sem dono na sua comunidade" aparecia atravessado nas peças.
   Não era camada velha não limpa: `#tr-camadas` é reescrito inteiro a cada
   render. Era colisão de layout mesmo. Acima do cinturão não há nada, então é
   pra lá que a etiqueta cabe. */
#trofeus .tr-peca.coroa em{top:auto;bottom:100%;margin:0 0 5px}
#trofeus .tr-peca.sel::after{content:"";position:absolute;inset:-6px -4px 12px;border:1px solid var(--gold);border-radius:8px}
#trofeus .tr-det{position:absolute;left:0;right:0;bottom:0;z-index:5;border-top:1px solid var(--linha);
  background:rgba(12,9,8,.9);backdrop-filter:blur(10px);padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
#trofeus .tr-det b{font:600 var(--t-title-s) var(--f-ui);display:flex;align-items:center}
#trofeus .tr-det p{margin:5px 0 0;font-size:var(--t-label);color:var(--ink2)}
#trofeus .tr-pill{font:700 9px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-left:8px}
#trofeus .tr-pill.tem{background:var(--up-bg);color:var(--up)}
#trofeus .tr-pill.nao{background:var(--sup2);color:var(--ink3)}

/* ===== TELA DE DESAFIO — VS (estilo Cartola) ===== */
#vs{position:absolute;inset:0;z-index:60;display:none;overflow:hidden}
#vs.on{display:flex;flex-direction:column}
#vs .vs-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
#vs .vs-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,8,6,.9) 0%,rgba(11,8,6,.28) 24%,rgba(11,8,6,.2) 52%,rgba(11,8,6,.88) 88%,rgba(11,8,6,.98) 100%)}
#vs .vs-top{position:relative;z-index:3;padding:26px 20px 0;text-align:center}
#vs .vs-kick{font:400 var(--t-title-l)/1.15 var(--f-disp);color:var(--ink);text-shadow:0 2px 12px rgba(0,0,0,.9)}
#vs .vs-arena{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
#vs .vs-lado{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
#vs .vs-lado .bfig{position:relative;height:250px;max-height:38vh;display:flex;align-items:flex-end;justify-content:center}
#vs .vs-lado .bfig::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(10px);z-index:-1}
#vs .vs-lado img.bcv{height:250px;max-height:38vh;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
#vs .vs-nome{margin-top:8px;font:700 var(--t-label) var(--f-ui);color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#vs .vs-x{z-index:2;font:400 30px var(--f-disp);color:var(--acc);text-shadow:0 2px 14px rgba(0,0,0,.9);flex:0 0 auto;padding-bottom:34px}
#vs .vs-card{position:relative;z-index:3;padding:16px 18px calc(18px + env(safe-area-inset-bottom));background:rgba(12,9,8,.72);backdrop-filter:blur(10px);border-top:1px solid var(--linha)}
#vs .vs-adv{text-align:center;margin-bottom:14px}
#vs .vs-adv b{font:600 var(--t-title-s) var(--f-ui);color:var(--ink)}
#vs .vs-id{font-size:var(--t-caption);color:var(--ink3);font-weight:400}
#vs .vs-meta{font-size:var(--t-caption);color:var(--ink2);margin-top:3px}
#vs .vs-acoes{display:flex;gap:10px}
#vs .vs-acoes button{flex:1;padding:15px;border-radius:13px;border:none;font:700 15px var(--f-ui);cursor:pointer}
#vs .vs-no{background:#2a1a16;color:var(--ink);border:1px solid var(--linha2)}
#vs .vs-ok{background:var(--up);color:var(--acc-ink)}

/* =========================================================================
   TELA DE MATCH GAME (03/09) — node 1:2334 do `RANKET - TELAS FINAIS`.
   É a tela de DEPOIS do aceite. Não confundir com o `#vs` logo acima, que é
   a de ANTES ("quem vai ganhar?", Aceitar/Recusar): mesmo momento do fluxo,
   telas diferentes. As duas dividem a casca — fundo de quadra e bonecos —,
   e é por isso que esta reaproveita a mesma quadra em vez de trazer a foto
   do arquivo: o fundo do app é escolhido pelo jogador no vestiário, e cravar
   a foto do Figma apagaria essa escolha.
   O arquivo desenha os avatares como FOTO de rosto. O app não tem foto de
   perfil — tem boneco. `estiloRosto()` enquadra a cabeça do boneco no
   círculo pela proporção medida de cada um, que é o equivalente honesto. */
#mg{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#mg.on{display:flex}
#mg .mg-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center}
#mg .mg-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,11,11,.82) 0%,rgba(11,11,11,.55) 42%,rgba(11,11,11,.92) 100%)}
/* 03/09: o conteúdo CENTRALIZA. `margin-top:auto` nos botões colava eles no
   rodapé e abria um vazio no miolo — no arquivo os botões ficam a ~74% da
   altura, com folga embaixo, não grudados na borda. */
#mg .mg-in{position:relative;z-index:2;padding:calc(14px + env(safe-area-inset-top)) var(--pad-lado)
  calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100%;
  justify-content:center}
#mg .mg-x{position:absolute;top:calc(14px + env(safe-area-inset-top));left:var(--pad-lado)}
#mg .mg-x{align-self:flex-start;width:34px;height:34px;border-radius:50%;border:1px solid var(--linha3);
  background:rgba(18,18,18,.6);color:var(--ink);font:400 17px var(--f-ui);cursor:pointer;line-height:1}
#mg .mg-kick{margin-top:26px;text-align:center;font:400 var(--t-body) var(--f-ui);
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
#mg .mg-tit{margin-top:6px;text-align:center;font:700 clamp(34px,11vw,46px)/1.05 var(--f-disp);color:var(--acc)}
#mg .mg-rule{height:1px;background:var(--linha3);margin:14px auto 0;max-width:78%;width:100%}
#mg .mg-sub{margin-top:12px;text-align:center;font:400 var(--t-body) var(--f-ui);color:var(--ink3)}
#mg .mg-duo{display:flex;align-items:flex-start;justify-content:center;gap:8px;margin-top:26px}
#mg .mg-lado{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
/* o círculo do arquivo tem 324 de 1080 = 30% da largura do frame */
#mg .mg-face{width:100%;max-width:150px;aspect-ratio:1;border-radius:50%;border:2px solid var(--acc);
  background-color:var(--bg);background-repeat:no-repeat}
#mg .mg-nome{margin-top:12px;font:700 var(--t-body) var(--f-ui);color:var(--ink);text-transform:uppercase;
  text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mg .mg-pil{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:space-around;gap:6px;
  padding:8px 10px;border-radius:var(--rp);border:1px solid var(--acc);background:rgba(18,18,18,.5)}
#mg .mg-pil b{font:700 var(--t-body) var(--f-ui);color:var(--acc)}
#mg .mg-pil span{font:400 var(--t-body) var(--f-ui);color:var(--ink3)}
#mg .mg-pos{margin-top:8px;font:400 var(--t-caption) var(--f-ui);color:var(--ink);text-align:center}
/* as raquetes do arquivo entram pelo recorte que o próprio arquivo faz: o PNG
   exportado é a imagem inteira (900x1600) e o frame mostra uma fração dela */
#mg .mg-net{flex:0 0 22%;align-self:center;position:relative;overflow:hidden;aspect-ratio:205/184;margin-top:34px}
#mg .mg-net img{position:absolute;width:407.67%;height:807.84%;left:-154.23%;top:-226.96%;max-width:none}
/* 03/09: três selos numa linha só. Com `--t-caption` (12px) os rótulos
   quebravam em duas linhas e desalinhavam os ícones; 11px com gap menor é o
   que faz os três caberem lado a lado como no arquivo. O `min-width:0` é o
   que permite o texto encolher em vez de empurrar o vizinho. */
#mg .mg-selos{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:14px 10px;border-radius:var(--r);background:rgba(11,11,11,.8)}
#mg .mg-selo{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
#mg .mg-selo svg{flex:0 0 auto;width:20px;height:20px}
#mg .mg-selo em{font-style:normal;font:400 var(--t-nav) var(--f-ui);color:var(--ink);line-height:1.25}
#mg .mg-barras{flex:0 0 auto;display:flex;align-items:flex-end;gap:2px;height:20px}
#mg .mg-barras i{display:block;width:3px;background:var(--acc);border-radius:1px}
#mg .mg-acoes{margin-top:22px;display:flex;gap:10px}
/* 03/09: 13px e nowrap. O arquivo escreve o rótulo em 20px sobre um frame de
   1080 — proporcionalmente isso é ~7px num iPhone, pequeno demais pra usar
   literal. Com 15px "Enviar mensagem" quebrava em duas linhas e o botão
   crescia; 13px é o maior tamanho em que os dois rótulos cabem numa linha. */
#mg .mg-acoes button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:14px 8px;border-radius:var(--rp);font:700 var(--t-label) var(--f-ui);cursor:pointer;border:none;
  white-space:nowrap}
#mg .mg-acoes svg{width:19px;height:19px;flex:0 0 auto}
/* 03/09: `button.classe`, não `.classe`. A regra de cima (`#mg .mg-acoes
   button`) já tem elemento na conta e vence uma classe sozinha — era ela que
   apagava a borda do botão vazado, nas duas telas. */
#mg .mg-acoes button.mg-msg{background:var(--marca);color:var(--marca-ink)}
#mg .mg-acoes button.mg-hora{background:none;border:1px solid var(--acc);color:var(--acc)}

/* =========================================================================
   NOVA PARTIDA CRIADA (03/09) — node 1:3429. O irmão da MATCH GAME: aquela
   fecha o ACEITE, esta fecha o ENVIO. Até agora o envio era um toast.
   O "Let's Ranket" aqui NÃO é texto — o arquivo desenha o lettering da marca
   em curvas (a MATCH GAME usa Inter de verdade). Vem do export como SVG.
   ========================================================================= */
#np{position:fixed;inset:0;z-index:60;display:none;background:var(--bg)}
#np.on{display:flex}
#np .np-brilho{position:absolute;inset:0;background:var(--brilho),var(--bg)}
#np .np-in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:calc(20px + env(safe-area-inset-top)) var(--pad-lado) calc(20px + env(safe-area-inset-bottom))}
#np .np-marca{width:64px;margin-bottom:26px}
#np .np-marca svg{width:100%;height:auto;display:block}
#np .np-lettering{width:min(78%,300px);color:var(--acc)}
#np .np-lettering svg{width:100%;height:auto;display:block}
#np .np-txt{margin-top:22px;max-width:32ch;font:400 var(--t-label)/1.55 var(--f-ui);color:var(--ink3)}
#np .np-acoes{margin-top:40px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#np .np-acoes button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:16px 12px;border-radius:15px;font:700 var(--t-body) var(--f-ui);cursor:pointer;border:none}
#np .np-acoes svg{width:20px;height:20px;flex:0 0 auto}
#np .np-acoes button.np-share{background:none;border:1px solid var(--ink3);color:var(--ink3);font-weight:500}
#np .np-acoes button.np-ok{background:var(--marca);color:var(--marca-ink)}

/* =========================================================================
   CRIAR POST (03/09) — node 1:3743. Até agora postar era um campo dentro do
   feed: um no feed da Comunidade (index 3804) e outro no feed do Grupo
   (index 4104), duas portas pro mesmo `netPostar`. A tela do arquivo junta
   as duas e põe a escolha do destino ANTES do texto, que é a ordem certa:
   onde vai aparecer muda o que a pessoa escreve.
   ========================================================================= */
#cp{position:fixed;inset:0;z-index:60;display:none;background:var(--bg);overflow-y:auto}
#cp.on{display:block}
#cp .cp-brilho{position:absolute;inset:0;background:var(--brilho),var(--bg);pointer-events:none}
#cp .cp-topo{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad-lado) 12px;
  background:var(--acc-ink);border-bottom:1px solid var(--linha3)}
#cp .cp-voltar{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha3);
  background:none;color:var(--ink);font:400 17px var(--f-ui);cursor:pointer;line-height:1;flex:0 0 auto}
#cp .cp-in{position:relative;z-index:1;padding:20px var(--pad-lado) calc(24px + env(safe-area-inset-bottom))}
#cp .cp-h1{font:700 var(--t-title-l) var(--f-disp);color:var(--ink);margin-bottom:16px}
#cp .cp-cartao{background:rgba(11,11,11,.8);border-radius:var(--r-lg);padding:18px 16px}
#cp .cp-rot{font:700 var(--t-body) var(--f-ui);color:var(--ink);margin-bottom:12px}
#cp .cp-dest{display:flex;gap:12px}
#cp .cp-dest button{flex:1;min-width:0;text-align:left;padding:14px 13px;border-radius:var(--r);
  background:none;border:1px solid var(--ink3);color:var(--ink3);cursor:pointer}
#cp .cp-dest button.sel{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#cp .cp-dest svg{width:17px;height:19px;display:block;margin-bottom:9px}
#cp .cp-dest b{display:block;font:700 var(--t-label) var(--f-ui);margin-bottom:6px}
#cp .cp-dest span{display:block;font:400 var(--t-caption)/1.35 var(--f-ui)}
#cp .cp-grupo{margin-top:12px;width:100%;padding:13px 12px;border-radius:var(--r);
  background:var(--sup);border:1px solid var(--ink3);color:var(--ink);font:400 var(--t-body) var(--f-ui)}
#cp textarea.cp-txt{margin-top:18px;width:100%;min-height:150px;resize:vertical;padding:14px 13px;
  border-radius:var(--r);background:none;border:1px solid var(--ink3);color:var(--ink);
  font:400 var(--t-body)/1.5 var(--f-ui)}
#cp textarea.cp-txt::placeholder{color:var(--ink3)}
#cp .cp-foto{margin-top:18px;width:100%;display:flex;align-items:center;justify-content:center;gap:11px;
  padding:16px 12px;border-radius:15px;background:none;border:1px solid var(--ink3);
  color:var(--ink3);font:700 var(--t-body) var(--f-ui);cursor:pointer}
#cp .cp-foto svg{width:22px;height:22px;flex:0 0 auto}
#cp .cp-previa{margin-top:12px;width:100%;border-radius:var(--r);display:block}
#cp .cp-loc{margin-top:20px}
#cp .cp-loc .cp-rot{margin-bottom:9px}
#cp .cp-pub{margin-top:18px;width:100%;padding:17px 12px;border-radius:15px;border:none;
  background:var(--marca);color:var(--marca-ink);font:700 var(--t-body) var(--f-ui);cursor:pointer}
#cp .cp-pub[disabled]{opacity:.5;cursor:default}

/* =========================================================================
   REGISTRAR ATIVIDADE (03/09) — nodes 1:3469 (hub), 1:3533 (casual),
   1:3593 (aula), 1:3657 (treino solo).
   Quatro telas no arquivo, DOIS passos aqui: o hub escolhe modalidade e
   tipo, e o detalhe muda de cara conforme o tipo. As três telas de detalhe
   são o mesmo formulário com uma seção trocada — construir três telas
   separadas seria manter três cópias da data, do local e das notas.
   ========================================================================= */
#at{position:fixed;inset:0;z-index:60;display:none;background:var(--bg);overflow-y:auto}
#at.on{display:block}
#at .at-brilho{position:absolute;inset:0;background:var(--brilho),var(--bg);pointer-events:none}
#at .at-topo{position:sticky;top:0;z-index:2;display:flex;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad-lado) 12px;
  background:var(--acc-ink);border-bottom:1px solid var(--linha3)}
#at .at-voltar{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha3);
  background:none;color:var(--ink);font:400 17px var(--f-ui);cursor:pointer;line-height:1}
#at .at-in{position:relative;z-index:1;padding:20px var(--pad-lado) calc(24px + env(safe-area-inset-bottom))}
#at .at-h1{font:700 var(--t-title-l) var(--f-disp);color:var(--ink);margin-bottom:16px}
#at .at-cartao{background:rgba(11,11,11,.8);border-radius:var(--r-lg);padding:18px 16px}
#at .at-rot{font:700 var(--t-body) var(--f-ui);color:var(--ink);margin:0 0 12px}
#at .at-rot+.at-rot,#at .at-bloco+.at-bloco{margin-top:22px}
#at .at-pilulas{display:flex;gap:10px}
#at .at-pilulas button{flex:1;padding:12px 8px;border-radius:var(--rp);cursor:pointer;
  background:none;border:1px solid var(--ink3);color:var(--ink3);font:400 var(--t-body) var(--f-ui)}
#at .at-pilulas button.sel{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
#at .at-lista button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 13px;border-radius:10px;cursor:pointer;margin-bottom:10px;
  background:none;border:1px solid var(--ink3);color:var(--ink3);font:400 var(--t-body) var(--f-ui)}
#at .at-lista button.sel{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#at .at-lista svg{width:22px;height:22px;flex:0 0 auto}
#at .at-lista b{font-weight:700}
#at .at-quando{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#at .at-quando .as{color:var(--ink3);font:400 var(--t-label) var(--f-ui)}
#at input.at-c,#at select.at-c,#at textarea.at-c{padding:13px 12px;border-radius:10px;
  background:none;border:1px solid var(--ink3);color:var(--ink);font:400 var(--t-body) var(--f-ui)}
/* 03/09: o arquivo põe data, hora, "às" e hora numa linha só — em 1080px de
   frame cabe, em 375px de iPhone não: o segundo campo caía pra baixo e o "às"
   ficava órfão no fim da primeira linha. A data toma a linha inteira e as duas
   horas dividem a seguinte com o "às" entre elas, que é a mesma leitura. */
#at input.at-c[type=date]{flex:1 1 100%;min-width:0}
#at input.at-c[type=time]{flex:1 1 0;min-width:0;text-align:center}
#at select.at-c,#at textarea.at-c,#at input.at-c.larg{width:100%}
#at textarea.at-c{min-height:110px;resize:vertical;line-height:1.5}
#at select.at-c[multiple]{min-height:112px}
#at .at-dica{margin-top:8px;font:400 var(--t-caption)/1.45 var(--f-ui);color:var(--ink3)}
#at .at-lei{margin-top:14px;padding:12px 13px;border-radius:10px;
  background:var(--up-bg);color:var(--ink3);font:400 var(--t-caption)/1.5 var(--f-ui)}
#at .at-lei b{color:var(--acc)}
#at .at-ok{margin-top:18px;width:100%;padding:17px 12px;border-radius:15px;border:none;
  background:var(--marca);color:var(--marca-ink);font:700 var(--t-body) var(--f-ui);cursor:pointer}
#at .at-ok[disabled]{opacity:.5;cursor:default}

/* botão Concluir do vestiário quando ele é aberto durante o cadastro */
.vest-concluir{position:absolute;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:30;
  padding:16px;border:0;border-radius:var(--rp);background:var(--marca);color:var(--marca-ink);
  font:800 15px var(--f-ui);cursor:pointer;box-shadow:0 8px 24px rgba(255,106,0,.35)}
</style>
</head>
<body>

<div id="fone">
  <div id="amb"></div>
  <!-- 07/08: a barra de status falsa (hora + sinal) saiu — no celular de
       verdade ela duplica a barra do sistema, dois centímetros acima.
       18/08: saiu a engrenagem e, com ela, a faixa inteira. O app ganha os
       42px de volta no topo, que é onde eles fazem mais falta. -->

  <div class="topo" id="topo">
    <button class="voltar" id="voltar">‹</button>
    <div class="marca" id="marca"><img src="../marcas/ranket-r.png" alt="Ranket"></div>
    <h1 id="titulo">Quadro</h1>
    <!-- 01/09 (node 31:738) — A BUSCA DO RADAR. O Figma põe uma pílula de
         busca de 717x53 (raio 100, borda var(--ink3)) ocupando o meio do topo,
         entre o voltar e o avatar, e NÃO escreve título de tela nessa aba.
         O app não tinha campo nenhum — a busca por nome só existia dentro de
         _net.abrirBusca(). Aparece só no radar; nas outras telas o título
         segue como está. -->
    <form class="topo-busca" id="topoBusca" hidden onsubmit="return radarBuscar(event)">

/* 09/08: calibragem em degrau — a incerteza é máxima na partida 1, não na 8.

const CAL_DEGRAU = [3,3,3, 2,2,2, 1.5,1.5];
function multCal(calibrando, cal){
  if(!calibrando) return 1;
  // sem `cal` (chamada legada) assume o começo da calibragem — o degrau mais alto
  const i = Number.isFinite(cal) ? Math.floor(cal) : 0;

const PALETA  = ['#C9663C','#0C3B2A','#A8894F','#1E3A2F','#F2EAE0',
