        </div></div>`;}).join('')
    : `<div class="card"><p class="nota">Você ainda não está em nenhuma comunidade. É nela que a partida entre membros vira ranking próprio — e onde o cinturão existe.</p></div>`;

  /* 12/08: esta seção lia S.feed, que é zerado no boot e nunca preenchido —
     desenhava nada, sempre. Agora traz o destaque por movimento, do protótipo
     `quadro-circuito`: o que MUDOU na semana, não quem está no topo. Só entra
     linha com base real; sem base, o vazio é dito em vez de fingido. */
  const dest = window.__destaques;
  const feed = !dest ? ''
    : dest.length ? dest.map(f=>`
      <div class="card"><div class="linha-item">
        <div class="av">${f.ic}</div>
        <div class="txt"><b>${f.v}</b><small>${f.k} · ${f.d}</small></div>
      </div></div>`).join('')
    : `<div class="card"><p class="nota">Ainda não houve movimento essa semana. Assim que os placares começarem a entrar, aparece aqui quem subiu, quem deu zebra e quem estreou.</p></div>`;

  return {titulo:'Quadro', dir:`Semana ${S.semana} de 12`, html:`
    <div class="hero">
      <div class="cab-hero">
        ${avatar(EU,'gg')}
        <div class="txt">
          <div class="nm">${eu.nome}</div>
          <!-- cidade DERIVADA do local principal (migração 19) — o hardcode
               Salvador/BA fica só de fallback pra quem ainda não marcou onde joga -->
          <div class="sub">${eu.clube} · ${(window.__meusLocais&&window.__meusLocais.cidade)||'Salvador/BA'}</div>
        </div>
      </div>
      <div class="linha-nivel">
        <div class="n">${nivelDe(eu)}</div>
        <div class="lb">Nível · Classe ${divDe(eu)}</div>
      </div>
      <div class="stats">
        <div><div class="v">${pos.comunidade}º</div><div class="k">Na comunidade</div></div>
        <div><div class="v">${S.historico.length}</div><div class="k">Jogos</div></div>
      </div>
    </div>

    <div class="sec">
      <div class="rot">Quadro da comunidade <span>somente leitura</span></div>
      <div class="tab">
        <div class="cab"><div class="r">#</div><div></div><div>Jogador</div><div class="c">Mov</div><div class="r">Pts</div></div>
        ${linhas}
      </div>
      <p class="nota" style="margin-top:9px">Não existe botão de desafiar aqui — é o que mata a fila no topo. Pra jogar, o caminho é o Radar.</p>
    </div>

    <div class="sec">
      <div class="rot">Suas comunidades${meusQ&&meusQ.length?` <span>${meusQ.length}</span>`:''}</div>
      ${comunidades}
      <div class="card clic" onclick="toast('O Ace Open é um Open — chave aberta, não gera ranking próprio.')">
        <div class="linha-item">
          <div class="txt"><b>${S.open.nome}</b><small>${S.open.local} · ${openLinha()}</small></div>
          ${S.open.inscrito?'<span class="pil gold">Inscrito</span>':''}
        </div></div>
    </div>

    <div class="sec">
      <div class="rot">Agora na comunidade</div>
      ${feed}
    </div>

    <div class="sec">
      <div class="rot">Cinturão</div>
      ${(c && S.jogadores[c.dono]) ? `<div class="card" style="border-color:var(--gold)">
        <div class="linha-item">
          ${avatar(c.dono,'g')}
          <div class="txt"><b>${nome(c.dono)}</b><small>♦ Campeão há ${c.desde} dias</small></div>
          <span class="pil gold">Dono</span>
        </div>
        <!-- 12/08: aqui havia "Aspirante", com ap(c.aspirante) sem guarda — e
             aspirante NÃO EXISTE MAIS desde 09/08: o cinturão passa pra quem
             vencer o dono numa partida normal, sem desafio formal e sem
             cooldown. Além de contar um modelo revogado, quebrava a aba inteira
             quando o campo faltava, que é o formato que vem do banco hoje
             (cinturao_dono_id + cinturao_desde, e nada mais).
             O que a tela mostra agora é o que a decisão manda: o histórico na
             cara, e o relógio que impede o "não jogar" de ser a estratégia. -->
        <div class="stats" style="margin-top:13px">
          <div><div class="v" style="font-size:14px">${c.desde}d</div><div class="k">Reinado</div></div>
          <div><div class="v" style="font-size:14px">${c.defesas ?? 0}</div><div class="k">Defesas</div></div>
          <div><div class="v" style="font-size:14px">${c.prazoDias}d</div><div class="k">Vence em</div></div>
        </div>
        <p class="nota" style="margin-top:11px">Não existe desafio formal: o cinturão passa pra quem vencer o dono numa partida normal. Ficar 14 dias sem jogar congela o reinado, e 30 dias entregam o cinturão pro 1º do ranking da comunidade — segurar parando não funciona.</p>
      </div>` : `<div class="card"><p class="nota">O cinturão ainda não tem dono. Quando a comunidade tiver disputa rolando, o primeiro campeão aparece aqui.</p></div>`}
    </div>

    <div class="sec">
      <div class="rot">Patches <span>pertencimento, não mérito</span></div>
      ${S.comunidade.patches.map(p=>`
        <div class="card"><div class="linha-item">
          <div class="av">◈</div>
          <div class="txt"><b>${p.t}</b><small>criado por ${nome(p.de)}</small></div>
        </div></div>`).join('')}
      <!-- 11/08 (noite): o backend chegou (migração 22) e o botão morto virou
           porta: patch mora na comunidade real, então o caminho é abrir a sua
           e criar lá — o sheet dela tem o "◈ Patches da comunidade". -->
      <button class="btn gh" onclick="netAbrirGrupos()">◈ Criar e mandar patch — na sua comunidade</button>
      <p class="nota" style="margin-top:9px">Até 24 caracteres, filtro de 3 camadas, autoria sempre visível. Patch não se ganha — se recebe.</p>
    </div>

    <div class="sec">
      <div class="rot">Copa interna</div>
      <div class="card clic" onclick="toast('A copa organiza partidas — não cria outro ranking. Cada resultado conta nas comunidades onde os dois jogadores estão.')">
        <div class="linha-item">
          <div class="txt"><b>Copa do Sábado</b><small>Chave de 8 · eliminatória simples</small></div>
          <div class="seta">›</div>
        </div></div>
    </div>
`};
},

/* ---------------- RADAR ---------------- */
radar(){
  /* 25/08 — "ENCONTRAR" (pedido do Rege): a aba deixa de ser só o radar de
     jogadores e ganha categorias. A CHAVE DE ROTA continua `radar`: só o
     rótulo muda, então nenhuma das duas dezenas de `trocarAba('radar')`
     espalhadas pelo app precisa ser tocada.
     Duas categorias nesta rodada, e as duas nascem CHEIAS: jogadores (o radar
     inteiro) e lugares (12 já semeados, 9 com telefone). Professores e
     equipamentos ficaram de fora de propósito — abririam vazias. */
  S.encCat = S.encCat || 'jogadores';
  const catBt=(v,n)=>`<button class="rtab ${S.encCat===v?'on':''}" onclick="encCat('${v}')">${n}</button>`;
  /* as QUATRO categorias que o Rege pediu. Duas nascem cheias (jogadores e
     lugares), duas dependem de gente se declarar e de curadoria — e as duas
     dizem isso na cara em vez de fingirem lista. */
  const seletor = `<div class="sec" style="padding-bottom:0">
      <div class="rtabs" style="margin-bottom:4px;font-size:11px">
        ${catBt('jogadores','Jogadores')}${catBt('professores','Professores')}${catBt('lugares','Lugares')}${catBt('equip','Equip.')}
      </div>
    </div>`;

  if(S.encCat === 'lugares')     return {titulo:'Encontrar', dir:'', html: seletor + lugaresHTML()};
  if(S.encCat === 'professores') return {titulo:'Encontrar', dir:'', html: seletor + professoresHTML()};
  if(S.encCat === 'equip')       return {titulo:'Encontrar', dir:'', html: seletor + equipHTML()};

  const eu=S.jogadores[EU];
  const ordemDiv=['A','B','C','D'];
  /* (66) `indexOf` devolve -1 quando a classe é desconhecida, e aí
     `ordemDiv[-1-1]` e `ordemDiv[0]` faziam a faixa virar ['A'] — o radar
     mostrava só classe A, em silêncio, sem ninguém perceber. */
  const _d = divDe(eu) || 'C';
  const i = Math.max(0, ordemDiv.indexOf(_d));
  const permitidas=[ordemDiv[i-1],_d,ordemDiv[i+1]].filter(Boolean);

  dispCarregar();                                   // 25/08: slots meus e do mundo (lazy)
  const minhas = window.__dispMinhas||null;
  const todas  = window.__dispTodas||{};
  S.radarSub = S.radarSub||'agora';
  const F = S.radarF||{};

  // Jogadores REAIS na faixa de ±1 classe. Banido não aparece (mig 41).
  /* (67) E quem não compete também não. O radar itera `S.jogadores`, que é o
     elenco INTEIRO de propósito — o nome do professor precisa aparecer na
     turma, no chat e na busca. Quem filtra por competição é
     `S.comunidade.membros` (66), e o radar não passa por lá. Era a última
     superfície das três que o comment de `players.joga` promete: o professor
     que desligou o "eu jogo" seguia listado como oponente, Classe D, porque
     `nivel` nasce 1200 e a 66 decidiu não tocar no motor. */
  let disp = Object.keys(S.jogadores)
    .filter(id=> id!==EU && S.jogadores[id] && !S.jogadores[id].banido
                 && S.jogadores[id].joga !== false)
    .map(id=> ({id, j:S.jogadores[id], slots:(todas[id]||[]).filter(x=>x.esporte===S.esporte)}))
    .filter(x=> permitidas.includes(divDe(x.j)));

  // filtros do painel (25/08): classe · tipo · quadra · dia · período · livres agora
  if(F.classe) disp=disp.filter(x=> divDe(x.j)===F.classe);
  const slotPassa=(sl)=>{
    if(F.tipo && sl.tipo!==F.tipo) return false;
    if(F.quadra && sl.quadra!==F.quadra) return false;
    if(F.dia!=null && new Date(sl.quando).getDay()!==F.dia) return false;
    if(F.per){ const h=new Date(sl.quando).getHours();
      if(F.per==='m' && h>=12) return false;
      if(F.per==='t' && (h<12||h>=18)) return false;
      if(F.per==='n' && h<18) return false; }
    return true;
  };
  const temFiltroSlot = F.tipo||F.quadra||F.dia!=null||F.per;
  if(temFiltroSlot) disp=disp.map(x=>({...x, slots:x.slots.filter(slotPassa)}));

  // chips de lugar (mig 19) continuam valendo por baixo do painel
  const meu=window.__meusLocais||{}; const mapa=window.__mapaLocais||{};
  const tenhoLocal=!!meu.principal;
  const tenhoRegiao = tenhoLocal && !!meu.regiaoId;
  if(F.lugar==='clube' && tenhoLocal)
    disp=disp.filter(x=>{ const m=mapa[x.id]; return !m || (meu.ids||[]).includes(m.local_id); });
  if(F.lugar==='regiao' && tenhoRegiao)
    disp=disp.filter(x=>{ const m=mapa[x.id]; return !m || !m.regiao_id || m.regiao_id===meu.regiaoId; });
  if(F.lugar==='cidade' && tenhoLocal)
    disp=disp.filter(x=>{ const m=mapa[x.id]; return !m || m.cidade_id===meu.cidadeId; });

  // classificação temporal de cada oponente (abas das telas novas)
  disp = disp.map(x=> ({...x, t:dispClasse(x.slots, x.j)}));
  const naAba = (x)=> S.radarSub==='agora' ? x.t.agora : (S.radarSub==='hoje' ? (x.t.hoje||x.t.agora) : (x.t.semana||x.t.agora));
  let lista = disp.filter(naAba);
  if(F.livresAgora) lista = lista.filter(x=>x.t.agora);
  // quem tem sinal mais próximo vem primeiro; sem slot (só livre_ate) fica no topo
  lista.sort((a,b)=> (a.t.prox? new Date(a.t.prox.quando):0) - (b.t.prox? new Date(b.t.prox.quando):0));

  const euLivre = !!(eu.livreAte && new Date(eu.livreAte) > new Date());

  // régua semanal: os próximos 7 dias, slots meus por dia
  const hoje0=new Date(); hoje0.setHours(0,0,0,0);
  const dias=[...Array(7)].map((_,k)=>{ const d=new Date(hoje0.getTime()+k*86400e3); return d; });
  const meusSlots=(minhas||[]);
  const colDia=(d)=>{
    const ini=d.getTime(), fimD=ini+86400e3;
    const sl=meusSlots.filter(x=>{ const t=new Date(x.quando).getTime(); return t>=ini&&t<fimD; });
    const pill=sl.slice(0,3).map(x=>{ const dt=new Date(x.quando);
      return `<span class="dsl">${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}</span>`; }).join('');
    return `<div class="dcol ${sl.length?'tem':''}">${pill||'<span class="doff">OFF</span>'}<b>${DIAS_PT[d.getDay()]}</b></div>`;
  };

  const nFiltros=['classe','tipo','quadra','per','lugar'].filter(k=>F[k]).length+(F.dia!=null?1:0)+(F.livresAgora?1:0);
  const abaBt=(v,n)=>`<button class="rtab ${S.radarSub===v?'on':''}" onclick="radarSub('${v}')">${n}</button>`;

  const card=(x)=>{
    const sl=x.t.prox;
    const cat=categoriaDe(nivelDe(x.j), divDe(x.j));
    const rot = x.t.agora && !sl ? '🎾 com bola na mão' : (sl? dispRotulo(sl) : '');
    const lug = sl && (sl.bairro||sl.cidade) ? [sl.bairro,sl.cidade,sl.uf].filter(Boolean).join(', ')
              : ((mapa[x.id] && window._net && _net.locNome) ? (_net.locNome(mapa[x.id].local_id)||'') : '');
    const qd  = sl&&sl.quadra ? {saibro:'Quadra de saibro',dura:'Quadra dura',rapida:'Quadra rápida'}[sl.quadra] : '';
    return `
    <div class="card oc">
      <div class="linha-item" style="align-items:flex-start">
        ${avatar(x.id,'g')}
        <div class="txt">
          <b style="font-size:15px">${nome(x.id)}</b>
          <small>▦ Classe ${divDe(x.j)}${cat}</small>
          ${lug?`<small>📍 ${lug}</small>`:''}
          ${qd?`<small>▤ ${qd}</small>`:''}
        </div>
        <div class="odir">
          ${rot?`<span class="olivre">🎾 ${rot.replace('Livre ','Livre ')}</span>`:''}
          <button class="oconv" onclick="netDesafiar('${x.id}')">Convidar</button>
          <button class="operf" onclick="netVerJogador('${x.id}')">Ver perfil</button>
        </div>
      </div>
    </div>`;
  };

  return {titulo:'Encontrar', dir:`±1 classe`, html: seletor + `
    <div class="sec">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
        <b style="font-family:var(--f-disp);font-size:17px;flex:1">Está livre para jogar?</b>
        <button class="rajuste" onclick="ir('dispForm')">Ajuste sua disponibilidade para os oponentes no radar</button>
      </div>
      <div class="card dcard" onclick="ir('dispEditar')" title="editar disponibilidades">
        <div class="rot" style="margin-bottom:8px">Suas disponibilidades ${minhas===null?'<span>carregando…</span>':''}</div>
        <div class="dgrade">${dias.map(colDia).join('')}</div>
      </div>
      <!-- o atalho de hoje (mig 42) continua: é o "Agora" sem agenda -->
      <button onclick="window.netLivreHoje&&netLivreHoje(${euLivre?'false':'true'})"
        style="width:100%;padding:11px;border-radius:var(--rp);cursor:pointer;font:700 13px var(--f-ui);margin-top:2px;
               border:1px solid ${euLivre?'var(--up)':'var(--linha2)'};
               background:${euLivre?'rgba(131,224,0,.14)':'var(--sup)'};color:${euLivre?'var(--up)':'var(--ink)'}">
        ${euLivre?'🎾 Você está com bola na mão hoje — tocar desliga':'🎾 Tô livre hoje (sem hora marcada)'}</button>
    </div>

    <!-- 29/08 (board): a disponibilidade deixou de ser SÓ uma tela à parte e
         ganhou este atalho no topo do radar. A tela cheia (dispForm) continua,
         com data, hora e localidade — aqui é o caminho de um toque: hoje, no
         período escolhido. O board não desenha botão de confirmar; sem ele não
         haveria como marcar, então ele existe e diz o que faz. -->
    <div class="sec">
      <div class="rot">Sua disponibilidade de jogo hoje</div>
      ${(()=>{ const d=window.__dispDraft = window.__dispDraft||{tipo:'simples', esporte:S.esporte||'tenis', quadra:'saibro', uf:'BA'};
        const pill=(k,v,n)=>`<button class="${d[k]===v?'on':''}" onclick="dispSet('${k}','${v}')">${n}</button>`;
        return `<div class="dhoje">
          <div class="dfig">${bonecoImg(S.jogadores[EU], false)}</div>
          <div class="col">
            <div class="cab"><i>◔</i><b>Horário</b></div>
            ${pill('periodo','manha','Manhã')}${pill('periodo','tarde','Tarde')}${pill('periodo','noite','Noite')}
          </div>
          <div class="col">
            <div class="cab"><i>▤</i><b>Tipo de quadra</b></div>
            ${pill('quadra','saibro','Saibro')}${pill('quadra','dura','Dura')}${pill('quadra','rapida','Rápida')}
          </div>
          <div class="col">
            <div class="cab"><i>◎</i><b>Tipo de Jogo</b></div>
            ${pill('tipo','simples','Simples')}${pill('tipo','duplas','Duplas')}
          </div>
        </div>
        <button class="btn" style="margin-top:12px" onclick="dispHoje()">Marcar disponibilidade de hoje</button>
        <p class="nota" style="margin-top:8px">Quer marcar outro dia, com horário e bairro? <a onclick="ir('dispForm')" style="color:var(--acc);cursor:pointer">Abrir o formulário completo</a></p>`; })()}
    </div>

    <div class="sec">
      <!-- node 89:179: no Figma o botão de filtros fica na MESMA LINHA do
           título, alinhado à direita da margem. No app ele estava na linha de
           baixo, ao lado das abas temporais. As abas continuam (são adição do
           app, mantida) e passam a ter a linha só pra elas. -->
      <div class="rot">Disponíveis no seu radar
        <button class="rfiltro" onclick="ir('radarFiltros')">Filtros${nFiltros?` · ${nFiltros}`:''} <i>⌄</i></button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <div class="rtabs">${abaBt('agora','Agora')}${abaBt('hoje','Hoje')}${abaBt('semana','Esta semana')}</div>
        <span style="margin-left:auto;font:400 var(--t-caption) var(--f-ui);color:var(--ink3);white-space:nowrap">classes ${permitidas.join(' · ')}</span>
      </div>
      ${lista.length ? lista.map(card).join('')
        : `<div class="card"><p class="nota">${
            S.radarSub==='agora' ? 'Ninguém livre agora na sua faixa. Olhe <b>Hoje</b> e <b>Esta semana</b> — ou marque sua disponibilidade e apareça no radar dos outros.'
          : 'Ninguém com disponibilidade marcada aqui ainda. Quem marca aparece — comece você.'}</p></div>`}
      <p class="nota" style="margin-top:10px">O radar é <b>puxado</b>: ele nunca te notifica sugerindo jogo. Você abre quando quer jogar.</p>
    </div>

    <div class="sec">
      <div class="rot">Fora do alcance</div>
      <div class="card"><p class="nota">Jogadores a mais de uma classe de distância não aparecem aqui — nem pela busca por nome. É a mesma trava que faz o quadro ser somente leitura.</p></div>
    </div>`};
},

/* ------- 25/08: editar disponibilidades marcadas ------- */
dispEditar(){
  dispCarregar();
  const minhas=(window.__dispMinhas||[]).filter(x=> new Date(x.quando) > new Date(Date.now()-3600e3));
  const porDia={};
  minhas.forEach(x=>{ const k=new Date(x.quando).getDay(); (porDia[k]=porDia[k]||[]).push(x); });
  const NOMES=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const bloco=Object.keys(porDia).sort().map(k=>`
    <div class="rot" style="margin-top:14px">${NOMES[k]}</div>

      return `<div class="card" style="padding:10px 12px">

          <div class="txt"><small style="font-size:11px"><b>Preferências</b><br>${pref}</small></div>

},

/* ------- 25/08: filtros de oponentes ------- */
radarFiltros(){
  const F=S.radarF=S.radarF||{};
  const eu=S.jogadores[EU];
  const ordemDiv=['A','B','C','D'];
  /* (66) `indexOf` devolve -1 quando a classe é desconhecida, e aí
     `ordemDiv[-1-1]` e `ordemDiv[0]` faziam a faixa virar ['A'] — o radar
     mostrava só classe A, em silêncio, sem ninguém perceber. */
  const _d = divDe(eu) || 'C';
  const i = Math.max(0, ordemDiv.indexOf(_d));
  const permitidas=[ordemDiv[i-1],_d,ordemDiv[i+1]].filter(Boolean);
  const chip=(k,v,n)=>`<button class="chip ${F[k]===v?'on':''}" onclick="radarF('${k}',${v===null?'null':`'${v}'`})">${n}</button>`;
  const chipNum=(k,v,n)=>`<button class="chip ${F[k]===v?'on':''}" onclick="radarF('${k}',${v})">${n}</button>`;
  const meu=window.__meusLocais||{};
  const tenhoLocal=!!meu.principal;
  return {titulo:'Filtros', dir:'', html:`
    <div class="pad">
      <!-- 01/09 (nodes 58:1419, 58:1436, 58:1600) — os filtros vivem DENTRO de
           um card: retângulo var(--bg) de 970x1489 com raio 30 no frame de 1080.
           O app deixava os blocos soltos na página. E o título da tela mora
           dentro do card ("Filtrar oponentes", branco, caixa normal), com o
           LIMPAR FILTROS na mesma linha, à direita — no app ele era um "limpar"
           laranja perdido no canto do topo. -->
      <div class="filtro-folha">
      <div class="rot" style="margin-bottom:16px">Filtrar oponentes
        <button class="flimpar" onclick="radarLimpar()">Limpar filtros</button>
      </div>
      <!-- 29/08 (board, node 58:1232): MODALIDADE e BUSCAR entram no filtro.
           As duas já existiam no app, mas fora daqui — o esporte era um switch
           global na home e o "jogadores ou professores" era o seletor no topo
           do radar. O board junta as duas com o resto, que é onde a pessoa
           procura por elas. Continuam sendo o mesmo estado: mexer aqui mexe lá. -->
      <div class="rot">Modalidade</div>
      <div class="grade" style="margin-bottom:16px">
        <button class="chip ${S.esporte==='tenis'?'on':''}" onclick="trocarEsporte('tenis')">Tênis</button>
        <button class="chip ${S.esporte==='beach'?'on':''}" onclick="trocarEsporte('beach')">Beach Tennis</button>
      </div>
      <div class="rot">Buscar</div>
      <div class="grade" style="margin-bottom:16px">
        <button class="chip ${S.encCat==='jogadores'?'on':''}" onclick="encCat('jogadores')">Jogadores</button>
        <button class="chip ${S.encCat==='professores'?'on':''}" onclick="encCat('professores')">Professores</button>
      </div>

      <!-- O board desenha a classe como SLIDER de faixa, de 2.0 a 4.5. Aqui
           são chips, e é de propósito: o radar já só mostra ±1 classe por
           regra de produto, então uma faixa livre prometeria alcance que não
           existe. O texto ao lado diz isso. (A escala decimal do board é NTRP;
           o Nuno decidiu em 29/08 que o sistema que manda é Classe D/C/B/A.) -->
      <div class="rot">Classe <span>o pareamento continua ±1 — aqui só afunila</span></div>
      <div class="grade" style="margin-bottom:16px">${chip('classe',null,'Todas')}${permitidas.map(c=>chip('classe',c,'Classe '+c)).join('')}</div>
      <!-- node 120:556: Horário, Tipo de quadra e Tipo de Jogo vivem num PAINEL
           ÚNICO de três colunas com divisores, nessa ordem — não em três blocos
           empilhados de largura cheia. É a mesma peça .dhoje que o radar já
           usa; reusar em vez de criar outra. (Sem crase: comentário dentro de
           template literal — o defeito de 11/08, que hoje eu repeti três vezes.) -->
      <div class="dhoje dhoje-f" style="margin-bottom:16px">
        <div class="col">
          <div class="cab"><i>◔</i><b>Horário</b></div>
          ${chip('per',null,'Todos')}${chip('per','m','Manhã')}${chip('per','t','Tarde')}${chip('per','n','Noite')}
        </div>
        <div class="col">
          <div class="cab"><i>▤</i><b>Tipo de quadra</b></div>
          ${chip('quadra',null,'Tanto faz')}${chip('quadra','saibro','Saibro')}${chip('quadra','dura','Dura')}${chip('quadra','rapida','Rápida')}
        </div>
        <div class="col">
          <div class="cab"><i>◎</i><b>Tipo de Jogo</b></div>
          ${chip('tipo',null,'Tanto faz')}${chip('tipo','simples','Simples')}${chip('tipo','duplas','Duplas')}
        </div>
      </div>
      <!-- o filtro por DIA não existe no board; fica, como adição consciente,
           abaixo do painel em vez de disputar uma quarta coluna. -->
      <div class="rot">Dia</div>
      <div class="grade" style="margin-bottom:16px">${chipNum('dia',null,'Todos')}${DIAS_PT.map((n,k)=>chipNum('dia',k,n)).join('')}</div>
      ${tenhoLocal?`<div class="rot">Localidade</div>
      <div class="grade" style="margin-bottom:16px">${chip('lugar',null,'Todas')}${chip('lugar','clube','Meu clube')}${meu.regiaoId?chip('lugar','regiao',meu.regiao||'Minha região'):''}${chip('lugar','cidade',meu.cidade?meu.cidade.split('/')[0]:'Minha cidade')}</div>`:''}
      <!-- 29/08 (board): RAIO DE BUSCA. O board desenha um slider de km, e o
           app não tem como cumprir: a localidade aqui é TEXTO (UF, cidade,
           bairro), não coordenada, e sem latitude/longitude não existe raio.
           Fica em casca — visível como o que falta, e não como um controle que
           parece funcionar e não filtra nada. -->
      ${casca(`<div class="rot" style="margin:0 0 6px">Raio de busca</div>
        <p class="nota">O desenho pede um raio em km. O app guarda cidade e bairro como texto, não como coordenada — sem isso não dá pra medir distância. Precisa de geolocalização pra existir.</p>`)}

      <div class="card clic" onclick="radarF('livresAgora',${F.livresAgora?'null':'true'})" style="margin-bottom:16px">
        <div class="linha-item"><div class="txt"><b>Mostrar apenas jogadores livres agora</b></div>
        <span class="pil ${F.livresAgora?'up':'gh'}">${F.livresAgora?'ligado':'desligado'}</span></div>
      </div>
      </div><!-- /filtro-folha -->
      <button class="btn" onclick="voltar()">Aplicar filtros</button>
    </div>`};
},

aulas(){

  const alunos = (window.__turma && window.__turma.alunos) || [];
  const nomeDe=(id)=> (S.jogadores[id]||{}).nome || 'Aluno';
  const hoje = aulasHoje(L);

  const card=(a)=>{
    const prox = aulaProximas(a, 3);
    const naAula = (a.aula_alunos||[]).map(x=>x.aluno_id);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">

          <div class="nota">${a.duracao_min||60} min${a.local_txt?' · 📍 '+a.local_txt:''} · ${a.esporte==='beach'?'Beach':'Tênis'}</div></div>
        <button class="operf" style="flex:0 0 auto;padding:7px 11px" onclick="aulaDesligar('${a.id}')">Desligar</button>
      </div>
      <div class="rot" style="margin:12px 0 6px">Quem está nesta aula <span>${naAula.length}</span></div>
      ${alunos.length ? `<div class="grade">${alunos.map(x=>{
          const dentro=naAula.includes(x.aluno_id);
          return `<button class="chip ${dentro?'on':''}" onclick="aulaPorAluno('${a.id}','${x.aluno_id}',${dentro?'false':'true'})">${nomeDe(x.aluno_id).split(' ')[0]}</button>`;
        }).join('')}</div>`
        : '<p class="nota">Você ainda não tem aluno vinculado — é ele que entra na aula.</p>'}
      <div class="rot" style="margin:14px 0 6px">Próximas</div>
      ${prox.length ? prox.map(dia=>{
          const [aa,mm,dd]=[dia.slice(0,4),dia.slice(5,7),dia.slice(8,10)];
          return `<div class="linha-item" style="padding:6px 0">
            <div class="txt"><small>${dd}/${mm}</small></div>
            <button class="operf" style="flex:0 0 auto;padding:6px 10px;font-size:11.5px" onclick="aulaCancelarDia('${a.id}','${dia}')">Cancelar só esta</button>
          </div>`;
        }).join('')
        : '<p class="nota">Nenhuma ocorrência à frente — a janela desta aula terminou.</p>'}
    </div>`;
  };

  return {titulo:'Aulas', html:`
    ${hoje.length ? `<div class="sec">
      <div class="rot">Hoje <span>${hoje.length}</span></div>
      ${hoje.map(a=>`<div class="card" style="border-color:var(--up)">
        <b style="font-size:15px">${(a.hora||'').slice(0,5)} · ${a.local_txt||'sem lugar marcado'}</b>
        <div class="nota">${(a.aula_alunos||[]).length} aluno(s) · ${a.duracao_min||60} min</div>
      </div>`).join('')}
    </div>` : ''}
    <div class="sec">
      <div class="rot">Suas aulas da semana <span>${L.length}</span></div>
      <p class="nota" style="margin-bottom:12px">Cada aula é uma <b>regra</b>: você cadastra uma vez e ela se repete toda semana. Cancelar um dia específico não desfaz a regra.</p>
      ${L.length ? L.map(card).join('') : '<div class="card"><p class="nota">Nenhuma aula cadastrada. Crie a primeira — ela passa a aparecer na sua home nos dias em que acontece.</p></div>'}
      <button class="btn" style="margin-top:12px" onclick="ir('aulaNova')">Criar aula</button>
    </div>`};

/* ---------------- MINHA TURMA (25/08, mig 62) ---------------- */
turma(){
  turmaCarregar();
  if(typeof aulasCarregar==='function') aulasCarregar();   // (70) o card do pedido lê __aulas
  const T = window.__turma;
  if(T===undefined) return {titulo:'Turma', html:'<div class="pad"><div class="card"><p class="nota">Carregando…</p></div></div>'};
  const nomeDe=(id)=> (S.jogadores[id]||{}).nome || 'Jogador';
  const ESP={tenis:'Tênis',beach:'Beach'};
  const meuUid = (window._net && _net.uid) ? _net.uid() : null;

  const pedidos = (T.pedidos||[]).filter(p=> p.quem_pediu !== meuUid);
  const secPed = pedidos.length ? `<div class="sec">
      <div class="rot">Esperando você</div>
      ${pedidos.map(p=>{
        const outro = p.treinador_id===meuUid ? p.aluno_id : p.treinador_id;
        const souTreinador = p.treinador_id===meuUid;
        /* (70) o pedido diz QUAL turma, e a posição na fila quando há disputa */
        const au = p.aula_id && (window.__aulas||[]).find(a=>a.id===p.aula_id);
        const fila = p.aula_id ? pedidos.filter(x=>x.aula_id===p.aula_id)
          .sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em)) : [];
        const pos = fila.length>1 ? ' · '+(fila.findIndex(x=>x.aluno_id===p.aluno_id)+1)+'º da fila' : '';
        /* sem o cache de aulas na mão, não afirmar nada — "desligada" só quando
           o cache EXISTE e a turma não está nele (mesma lição do rótulo do
           recorte: afirmar sem medir é mentir com cara de dado) */
        const alvo = au ? ` → ${DIAS_LONGO[au.dia_semana]} ${(au.hora||'').slice(0,5)}${pos}`
                   : (p.aula_id && window.__aulas ? ' → turma desligada' : '');
        return `<div class="card"><div class="linha-item">
          <div class="txt"><b>${nomeDe(outro)}</b><small>${souTreinador?'quer vaga':'quer ser seu professor'}${alvo} · ${ESP[p.esporte]||p.esporte}</small></div>

        </div></div>`;
      }).join('')}
    </div>` : '';

  const avs = (T.avulsas||[]);
  const secAvulsas = avs.length ? `<div class="sec">
      <div class="rot">Aulas avulsas pedidas <span>${avs.length}</span></div>
      ${avs.map(x=>`<div class="card">
        <b>${nomeDe(x.aluno_id)}</b>
        <small style="display:block;color:var(--ink3)">${new Date(x.quando).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})} · ${new Date(x.quando).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}${x.msg?` · "${x.msg}"`:''}</small>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="operf" style="flex:1" onclick="_net.avulsaResponder('${x.id}','recusada','Pedido recusado.')">Recusar</button>
          <button class="oconv" style="flex:1" onclick="_net.avulsaResponder('${x.id}','aceita','Aula confirmada — combine os detalhes no chat.')">Aceitar</button>
        </div></div>`).join('')}
    </div>` : '';
  const secAlunos = `<div class="sec">
      <div class="rot">Meus alunos <span>${(T.alunos||[]).length}</span></div>
      ${(T.alunos||[]).length
        ? T.alunos.map(a=>`<div class="card"><div class="linha-item">
            <div class="txt" onclick="_net.verJogador&&_net.verJogador('${a.aluno_id}')" style="cursor:pointer"><b>${nomeDe(a.aluno_id)}</b><small>${ESP[a.esporte]||a.esporte} · desde ${new Date(a.desde).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}</small></div>
            <button class="operf" style="flex:0 0 auto;padding:8px 12px" onclick="turmaEncerrar('${a.aluno_id}','${a.esporte}')">Encerrar</button>
          </div></div>`).join('')
        : `<div class="card"><p class="nota">Nenhum aluno vinculado ainda. O vínculo nasce quando <b>o aluno</b> confirma — nunca por você sozinho, e é isso que faz a contagem valer alguma coisa.</p></div>`}
    </div>`;

  const secProf = (T.professores||[]).length ? `<div class="sec">
      <div class="rot">Meu professor</div>
      ${T.professores.map(a=>`<div class="card"><div class="linha-item">
        <div class="txt" onclick="_net.verProfessor&&_net.verProfessor('${a.treinador_id}')" style="cursor:pointer"><b>${nomeDe(a.treinador_id)}</b><small>${ESP[a.esporte]||a.esporte}</small></div>
        <button class="operf" style="flex:0 0 auto;padding:8px 12px" onclick="turmaEncerrar('${a.treinador_id}','${a.esporte}')">Encerrar</button>
      </div></div>`).join('')}
    </div>` : '';

  const temGrupo = !!(window.__profDados && window.__profDados.turma_grupo_id);
  const secGrupo = ehProfessor() ? `<div class="sec">
      <div class="rot">A turma como comunidade</div>
      ${temGrupo
        ? `<div class="card clic" onclick="trocarAba('comunidade')"><div class="linha-item">
             <div class="av">▤</div>
             <div class="txt"><b>Quadro da turma</b><small>ranking interno, cinturão e a conversa do grupo</small></div>
             <div class="seta">›</div></div></div>`
        : `<div class="card"><p class="nota">Criar a turma como comunidade dá aos seus alunos um <b>quadro próprio</b>, cinturão e conversa em grupo — e é onde o racha da turma acontece.</p>
           <button class="btn" style="margin-top:11px" onclick="turmaCriarGrupo()">Criar a turma</button></div>`}
    </div>` : '';

  return {titulo:'Turma', html: secPed + secAvulsas + secAlunos + secProf + secGrupo + `
    <div class="sec"><div class="card"><p class="nota">Um aluno tem um professor por esporte. É a trava mais barata contra inflar turma: pra ter 200 alunos seriam 200 pessoas abrindo mão do próprio professor.</p></div></div>`};
},

/* ---------------- CHAT (25/08 — aba própria, telas novas) ----------------
   A aba não cria sala: enumera as portas que já existem — conversa da
   comunidade (mig 37), conversa da partida (mig 40) e a caixa de recados.
   Carrega lazy via _net.chatHub e re-renderiza quando chega. */
chat(){
  const hub = window.__chatHub;
  if(hub===undefined && window._net && _net.chatHub){
    window.__chatHub = null;
    _net.chatHub().then(h=>{ window.__chatHub=h||{grupos:[],partidas:[]}; if(aba==='chat') render(); })
                  .catch(()=>{ window.__chatHub={grupos:[],partidas:[]}; if(aba==='chat') render(); });
  }
  const h = hub || {grupos:[],partidas:[]};
  const rec = (t,id)=> (window.netRecadosDe ? netRecadosDe(t,id) : 0);
  /* 02/09 (node 64:569) — os FILTROS do topo. Dois dos três do arquivo saem do
     dado que já existe: "Não lidas" pelo contador de recados, "Grupos" pela
     origem da conversa.
     ⚠️ O terceiro — "Favoritas" — NÃO entra: favoritar conversa não existe no
     banco (nem coluna nem tabela), e um filtro que não filtra nada é pior que
     um filtro ausente. Fica registrado como o que falta, não como botão morto. */
  const filtro = (S.chatFiltro = S.chatFiltro || 'todas');
  const naoLidas = (t,id)=> rec(t,id) > 0;
  const grupos   = h.grupos.filter(g=> filtro==='grupos' ? true : (filtro==='naolidas' ? naoLidas('grupo',g.id) : true));
  const partidas = h.partidas.filter(pt=> filtro==='grupos' ? false : (filtro==='naolidas' ? naoLidas('partida',pt.id) : true));

  /* a linha: avatar, nome com a hora do lado, subtítulo e o disco do não-lido.
     ⚠️ SEM a hora e SEM a última mensagem, que o arquivo mostra e o app não
     tem: o `netChatHub` devolve só `{id, nome}` por conversa. Trazer a última
     mensagem exige uma view ou RPC sobre `grupo_mensagens`/`partida_mensagens`
     (uma consulta por conversa numa lista seria N consultas), e isso é
     migração. Deixar o slot vazio faria a linha parecer quebrada; o subtítulo
     que já existe ocupa o lugar dele com informação verdadeira. */
  const linha = (nome, sub, n, acao, ico)=>`
    <button class="convl" onclick="${acao}">
      <div class="av">${ico}</div>
      <div class="txt"><b>${nome}</b><small>${sub}</small></div>
      <div class="dir">${n?`<span class="naolido">${n>99?'99+':n}</span>`:''}</div>
    </button>`;
  const cardG = grupos.map(g=> linha(g.nome, 'Conversa da comunidade', rec('grupo',g.id),
                                     `_net.abrirChat('${g.id}')`, '💬')).join('');
  const cardP = partidas.map(pt=> linha(pt.nome, 'Conversa da partida', rec('partida',pt.id),
                                        `_net.abrirChatPartida('${pt.id}')`, '🎾')).join('');
  const vazioFiltrado = filtro!=='todas' && !(cardG+cardP);
  return {titulo:'Chat', html:`
    <div class="sec">
      <div class="convf">
        <button class="${filtro==='todas'?'on':''}" onclick="chatFiltro('todas')">Todas</button>
        <button class="${filtro==='naolidas'?'on':''}" onclick="chatFiltro('naolidas')">Não lidas</button>
        <button class="${filtro==='grupos'?'on':''}" onclick="chatFiltro('grupos')">Grupos</button>
      </div>
      ${hub===null ? '<div class="card"><p class="nota">Carregando…</p></div>'
        : vazioFiltrado ? `<div class="card"><p class="nota">Nenhuma conversa ${filtro==='naolidas'?'não lida':'de comunidade'} agora.</p></div>`
        : ((cardG+cardP) || `<div class="card"><p class="nota">Sem conversas ainda. A conversa nasce junto com a comunidade e com a partida marcada — marque um jogo pelo Radar.</p></div>`)}
    </div>
    <div class="sec">
      <div class="card clic" onclick="netAbrirInbox()">
        <div class="linha-item"><div class="av">✉</div>
          <div class="txt"><b>Recados e convites</b><small>Desafios, confirmações e pedidos de amizade</small></div>
          ${S.novidades?`<span class="pil up">${S.novidades}</span>`:''}
          <div class="seta">›</div></div></div>
    </div>`};
},

          <p class="nota" style="margin-top:11px">${nome(a.adv).split(' ')[0]} confirma no app dele. Ele tem 24h a partir de quando abrir o app, e no máximo 3 dias — passou disso, o placar vale metade. Se ele contestar, resolve por concessão: quem concede encerra.</p>
        </div>
        <p class="nota" style="text-align:center">Nada mexeu ainda. O ciclo só fecha quando o placar é confirmado.</p>
      </div>`};
  }
  const _esp=pendEsperando(), _prop=pendPropostas();
  if(!S.pendentes.length){
    return {titulo:'Registrar', html:`
      <div class="vazio"><span class="ic">✚</span>
        Nenhuma partida esperando placar.<br>Marque um jogo pelo Radar — quando ele nascer no app, o placar já vem pré-preenchido.
      </div>`};
  }
  // proposta é jogo pedido, não jogo marcado — lista própria, sem caminho pro placar
  const propostasH = _prop.length ? `<div class="sec">
      <div class="rot">Propostas enviadas</div>
      <p class="nota" style="margin-bottom:12px">Você propôs o horário. Enquanto não aceitarem, não há placar pra lançar.</p>
      ${_prop.map(p=>`
        <div class="card">
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
            <span class="pil gh">Aguardando resposta</span>
            <span class="pil gh">${p.quando}</span>
          </div>
          <div class="linha-item">
            ${avatar(p.adv)}
            <div class="txt"><b>${nome(p.adv)}</b><small>${p.local}</small></div>
          </div>
          <button class="btn sec" style="margin-top:10px" onclick="cancelarProposta('${p.id}')">Retirar proposta</button>
        </div>`).join('')}
    </div>` : '';
  if(!_esp.length){
    return {titulo:'Registrar', dir:`${_prop.length} proposta${_prop.length>1?'s':''}`, html:`${propostasH}
      <div class="vazio"><span class="ic">✚</span>
        Nenhuma partida esperando placar ainda.<br>Assim que aceitarem seu horário, ela nasce aqui.
      </div>
      <div class="sec">
        <button class="btn gh" onclick="netAbrirMao()">Jogou fora do app? Lançar na mão</button>
        <p class="nota" style="margin-top:9px">Partida lançada na mão não conta em circuito aberto — só nas fechadas. O adversário confirma, com o mesmo prazo: 24h depois de ele abrir o app, no máximo 3 dias.</p>
      </div>`};
  }
  return {titulo:'Registrar', dir:`${_esp.length} pendente${_esp.length>1?'s':''}`, html:`${propostasH}
    <div class="sec">
      <div class="rot">Esperando placar</div>
      <p class="nota" style="margin-bottom:12px">Elas nasceram no app, então já sabemos quem, quando, onde, o formato e o contexto — <b>falta só o placar</b>.</p>
      ${_esp.map(p=>`
        <div class="card clic" onclick="ir('placar',{id:'${p.id}'})">
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
            <span class="pil up">Nasceu no app</span>
            <span class="pil gh">${p.dupla?'Duplas':'Simples'}</span>
            <span class="pil gh">${p.formato==='set'?'Set único':'Melhor de 3'}</span>
          </div>
          <div class="linha-item">
            ${avatar(p.adv)}
            <div class="txt"><b>${nome(p.adv)}</b><small>${p.local} · ${p.quando}</small></div>
            <div class="seta">›</div>
          </div>
          <p class="nota" style="margin-top:9px">${CTX_NOME[p.contexto]}</p>
        </div>`).join('')}
      <!-- 11/08 (noite): o formulário chegou (migração 24). Adversário, formato,
           placar, quando, onde — e a coluna de origem que a regra do circuito
           aberto vai ler. O adversário confirma, com o prazo de 72h. -->
      <button class="btn gh" onclick="netAbrirMao()">Jogou fora do app? Lançar na mão</button>
      <p class="nota" style="margin-top:9px">Partida lançada na mão não conta em circuito aberto — só nas fechadas. O adversário confirma, com o mesmo prazo: 24h depois de ele abrir o app, no máximo 3 dias.</p>
    </div>`};
},

/* ---------------- PLACAR ---------------- */
placar(p){
  const par=S.pendentes.find(x=>x.id===p.id);
  const nSets = par.formato==='set'?1:3;
  if(!par.sets) par.sets = Array.from({length:nSets},()=>[null,null]);
  const j=S.jogadores[par.adv];

  const col=(i,lado)=>{
    const v=par.sets[i][lado];
    const outro=par.sets[i][1-lado];
    const ganhou = v!=null && outro!=null && v>outro;
    return `<b class="${ganhou?'g':''} ${v==null?'vazio':''}" onclick="mexerSet('${par.id}',${i},${lado})">${v==null?'–':v}</b>`;
  };

  return {titulo:'Placar', dir:par.formato==='set'?'Set único':'Melhor de 3', html:`
    <div class="pad">
      <p class="nota" style="margin-bottom:12px">Toque nos números pra montar o placar. ${par.formato==='set'?'Set único vale metade no Nível — por tempo de quadra, não por ruído.':'Melhor de 3 sets.'}</p>
      <div class="placar">
        <div class="pl-lado">
          <div class="q">${avatar(EU)}<span>Você</span></div>
          <div class="sets">${par.sets.map((_,i)=>col(i,0)).join('')}</div>
        </div>
        <div class="pl-lado">
          <div class="q">${avatar(par.adv)}<span>${j.nome}</span></div>
          <div class="sets">${par.sets.map((_,i)=>col(i,1)).join('')}</div>
        </div>
      </div>
      ${previa(par)}
      <button class="btn" id="btnEnviar" onclick="enviarPlacar('${par.id}')" ${resultado(par)===null?'disabled':''}>Enviar pra confirmação</button>
      <button class="btn sec" onclick="voltar()">Voltar</button>
      <p class="nota" style="text-align:center">${j.nome.split(' ')[0]} confirma no app dele. Placar divergente resolve por concessão.</p>
    </div>`};
},

/* ---------------- O QUE MEXEU ---------------- */
mexeu(){
  const u=S.ultimo, eu=S.jogadores[EU];
  /* 12/08: os containers em que a partida REALMENTE caiu, lidos de volta do
     livro-caixa (`pontos_lancamentos`) depois do crédito. Ler em vez de
     recalcular é o que impede a tela de divergir do banco: quem decide os
     escopos é o `pontos_creditar`, e a regra dele ("só em grupo onde os dois
     são membros") sai de graça aqui. `geral` fica de fora da lista porque já
     é a linha do quadro da comunidade logo acima. Se a leitura falhou, a lista
     vem vazia e a tela mostra só o que tem certeza — nunca completa com
     container inventado, que era o defeito do circuito antigo. */
  const quadros = (u.quadros||[]).filter(q=> q.escopo !== 'geral');
  const qN = quadros.length + 1;
  const linhaPos=(rot,antes,depois,extra)=>{
    const d=antes-depois;
    return `<div class="l">
      <div class="i"><div class="t">${rot}</div><div class="d">${antes}º → ${depois}º${extra?' · '+extra:''}</div></div>
      <div class="v" style="color:${d>0?'var(--up)':d<0?'var(--dn)':'var(--ink3)'}">${d>0?'▲'+d:d<0?'▼'+(-d):'—'}</div>
    </div>`;
  };
  return {titulo:'O que mexeu', html:`
    <div class="celebra">
      <img class="reacao bcv" data-k="${chaveReacao(S.jogadores[EU], u.venceu)}" alt="">
      <h2>${u.venceu?'Você venceu':'Você perdeu'}</h2>
      <p>${nome(u.adv)} · ${u.placar}${u.zebra?' · <b style="color:var(--up)">zebra</b>':''}</p>
      <div class="big" style="color:${u.dNivel>=0?'var(--up)':'var(--dn)'}">${u.dNivel>0?'+':''}${u.dNivel}</div>
      <p style="margin-top:4px">Nível ${u.nivel} · Classe ${u.div}</p>
    </div>
    <div class="sec">
      <div class="rot">${qN===1?'Um placar, um quadro':`Um placar, ${qN} quadros`}</div>
      <div class="mexeu">
        <div class="l">
          <div class="i"><div class="t">Pontos de temporada</div><div class="d">${CTX_NOME[u.contexto]}${u.zebra?' · multiplicador de zebra':''}</div></div>
          <div class="v" style="color:${corPts(u.dPts)}">${sinalPts(u.dPts)}</div>
        </div>
        ${linhaPos('Quadro da comunidade', u.posAntes.comunidade, u.posDepois.comunidade)}
        ${quadros.map(q=>`<div class="l">
          <div class="i"><div class="t">${q.nome}</div><div class="d">a partida contou aqui</div></div>
          <div class="v" style="color:${corPts(q.pontos)}">${sinalPts(q.pontos)}</div>
        </div>`).join('')}
      </div>
      ${u.subiuDiv?`<div class="card" style="border-color:var(--up)"><div class="linha-item">
        <div class="av" style="background:var(--up-bg);color:var(--up)">▲</div>
        <div class="txt"><b>Você subiu pra Classe ${u.div}</b><small>Novo pool de adversários no radar</small></div></div></div>`:''}
      ${u.caiuDiv?`<div class="card" style="border-color:var(--dn)"><div class="linha-item">
        <div class="av" style="background:var(--dn-bg);color:var(--dn)">▼</div>
        <div class="txt"><b>Você caiu pra Classe ${u.div}</b><small>O radar muda junto</small></div></div></div>`:''}
      <p class="nota" style="margin-top:10px">${quadros.length
        ? 'É isso que um registro faz: um placar move o quadro e todas as comunidades onde vocês dois estão, de uma vez. Foi por isso que valeu a pena digitar.'
        : 'Esse placar contou no quadro da comunidade. Entrando numa comunidade com quem você joga, a mesma partida passa a mover o ranking de lá também.'}</p>
      <button class="btn" style="margin-top:14px" onclick="verQuadro()">Ver o quadro</button>
    </div>`};
},

/* ---------------- PANELA ---------------- */
/* ---------------- COMUNIDADE — as três abas do board ----------------
   Feed · Ranking · Grupos, numa rota só. As cargas assíncronas e os três
   renderizadores vivem juntos lá em cima, no bloco "COMUNIDADE — TELAS 12 a
   17 DO BOARD" — aqui fica só o roteador, que é o que esta função é.

   O cinturão, os patches e a copa saíram daqui e foram pro QUADRO, junto com
   a tabela da comunidade: é lá que a pergunta "como vai a minha comunidade"
   se responde inteira, e ter metade dela em cada aba era o que fazia ninguém
   achar o cinturão. A lista "Os N da comunidade" não foi junto porque o
   Quadro já a desenha — eram duas telas do mesmo dado. */
comunidade(){
  const aba = abaDe('comu','feed');
  const corpo = aba==='ranking' ? comuRanking()
              : aba==='grupos'  ? comuGrupos()
              : comuFeed();
  return {titulo:'Comunidade', dir:'', html:
    abasHtml('comu',[['feed','Feed'],['ranking','Ranking'],['grupos','Grupos']],'linha',null,'esp') + corpo};
},

/* ---------------- RANKING DE UMA CLASSE (board 176:1884) ----------------
   O que "Ver ranking" abre no cartão da classe. Mesma lista do pódio, cortada
   pela faixa de Nível — não é outra consulta nem outra ordem. */
rankingClasse(p){
  const cl = (p && p.cl) || divDe(S.jogadores[EU]);
  /* a aba gravada passa a ser RANKING. Não é enfeite: as abas pintadas aqui
     leem `S.abas.comu`, e quem chega por um estado antigo (ou por link) via
     `ir()` direto veria "Feed" sublinhado numa tela de ranking — a barra
     dizendo uma coisa e a tela outra. E persiste de propósito: voltar daqui
     deve cair na aba de onde esta tela sai. */
  S.abas = S.abas || {};
  if(S.abas.comu !== 'ranking'){ S.abas.comu = 'ranking'; salvar(); }
  rankGeralCarregar();
  if(window.__rankGeral === null)
    return {titulo:'Classe '+cl, dir:'', html:`<div class="card"><p class="nota">Carregando o ranking…</p></div>`};
  const [n1,n2] = CLASSE_FAIXA[cl] || CLASSE_FAIXA.C;
  const lista = rankLista().filter(r=>r.cl===cl);
  const linhas = lista.length
    ? lista.map(rankLinha).join('')
    : `<div class="card"><div class="vazio"><i class="ic">◈</i>Ninguém na Classe ${cl} ainda. Ela enche quando as partidas começarem a entrar.</div></div>`;
  /* as ABAS ficam. No board esta não é uma tela solta: é a aba Ranking
     mostrando uma classe, com Feed/Ranking/Grupos ainda no topo. Ela continua
     sendo rota empilhada aqui — o ‹ de voltar é bom e o board não o tem —, mas
     sem a barra ela parecia ter saído da Comunidade. */
  return {titulo:'Classe '+cl, dir:`${lista.length} ${lista.length===1?'jogador':'jogadores'}`, html:
    abasHtml('comu',[['feed','Feed'],['ranking','Ranking'],['grupos','Grupos']],'linha','comuVoltarAba','esp') + `
    <div class="sec">
      <div class="cls-cab">
        <div class="cbadge">${cl}</div>
        <div class="risco"></div>
        <div class="faixa">Nível ${n1}–${n2}</div>
      </div>
      ${linhas}
      <p class="nota" style="margin-top:13px">A ordem é por Pontos da temporada, com o Nível de desempate — a mesma do quadro de comunidade. Classe é a faixa em que você joga; Pontos é como você vai nesta temporada.</p>
    </div>`};
},

/* ---------------- FEED DO GRUPO (board 177:2956) ----------------
   O cartão da aba Grupos abre AQUI, e não mais na folha de gestão. A folha
   continua sendo a porta de gerir — pedidos, papéis e link de convite —, e o
   botão no fim da segunda aba é quem a abre. */
grupo(p){
  const id = p && p.id;
  if(!id) return {titulo:'Grupo', dir:'', html:`<div class="card"><p class="nota">Grupo não informado.</p></div>`};
  grupoCarregar(id);
  const d = (window.__grupoCache||{})[id];
  if(d === null || d === undefined)
    return {titulo:'Grupo', dir:'', html:`<div class="card"><p class="nota">Carregando o grupo…</p></div>`};
  /* `g` nulo é o grupo que sumiu OU o fechado que a policy não deixa ler —
     as duas coisas se parecem daqui de fora, de propósito: dizer "existe mas
     você não pode ver" já entrega que ele existe. */
  if(!d.g) return {titulo:'Grupo', dir:'', html:
    `<div class="card"><div class="vazio"><i class="ic">▣</i>Essa comunidade não existe mais, ou não está aberta pra você.</div></div>`};

  const g = d.g, n = d.membros.length;
  const aba = abaDe('grupoAba','feed');
  /* quem sou eu dentro de `S.jogadores`: o elenco guarda todo mundo pelo uuid,
     menos eu, que sou a chave EU. Sem esta tradução o meu nome sai como
     "Outro jogador" na minha própria comunidade. */
  const chave = (uid)=> (typeof MEU_UID!=='undefined' && uid===MEU_UID) ? EU : uid;

  /* 01/09 (migs 92 e 93) — a capa. Balde público próprio: ela aparece no
     cartão da lista pra quem NÃO é membro, então guardá-la no `feed-grupo`,
     que é privado, a esconderia de quem o cartão existe pra convencer.
     Como no cartão, capa e inicial não convivem: as duas são `inset:0`. */
  const capaUrl = (window._net && _net.grupoCapaUrl) ? _net.grupoCapaUrl(g.capa) : null;
  const hero = `<div class="ghero">
      ${capaUrl
        ? `<img class="capa" src="${_attr(capaUrl)}" alt="" loading="lazy">`
        : `<div class="ini" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 62px var(--f-ui);color:var(--linha2)">${(g.nome||'?').trim().charAt(0).toUpperCase()}</div>`}
      ${d.souGestor ? `<label class="capa-bt">
          <input type="file" accept="image/jpeg,image/png,image/webp" hidden
                 onchange="grupoCapaEnviar('${id}', this)">
          <span>${capaUrl?'Trocar capa':'Pôr capa'}</span>
        </label>` : ''}
      <div class="dentro">
        <div class="l1"><h3>${g.nome}</h3><div class="mem">${n} ${n===1?'membro':'membros'}</div></div>
        ${g.regras ? `<p>${g.regras.replace(/</g,'&lt;')}</p>`
                   : `<p>${g.esporte==='beach'?'Beach tennis':'Tênis'} · ${g.aberto?'aberto — qualquer um pode pedir pra entrar':'privado — só entra por convite'}</p>`}
      </div>
    </div>`;

  let corpo;
  if(aba==='partidas'){
    /* A segunda aba do board. O que o app tem de "partidas do grupo" é o
       RANKING dele — a soma do livro-caixa no escopo `grupo:<id>`, que só
       recebe partida entre membros. Ordem igual à da folha: Pontos, Nível de
       desempate. */
    const linhas = d.membros.map(m=>({ m, k:chave(m.player_id), pts:d.pts[m.player_id]||0 }))
      .map(x=> Object.assign(x, {j:S.jogadores[x.k]}))
      .sort((a,b)=> b.pts-a.pts || ((a.j&&b.j)? nivelDe(b.j)-nivelDe(a.j) : 0))
      .map((x,i)=>{
        const conhecido = !!x.j;
        const ehDono = x.m.player_id===g.dono_id;
        return `<div class="rk-ln ${i<3?'p'+(i+1):''} ${x.k===EU?'eu':''}" ${conhecido?`onclick="verJogador('${x.k}')"`:''}>
            <div class="pos">${i+1}</div>
            ${conhecido ? avatar(x.k) : '<div class="av">◈</div>'}
            <div class="nm">
              <div class="l1"><b>${x.k===EU?'Você':conhecido?nome(x.k):'Outro jogador'}</b><div class="nv">${conhecido?nivelDe(x.j):'—'}</div></div>
              <small>${x.pts} pts${ehDono?' · dono':x.m.papel==='admin'?' · admin':''}</small></div>
          </div>`;
      }).join('');
    corpo = `<div class="sec">
        <div class="rot tit">Ranking do grupo <span>só partida entre membros</span></div>
        ${linhas || `<div class="card"><div class="vazio"><i class="ic">◈</i>Sem membros ainda.</div></div>`}
        <p class="nota" style="margin-top:12px">Torneio do grupo ainda não existe como objeto próprio — o que conta aqui é a partida entre membros. Os torneios abertos ficam em Comunidade › Grupos › Meus torneios.</p>
        <button class="btn gh" style="margin-top:12px" onclick="_net.verGrupo('${id}')">Gerir a comunidade — membros, pedidos e link</button>
      </div>`;
  } else {
    const posts = d.posts||[];
    // sem `.sec` própria: já vem dentro de uma. Ver a nota no `comuFeed`.
    const escrever = d.souMembro ? `<textarea id="gpost-txt" class="onb-area" maxlength="1000" placeholder="Escreve pro grupo."></textarea>
        <div class="postbar">
          <label class="foto-bt">
            <input type="file" id="gpost-foto" accept="image/jpeg,image/png,image/webp"
                   onchange="fotoEscolhida(this,'gpost-foto-nome')" hidden>
            <span>🖼 Foto</span>
          </label>
          <small id="gpost-foto-nome" class="foto-nome"></small>
        </div>
        <button class="btn" style="margin-top:8px" onclick="grupoPostar('${id}')">Publicar no grupo</button>`
      : `<p class="nota" style="margin-top:12px">Só quem é do grupo publica aqui — a policy da mig 79 cobra isso no banco, não só na tela.</p>`;
    const lista = posts.length ? posts.map(postHtml).join('')
      : `<div class="card"><div class="vazio"><i class="ic">✎</i>Ninguém publicou nada neste grupo ainda.</div></div>`;
    corpo = `<div class="sec">${escrever}${lista}</div>`;
  }

  /* `dir` vazio de propósito: a contagem de membros já está no hero, logo
     abaixo. O board a mostra UMA vez — repetida no topo ela vira ruído que o
     olho tem de descartar duas vezes, e ainda por cima com o nome do grupo
     truncado ao lado dela. */
  return {titulo:g.nome, dir:'', html:
    `<div class="sec">${hero}</div>`
    + abasHtml('grupoAba',[['feed','Feed'],['partidas','Partidas e Torneios']],'linha',null,'esp')
    + corpo};
},

/* ---------------- FICHA ---------------- */
ficha(){

  const jogadas = S.historico.filter(h=>!h.tipo);

               cosmético do vestiário. É a porta das contas que nasceram antes
               do passo existir no cadastro. -->
          <div class="sub" style="cursor:pointer" onclick="window.netAbrirMeusLocais&&netAbrirMeusLocais()">📍 ${(window.__meusLocais&&window.__meusLocais.principalNome)||'<u>Diga onde você joga</u>'}</div>

      </div>

/* 12/08: a tela CIRCUITO saiu. Ela renderizava um ranking que era cópia exata

/* ---------------- JOGADOR ---------------- */
/* 29/08 (board, node 58:1619) — o PERFIL DO OPONENTE.
   Esta rota absorveu a folha `netVerJogador` do net.js, que era a segunda
   ficha de jogador do app e agora delega pra cá. Era o único caso da leva em
   que migrar REMOVE código em vez de mover: as duas desenhavam a mesma coisa,
   e a folha nem consulta rede — lê `S.jogadores`, que o boot já hidratou. */
/* 29/08 (board) — HISTÓRICO COMPLETO, duas abas numa rota.
   A fonte é `window.__minhasPartidas` (o select('*') que o inbox já faz), e
   NÃO o `S.historico`. A razão está escrita na casa desde 26/08: o histórico
   local é do APARELHO — em celular novo nasce vazio e diria que quem tem 40
   jogos nunca registrou nenhum — e o `quando` dele é a string 'agora', que não
   dá pra agrupar por mês. `confirmed_at` e os deltas só existem na linha do
   banco.
   ⚠️ Não há EMPATE aqui, e o board mostra um (5-5, +15pts). O app não tem:
   `venceu_criador` é booleano. Entrar com empate é mexer no motor de
   pontuação, não numa tela — ficou pendente com o Nuno. */
historico(){
  const uid = (window._net && _net.uid && _net.uid()) || null;
  const todas = ((window.__minhasPartidas)||[]).filter(m=>m.status==='confirmada' && m.confirmed_at);
  const ladoCri  = (m)=> m.criador_id===uid || m.parceiro_criador_id===uid;
  const meuDelta = (m)=> m.criador_id===uid             ? m.delta_criador
                       : m.adversario_id===uid          ? m.delta_adversario
                       : m.parceiro_criador_id===uid    ? m.delta_parceiro_criador
                       : m.parceiro_adversario_id===uid ? m.delta_parceiro_adversario
                       : null;
  const venci = (m)=> ladoCri(m) ? !!m.venceu_criador : !m.venceu_criador;
  const pts   = (m)=> { const d=meuDelta(m); return d ? (+(d.dPts||0)) : 0 };
  const advId = (m)=> ladoCri(m) ? m.adversario_id : m.criador_id;

  const aba = abaDe('historico','mes');
  const agora = new Date();
  const ano = (S.histAno = S.histAno || agora.getFullYear());
  const mesSel = (S.histMes === undefined ? agora.getMonth() : S.histMes);

  /* 29/08 — GUARDA DE IDENTIDADE, achada testando.
     Todo o cálculo desta tela depende de saber QUAL LADO da partida sou eu:
     `ladoCri`, `venci` e `meuDelta` comparam contra o uid. Com uid nulo (boot
     ainda correndo, ou sessão caída) nada disso lança erro — `ladoCri` devolve
     false pra tudo, `venci` inverte, `meuDelta` cai em null e o delta vira 0.
     O resultado é uma tela cheia, plausível e ERRADA: toda partida como
     derrota, todo placar valendo 0 pts. É o pior modo de falha que existe, e
     custava esta linha. */
  if(!uid) return {titulo:'Histórico', html:`<div class="pad">
    ${abasHtml('historico',[['mes','Partidas do mês'],['ano','Análise anual']],'linha')}
    <div class="card" style="margin-top:14px"><div class="vazio"><i class="ic">◔</i>
    Ainda conectando à sua conta. O histórico precisa saber qual lado da partida é você
    pra dizer quem venceu — sem isso ele mostraria o contrário.</div></div></div>`};

  if(!todas.length) return {titulo:'Histórico', html:`<div class="pad">
    ${abasHtml('historico',[['mes','Partidas do mês'],['ano','Análise anual']],'linha')}
    <div class="card" style="margin-top:14px"><div class="vazio"><i class="ic">◔</i>
    Nenhuma partida confirmada ainda. O histórico enche sozinho conforme você joga e lança placar.</div></div></div>`};

  const doMes = todas.filter(m=>{ const d=new Date(m.confirmed_at);
    return d.getFullYear()===ano && d.getMonth()===mesSel; });

  const corpo = aba==='ano' ? (()=>{
    const porMes = Array.from({length:12},()=>({v:0,d:0,pts:0}));
    todas.forEach(m=>{ const d=new Date(m.confirmed_at); if(d.getFullYear()!==ano) return;
      const b=porMes[d.getMonth()]; venci(m) ? b.v++ : b.d++; b.pts += pts(m); });
    const teto = Math.max(1, ...porMes.map(b=>b.v+b.d));
    const MES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
    const b = porMes[mesSel];
    /* 02/09 — os ANOS que existem de verdade, tirados das partidas. O seletor do
       board (node 169:1098) sugere troca de ano, e `S.histAno` sempre existiu
       sem nenhuma tela que o mudasse. A lista sai do dado: ano sem partida
       nenhuma não entra, e o atual entra sempre pra que a tela abra no lugar
       certo mesmo antes da primeira partida do ano. */
    const anos = [...new Set(todas.map(m=>new Date(m.confirmed_at).getFullYear())
                             .concat([agora.getFullYear()]))].sort((x,y)=>y-x);
    const aprov = b.v+b.d ? Math.round(b.v/(b.v+b.d)*100) : 0;
    return `<div class="hano">
      <div class="hano-top">${anos.length>1
        ? `<button class="hano-ano" onclick="histAnoTrocar()">${ano} ⌄</button>`
        /* um seletor de uma opção só é um controle que mente: parece que dá pra
           trocar e não dá. Com um ano só, o ano é rótulo. */
        : `<button class="hano-ano" disabled>${ano}</button>`}</div>
      <div class="hbarras">${porMes.map((x,k)=>`
        <div class="m ${k===mesSel?'on':''}" onclick="histMes(${k})"
             role="button" tabindex="0" aria-label="${MES[k]}: ${x.v} ${x.v===1?'vitória':'vitórias'}, ${x.d} ${x.d===1?'derrota':'derrotas'}">
          <div class="bs">
            <i class="d" style="height:${Math.round(x.d/teto*100)}%"></i>
            <i class="v" style="height:${Math.round(x.v/teto*100)}%"></i>
          </div>
          <u class="trilho"></u>
          <div class="rot">${MES[k]}</div>
        </div>`).join('')}</div>
      <div class="hleg"><span><i class="v"></i>Vitórias</span><span><i class="d"></i>Derrotas</span></div>
      <div class="rot tit">Dados de ${MES[mesSel].toLowerCase()}</div>
      <div class="hmes">
        <div class="hpainel contas">
          <div class="cx"><b>${b.v}</b><small>Vitórias</small></div>
          <div class="cx"><b>${b.d}</b><small>Derrotas</small></div>
          <div class="cx"><b>${b.v+b.d}</b><small>Partidas</small></div>
        </div>
        <div class="hlado">
          <div class="hpainel"><span class="seta">↗</span><div class="cx"><b>${aprov}%</b><small>Aproveitamento</small></div></div>
          <div class="hpainel"><div class="cx"><b style="color:${b.pts>=0?'var(--up)':'var(--dn)'}">${b.pts>0?'+':''}${b.pts} pts</b><small>Ganhos no mês</small></div></div>
        </div>
      </div>
    </div>`;
  })() : (doMes.length ? doMes.map(m=>{
      const ok = venci(m), dp = pts(m), a = advId(m);
      const jj = S.jogadores[a];
      const cat = jj ? categoriaDe(nivelDe(jj), divDe(jj)) : null;
      const d = new Date(m.confirmed_at);
      return `<div class="hpart ${ok?'v':'d'}" onclick="${a?`ir('jogador',{id:'${a}'})`:''}">
        <div class="pl">${m.placar||'—'}</div>
        <div class="meio">
          <div><i>◎</i>${m.esporte==='beach'?'Beach Tennis':'Tênis'}</div>
          <div><i>◈</i>${jj?jj.nome:'Jogador'}</div>
          ${jj?`<div><i>▦</i>Classe ${divDe(jj)}${CAT_SUFIXO[cat]||''}</div>`:''}
        </div>
        <div class="dir">
          <div class="dt">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</div>
          <div class="pts">${dp>0?'+':''}${dp}pts</div>
        </div>
      </div>`; }).join('')
    : `<div class="card"><div class="vazio"><i class="ic">◔</i>Nenhuma partida confirmada neste mês.</div></div>`);

  return {titulo:'Histórico', html:`
    ${abasHtml('historico',[['mes','Partidas do mês'],['ano','Análise anual']],'linha')}
    <div class="pad">${corpo}</div>`};
},

jogador(p){

  const advN=(S.esporte==='beach') ? (j.nivelB ?? 1200) : (j.nivel ?? 1200);
  /* o que está em jogo — é o que a folha do net.js mostrava, e some se ela
     sumir sem trazer isto junto */
  const gV=calcular(nivelDe(eu), advN, true,  'amistoso','md3',false, eu.calibrando, eu.cal);
  const gD=calcular(nivelDe(eu), advN, false, 'amistoso','md3',false, eu.calibrando, eu.cal);
  const venci=h.filter(x=>x.venceu).length;
  const aba=abaDe('perfil','stats');

  perfilCarregar(p.id);
  const dados = (window.__perfCache||{})[p.id];

  /* zerado enquanto carrega, e o botão fica desabilitado nesse intervalo: o
     estado "sigo ou não" só existe depois da resposta, e um botão que diz
     "Seguir" pra quem já segue convida ao clique que o banco vai recusar. */
  const seg = (dados && dados.seg) || {seguidores:0, seguindo:0, eu_sigo:false};
  const sub = abaDe('perfilFeed','posts');

  const corpo = aba==='feed' ? (carregando
      ? '<div class="card"><p class="nota">Carregando…</p></div>'
      : abasHtml('perfilFeed',[['posts','Postagens'],['fb','Feedbacks']],'pilula') + (sub==='posts'
        ? (dados.posts.length
            /* 02/09 (node 150:1044) — a aba Postagens é GRADE de duas colunas,
               com a legenda POR CIMA da foto. Era lista vertical de cartões de
               texto.
               ⚠️ O board desenha a grade só com post COM FOTO — as seis células

               antes da foto existir (a foto chegou na mig 91, em 01/09), e uma
               célula de imagem vazia com um texto dentro seria um buraco na
               grade. Por isso a célula tem duas formas: com foto, a legenda
               entra sobre um véu na base; sem foto, a célula é a própria
               superfície de cartão com o texto legível dentro. A grade não
               muda — o que muda é o que preenche a célula. */
            ? `<div class="pgrade">${dados.posts.map(x=>{

            const podem = dados.podeAvaliar||[];
            const escrever = podem.length

            const lista = dados.avals.length
              /* ⚠️ quem escreveu pode NÃO estar no elenco local: o app carrega os

              ? dados.avals.map(x=>{

                  const dt = new Date(x.criado_em);

function previa(par){
  const r=resultado(par);
  if(r===null) return `<p class="nota" style="text-align:center;margin:12px 0">Monte o placar pra ver o que está em jogo.</p>`;
  const c=calcular(nivelDe(S.jogadores[EU]), nivelDe(S.jogadores[par.adv]), r, par.contexto, par.formato, par.dupla, S.jogadores[EU].calibrando, S.jogadores[EU].cal);
  return `<div class="stats" style="margin:12px 0">
    <div><div class="v" style="color:${c.dNivel>=0?'var(--up)':'var(--dn)'}">${c.dNivel>0?'+':''}${c.dNivel}</div><div class="k">Nível</div></div>
    <div><div class="v" style="color:${corPts(c.dPts)}">${sinalPts(c.dPts)}</div><div class="k">Pontos</div></div>
    <!-- 12/08: saiu a peça "Quadros". Antes ela contava S.circuitos.length+1 e
         dava sempre 2, com o circuito fake dentro. O número verdadeiro depende
         de em quantas comunidades os DOIS jogadores estão, e isso só se sabe
         depois do crédito — prever aqui seria afirmar o que ainda não aconteceu.
         A prévia mostra só o que é certo antes do jogo. -->
  </div>${c.zebra?`<p class="nota" style="text-align:center;color:var(--up)">Zebra — multiplicador aplicado nos pontos de temporada.</p>`:''}`;
}

function resultado(par){
  let eu=0, adv=0, completos=0;
  par.sets.forEach(([a,b])=>{
    if(a==null||b==null) return;
    completos++;
    if(a>b) eu++; else if(b>a) adv++;
  });
  if(par.formato==='set') return completos===1 ? eu>adv : null;
  if(eu>=2) return true;
  if(adv>=2) return false;
  return null;
}

function mexerSet(id,i,lado){
  const par=S.pendentes.find(x=>x.id===id);
  const v=par.sets[i][lado];
  par.sets[i][lado] = v==null?0 : v>=7?null : v+1;
  render();
}

function enviarPlacar(id){
  const par=S.pendentes.find(x=>x.id===id);
  const r=resultado(par);
  if(r===null) return;
  const placar=par.sets.filter(([a,b])=>a!=null&&b!=null).map(([a,b])=>`${a}-${b}`).join(' ');
  S.aguardando={...par, venceu:r, placar};
  S.pendentes=S.pendentes.filter(x=>x.id!==id);
  pilha=[]; salvar(); render();
  toast('Enviado. <b>Nada mexeu ainda</b> — o ciclo fecha quando '+nome(par.adv).split(' ')[0]+' confirmar.');
}

/* -------------------------------------------------------------------------
   RASCUNHO — o que você escolhe só vira seu depois do VESTIR.
   Trocar de roupa é experimentar: sem um passo de confirmação, cada toque já
   é definitivo e não existe "provar e desistir". O rascunho guarda só o que é
   do PERSONAGEM (quem, peça, cor). O fundo da sala e o esporte aplicam na hora
   — não são roupa, e o esporte ainda mexe em Nível e divisão do app inteiro.
   ------------------------------------------------------------------------- */
let vestDraft = null;
const lookAtual = ()=> Object.assign({}, S.jogadores[EU], vestDraft||{});
function vestMudar(campo, valor){
  const eu = S.jogadores[EU];
  vestDraft = Object.assign({}, vestDraft||{}, {[campo]:valor});
  // vestido só existe no elenco feminino — trocar pra um homem tem que puxar a peça junto
  if(campo==='bon' && lookAtual().roupa==='vestido' && valor[0]!=='f') vestDraft.roupa='camiseta';
  // voltou sozinho pro que já estava salvo? então não há nada pendente
  if(['bon','roupa','cor'].every(c=> (vestDraft[c] ?? eu[c]) === eu[c])) vestDraft = null;
  render();
}
const vestPendente = ()=>{
  if(!vestDraft) return false;
  const eu = S.jogadores[EU];
  return ['bon','roupa','cor'].some(c=> vestDraft[c]!==undefined && vestDraft[c]!==eu[c]);
};
function vestir(){
  if(!vestPendente()) return;
  Object.assign(S.jogadores[EU], vestDraft);
  vestDraft = null; vestAba = null;
  salvar(); render(); toast('Uniforme vestido.');

/* ---- o rosto no círculo ---------------------------------------------------
   Retângulo do rosto DENTRO de cada sprite, medido em `_rostos.html`: a
   ferramenta acha o pescoço varrendo o alpha (a linha mais estreita da faixa
   alta — acima é cabeça, abaixo é ombro) e centra um quadrado na cabeça.

   Por que isso existe: antes o círculo usava o sprite `-mini` (52x150, corpo
   inteiro) esticado a 220% com UM deslocamento fixo pros nove. Dava rosto
   borrado (ampliava ~27px de fonte) e descentralizado, porque cada sprite
   enquadra o corpo num lugar diferente do quadro. É a mesma lei do escudo e do
   patrocinador: proporção medida dentro do próprio objeto, nunca coordenada
   fixa pra todos.

   Sempre do sprite `-camiseta`: o rosto não muda com a roupa. De quebra some o
   404 do `m2-vestido-mini`, que abria buraco no seletor.
   Recalibrar: abrir `_rostos.html`, ajustar, "Copiar o JSON medido", colar aqui. */
const ROSTO = {
  m1:{x: 18,y:-44,w:168,h:168,sw:201,sh:660}, m2:{x: 12,y:-48,w:183,h:183,sw:204,sh:660},
  m3:{x: 23,y:-45,w:170,h:170,sw:215,sh:660}, m4:{x: 27,y:-41,w:158,h:158,sw:211,sh:660},
  m5:{x: 29,y:-38,w:147,h:147,sw:204,sh:660}, f1:{x: 45,y:-48,w:183,h:183,sw:229,sh:660},
  f2:{x: 21,y:-54,w:206,h:206,sw:219,sh:660}, f3:{x: 12,y:-65,w:250,h:250,sw:227,sh:660},
  f4:{x:-11,y:-73,w:277,h:277,sw:216,sh:660}
};

/* Devolve o style que encaixa o retângulo medido em QUALQUER círculo.
   A porcentagem do `background-position` alinha o ponto P% da imagem com o
   ponto P% do elemento, o que resolve pra P = x/(sw-w) — sem o tamanho do
   círculo na conta. Por isso o mesmo style serve no ícone de 23px da aba e na
   grade grande, e não quebra quando a tela muda de tamanho. */
const estiloRosto = b=>{
  const r = ROSTO[b];
  if(!r) return `background-image:url(../bonecos-t/${b}-camiseta.png);background-size:cover`;
  const px = (r.sw - r.w) ? r.x/(r.sw - r.w)*100 : 50;
  const py = (r.sh - r.h) ? r.y/(r.sh - r.h)*100 : 50;
  return `background-image:url(../bonecos-t/${b}-camiseta.png)`
       + `;background-size:${(r.sw/r.w*100).toFixed(2)}% ${(r.sh/r.h*100).toFixed(2)}%`
       + `;background-position:${px.toFixed(2)}% ${py.toFixed(2)}%`;
};

  {id:'subiu',     arq:'t12', n:'Subiu de classe', c:'Passe para a classe de cima'},
  {id:'defendeu',  arq:'t1',  n:'Defendeu',        c:'Defenda o cinturão da sua comunidade'},
