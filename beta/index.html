// campeonatos vencidos (4d) — derivados do banco via netMeusCampeonatos(), não
// de tabela própria; carregam ao abrir a sala e viram as taças da aba Troféus
let _camps=[];
let _trofs=[];   // troféus do banco (trofeus_temporada): reinado, coroa, e os do ADM
let _patsBanco=[];  // patches recebidos de outras contas (patch_envios, migração 22)
const _trTipoNome=(t)=> t==='reinado'?'Reinado':t==='coroa'?'Coroa da Temporada':'Troféu';
// arte do patch: p1..p9 escolhida pelo id — estável (o mesmo patch tem sempre a
// mesma cara) sem guardar coluna de arte
const _patArte=(id)=>{ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return '../patches-v1/p'+(h%9+1)+'.png'; };
// mês/ano direto da string ISO — new Date('2026-08-01') nasce UTC e Salvador
// (UTC-3) puxaria 01/08 pra "jul/2026"
const _mesAno=d=>{ try{ const [a,m]=String(d).slice(0,10).split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+a }catch(e){ return '' } };

/* quais selos o jogador já conquistou.

   26/08: passou a derivar de `window.__minhasPartidas` (o `select('*')` que o
   inbox já faz) em vez de `S.historico`. Três motivos:
     1. `S.historico` é do APARELHO — em celular novo nasce vazio, e a sala dizia
        que quem tem 40 jogos nunca registrou nenhum;
     2. contava `h.length` cru, incluindo W.O. e cancelada — partida que NÃO
        aconteceu inflava "1ª partida", "Dez" e "Cinquenta". A ficha já filtrava
        `!h.tipo` (linha do Histórico); a sala não;
     3. `zebra`, `placar_em`, `placar_por` e `confirmed_at` só existem na linha do
        banco — eram exatamente os sinais que faltavam.
   O histórico local fica como reserva pra quando a lista ainda não chegou. */
function trofeusConquistados(){
  const g=new Set();
  const uid = (window._net && _net.uid && _net.uid()) || null;
  const todas = ((window.__minhasPartidas)||[]).filter(m=>m.status==='confirmada');

  if(uid && todas.length){
    // em duplas eu posso ocupar 4 assentos — o delta e o lado dependem de qual
    const ladoCri = (m)=> m.criador_id===uid || m.parceiro_criador_id===uid;
    const meuDelta = (m)=> m.criador_id===uid             ? m.delta_criador
                         : m.adversario_id===uid          ? m.delta_adversario
                         : m.parceiro_criador_id===uid    ? m.delta_parceiro_criador
                         : m.parceiro_adversario_id===uid ? m.delta_parceiro_adversario
                         : null;
    const advs=new Set(); let zebra=false, rapido=false;
    todas.forEach(m=>{
      (ladoCri(m) ? [m.adversario_id, m.parceiro_adversario_id]
                  : [m.criador_id,    m.parceiro_criador_id]).forEach(a=>{ if(a) advs.add(a) });
      const meu = meuDelta(m);
      const venci = ladoCri(m) ? m.venceu_criador : !m.venceu_criador;
      /* o motor carimba `zebra` no jsonb do delta (`calcular()`), e o campo
         existe nos DOIS lados da linha — sem exigir que a vitória seja minha,
         eu ganharia o selo levando de 3 de alguém acima. */
      if(venci && meu && meu.zebra===true) zebra=true;
      /* "confirmou o placar do adversário em menos de 1h": só capitão confirma
         (trava 19), o placar tem que ter sido lançado pelo OUTRO, e fechada por
         prazo não conta — ali ninguém confirmou, o relógio é que fechou. */
      const souCapitao = (m.criador_id===uid || m.adversario_id===uid);
      if(souCapitao && !m.fechada_por_prazo && m.placar_por && m.placar_por!==uid
         && m.placar_em && m.confirmed_at){
        const dt = Date.parse(m.confirmed_at) - Date.parse(m.placar_em);
        if(dt>=0 && dt<3600e3) rapido=true;
      }
    });
    if(todas.length>=1)  g.add('primeira');
    if(todas.length>=10) g.add('dez');
    if(todas.length>=50) g.add('cinquenta');
    if(advs.size>=5)     g.add('cinco');
    if(zebra)  g.add('zebra');
    if(rapido) g.add('rapido');

    /* 27/08 — os selos de TEMPORADA. Regra honesta: os três só podem acender
       quando a temporada está no fim (semana 12+) — acender "semana cheia" na
       primeira semana seria o vazio mentindo com cara de conquista. */
    const T = window.__temporada;
    if(T && T.inicio && T.fim){
      const ini = Date.parse(T.inicio), fim = Date.parse(T.fim);
      const agora = Math.min(Date.now(), fim);
      const semanas = Math.floor((agora - ini)/(7*24*3600e3)) + 1;
      const minhasNaTemp = todas.filter(m=>{
        const c = Date.parse(m.confirmed_at); return c >= ini && c <= fim; });
      if(semanas >= 12){
        const cheias = new Set(minhasNaTemp.map(m=>
          Math.floor((Date.parse(m.confirmed_at)-ini)/(7*24*3600e3))));
        let todasSemanas = true;
        for(let w=0; w<semanas && w<12; w++) if(!cheias.has(w)) todasSemanas = false;
        if(todasSemanas && minhasNaTemp.length) g.add('semana');
        if(minhasNaTemp.length) g.add('temporada');
        const abertas = ((window.__minhasPartidas)||[]).filter(m=>
          m.status==='pendente' || m.status==='contestada');
        if(!abertas.length && minhasNaTemp.length) g.add('limpo');
      }
    }

    /* SUBIU DE CLASSE — reconstrução: o Nível de hoje menos a soma dos deltas
       dá o ponto de partida; andando os deltas na ordem, qualquer travessia de
       borda pra cima acende. Vale pros dois trilhos de simples. */
    const eu = (typeof S!=='undefined' && typeof EU!=='undefined' && S.jogadores[EU]) || {};
    const trilho = (nivelHoje, esporte)=>{
      if(nivelHoje==null || typeof divisaoDe!=='function') return false;
      const minhas = todas
        .filter(m=> (m.esporte||'tenis')===esporte && !m.dupla && m.confirmed_at)
        .sort((a,b)=> Date.parse(a.confirmed_at)-Date.parse(b.confirmed_at))
        .map(m=> (meuDelta(m)||{}).dNivel || 0);
      let n = nivelHoje - minhas.reduce((t,d)=>t+d, 0);
      let div = divisaoDe(n);
      for(const d of minhas){
        n += d; const nd = divisaoDe(n);
        if('DCBA'.indexOf(nd) > 'DCBA'.indexOf(div)) return true;
        div = nd;
      }
      return false;
    };
    if(trilho(eu.nivel,'tenis') || trilho(eu.nivelB,'beach')) g.add('subiu');

    // DEFENDEU — apurado assíncrono ao abrir a sala (reinados + membros)
    if(window.__defendi) g.add('defendeu');
    return g;
  }

  // reserva: histórico do aparelho, já sem W.O. nem cancelada (`x.tipo`)
  const h=(S.historico||[]).filter(x=>!x.tipo);
  const advs=new Set(h.map(x=>x.adv));
  if(h.length>=1)  g.add('primeira');
  if(h.length>=10) g.add('dez');
  if(h.length>=50) g.add('cinquenta');
  if(advs.size>=5) g.add('cinco');
  if(h.some(x=>x.venceu && x.zebra===true)) g.add('zebra');
  return g;
}

// recorte por objeto (o fundo das peças não veio chapado) — igual folha-trofeus
const _trN=new Map();
function trNormalizar(src){
  if(_trN.has(src)) return _trN.get(src);
  const LIM=34;
  const p=new Promise(ok=>{
    const im=new Image(); im.onerror=()=>ok(null);
    im.onload=()=>{
      const W=im.naturalWidth,H=im.naturalHeight;
      const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
      c.width=W;c.height=H;x.drawImage(im,0,0);
      const dd=x.getImageData(0,0,W,H),d=dd.data;
      const lum=k=>d[k*4]*.299+d[k*4+1]*.587+d[k*4+2]*.114;
      let x0=W,x1=-1,y0=H,y1=-1;
      for(let py=0;py<H;py++)for(let px=0;px<W;px++){ if(lum(py*W+px)<LIM)continue;
        if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py; }
      if(x1<0) return ok(null);
      const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=(x1-x0)/2,ry=(y1-y0)/2;
      for(let py=0;py<H;py++)for(let px=0;px<W;px++){
        const k=py*W+px,ex=(px-cx)/(rx*1.06),ey=(py-cy)/(ry*1.06),r=Math.sqrt(ex*ex+ey*ey);
        let a=r>1?0:(r>0.9?(1-r)/0.1:1); const l=lum(k); if(l<LIM)a*=Math.max(0,l/LIM);
        d[k*4+3]=Math.round(d[k*4+3]*a); }
      x.putImageData(dd,0,0);
      const w=x1-x0+1,hh=y1-y0+1;
      const o=document.createElement('canvas'); o.width=w;o.height=hh;
      o.getContext('2d').drawImage(c,x0,y0,w,hh,0,0,w,hh);
      ok(o.toDataURL('image/png'));
    }; im.src=src;
  });
  _trN.set(src,p); return p;
}

function abrirTrofeus(){ trSel=null; let el=$('#trofeus'); if(el) el.classList.add('on'); desenharTrofeus();
  // busca os campeonatos no banco e redesenha quando chegarem (sala abre na hora)
  if(window._net && _net.uid && _net.uid() && _net.meusCampeonatos)
    _net.meusCampeonatos().then(l=>{ _camps=l||[]; desenharTrofeus() }).catch(()=>{});
  // 11/08: e os troféus de trofeus_temporada — Reinado, Coroa e os que o ADM
  // entrega. Existiam no banco e a sala nunca leu; troféu que ninguém vê não premia.
  if(window._net && _net.uid && _net.uid() && _net.meusTrofeus)
    _net.meusTrofeus().then(l=>{ _trofs=l||[]; desenharTrofeus() }).catch(()=>{});
  // 11/08 (noite): patches do banco (migração 22) — o que chega de outra conta
  if(window._net && _net.uid && _net.uid() && _net.meusPatches)
    _net.meusPatches().then(l=>{ _patsBanco=l||[]; desenharTrofeus() }).catch(()=>{});
  /* 26/08: e os grupos, pelo cinturão. O espelho `__meusGrupos` é preenchido no
     boot, mas o cinturão troca de mão DURANTE a sessão (`_cinturaoTentarPassar`
     roda a cada confirmação) — sem reconsultar, quem acabou de tomar o cinturão
     abriria a sala e leria que ele é de outro. Mesmo padrão dos três acima: a
     sala abre na hora e a coroa se corrige quando o dado chega. */
  if(window._net && _net.uid && _net.uid() && _net.meusGrupos)
    _net.meusGrupos().then(()=>{ desenharTrofeus() }).catch(()=>{});
  /* 27/08 — o selo Defendeu: reinado meu + vitória minha contra membro do
     grupo DENTRO da janela do reinado. As duas tabelas são de leitura aberta;
     as partidas vêm do espelho do inbox. Apura uma vez por abertura. */
  (async ()=>{ try{
    const uid = _net.uid && _net.uid(); if(!uid || !window._net) return;
    const sb2 = _net.sb; if(!sb2) return;
    const { data: reins } = await sb2.from('cinturao_reinados').select('*').eq('player_id', uid);
    if(!reins || !reins.length) return;
    const gids = [...new Set(reins.map(r=>r.grupo_id))];
    const { data: membs } = await sb2.from('grupo_membros').select('grupo_id,player_id').in('grupo_id', gids);
    const minhas = ((window.__minhasPartidas)||[]).filter(m=>m.status==='confirmada');
    const defendi = reins.some(r=>{
      const ini = Date.parse(r.inicio), fim = r.fim ? Date.parse(r.fim) : Date.now();
      const donos = new Set((membs||[]).filter(x=>x.grupo_id===r.grupo_id && x.player_id!==uid).map(x=>x.player_id));
      return minhas.some(m=>{
        const c = Date.parse(m.confirmed_at); if(!(c>=ini && c<=fim)) return false;
        const venci = m.criador_id===uid ? m.venceu_criador : !m.venceu_criador;
        const adv = m.criador_id===uid ? m.adversario_id : m.criador_id;
        return venci && donos.has(adv);
      });
    });
    if(defendi && !window.__defendi){ window.__defendi = true; desenharTrofeus(); }
  }catch(e){} })();
}
function fecharTrofeus(){ const el=$('#trofeus'); if(el) el.classList.remove('on') }
function selTrofeu(id){ trSel = trSel===id?null:id; desenharTrofeus() }

function desenharTrofeus(){
  let el=$('#trofeus');
  if(!el){ el=document.createElement('div'); el.id='trofeus';
    el.innerHTML=`<div class="tr-cena"></div><div class="tr-veu"></div>
      <div class="tr-topo"><h2>Sala de Conquistas</h2><div class="tr-cnt" id="tr-cnt"></div>
        <button class="tr-x" onclick="fecharTrofeus()">×</button></div>
      <div class="tr-abas" id="tr-abas"></div>
      <div class="tr-camadas" id="tr-camadas"></div>
      <div class="tr-det" id="tr-det"></div>`;
    ($('#fone')||document.body).appendChild(el); el.classList.add('on');
  }
  const fone=$('#fone'); const Tw=fone.clientWidth, Th=fone.clientHeight;
  const larguraFaixa=(TR_FAIXA.x1-TR_FAIXA.x0)*TR_SALA.W;
  const escala=(Tw/larguraFaixa)*(TR_ZOOM/1.6);
  const altoNaTela=TR_SALA.H*escala, largNaTela=TR_SALA.W*escala;
  const topo=Th*(TR_CY/100)-altoNaTela*0.499;
  const yDe=f=> topo + f*altoNaTela + TR_OFF;

  const cena=el.querySelector('.tr-cena');
  cena.style.backgroundImage=`url('${TR_SALA.arq}')`;
  cena.style.backgroundSize=`${largNaTela}px ${altoNaTela}px`;
  cena.style.backgroundPosition=`${(Tw-largNaTela)/2}px ${topo}px`;

  const got=trofeusConquistados();
  // patches: os do banco (entre contas, migração 22) + o legado local do aparelho
  const patches=[
    ..._patsBanco.map(e=>({ t:e.patch.nome, de:e.de, arte:_patArte(e.patch.id), adm:e.patch.origem==='adm' })),
    ...((S.comunidade&&S.comunidade.patches)||[]),
  ];

  // abas + contador do objeto ativo
  const chip=(a,n)=>`<button class="tr-aba ${trAba===a?'on':''}" onclick="selAba('${a}')">${n}</button>`;
  $('#tr-abas').innerHTML=chip('trofeus','Troféus')+chip('selos','Selos')+chip('patches','Patches');
  $('#tr-cnt').innerHTML = trAba==='selos' ? `<b>${got.size}</b> de ${TR_PECAS.length}`
    : trAba==='patches' ? `<b>${patches.length}</b> ◈`
    : `<b>${_camps.length+_trofs.length}</b> 🏆`;

  /* 26/08: era `const temCint=false` fixo. Dois defeitos num literal só:
     o fio nunca foi ligado (as colunas existem desde a migração 11 e
     `netMeusGrupos` já as trazia no `select('*')`), e o texto do estado negativo
     dizia "Sem dono na sua comunidade" quando `false` significava "não é MEU" —
     com o cinturão na mão de outra pessoa, a sala AFIRMAVA que ele não tinha
     dono. São três estados, e espremer três num booleano faz o app mentir. */
  const _cint = (()=>{
    const uid = (window._net && _net.uid && _net.uid()) || null;
    const esp = (typeof S!=='undefined' && S.esporte) || 'tenis';
    // cinturão é por comunidade E por esporte — trocar de esporte troca a lente
    const g = ((window.__meusGrupos)||[]).find(x=> x && x.cinturao && (x.esporte||'tenis')===esp);
    if(!g) return {tem:false, ligado:false, grupo:null, dono:null};
    return {tem: !!(uid && g.cinturao_dono_id===uid), ligado:true, grupo:g, dono:g.cinturao_dono_id};
  })();
  const temCint = _cint.tem;
  // `_nomeDe` mora no net.js e não está no mapa do `_net` — chamada defensiva
  const _nomeCint = (u)=>{ try{ return (typeof _nomeDe==='function' && u) ? _nomeDe(u) : 'alguém' }catch(e){ return 'alguém' } };
  const _rotCint = _cint.tem    ? 'Cinturão · '+((_cint.grupo&&_cint.grupo.nome)||'sua comunidade')
                 : _cint.ligado ? 'Com '+_nomeCint(_cint.dono)
                 :                'Sem cinturão na sua comunidade';
  const camadas=[];
  // cinturão sozinho no topo, em TODA aba — é a coroa da sala (Título em disputa)
  const yC=yDe(TR_PRATELEIRAS[0]);
  camadas.push(`<div class="tr-prat" style="bottom:${Th-yC}px">
    <button class="tr-peca coroa ${temCint?'tem':'nao'} ${trSel==='cint'?'sel':''}" onclick="selTrofeu('cint')">
      <img data-src="../trofeus/cinturao.png" style="height:78px" alt=""><em>${_rotCint}</em></button>
  </div>`);

  // as 4 prateleiras (12 vagas) mostram o objeto da aba ativa
  const peca=(sel,cls,img,label)=>`<button class="tr-peca ${cls} ${trSel===sel?'sel':''}" onclick="selTrofeu('${sel}')">
      <img data-src="${img}" style="height:${TR_ALT}px" alt=""><em>${label}</em></button>`;
  let itens=[];
  if(trAba==='trofeus'){
    // uma taça por campeonato vencido + os troféus do banco (Reinado, Coroa e
    // os do ADM, arte de temporada); passou de 12, o último slot vira "+N"
    const tudo=[
      ..._camps.map((c,i)=>({s:'camp:'+i, img:'../trofeus/trofeu-circuito.png', n:c.cat||c.nome})),
      ..._trofs.map((t,i)=>({s:'db:'+i,   img:'../trofeus/trofeu-temporada.png', n:t.nome||_trTipoNome(t.tipo)})),
    ];
    itens=tudo.slice(0,12).map(x=>peca(x.s,'tem',x.img,x.n));
    if(tudo.length>12) itens[11]=peca('camp:mais','tem','../trofeus/trofeu-circuito.png','+'+(tudo.length-11)+' mais');
  } else if(trAba==='selos'){
    itens=TR_PECAS.map(p=>peca(p.id,got.has(p.id)?'tem':'nao','../trofeus-v1/'+p.arq+'.png',p.n));
  } else {
    itens=patches.slice(0,12).map((p,i)=>peca('patch:'+i,'tem',p.arte||('../patches-v1/p'+((i%9)+1)+'.png'),p.t));
  }
  for(let i=0;i<4;i++){
    const y=yDe(TR_PRATELEIRAS[i+1]);
    camadas.push(`<div class="tr-prat" style="bottom:${Th-y}px">${itens.slice(i*3,i*3+3).join('')}</div>`);
  }
  $('#tr-camadas').innerHTML=camadas.join('');
  // detalhe: a etiqueta do troféu de campeonato carrega de onde veio na própria
  // cara (torneio, categoria, esporte, chave, quando) — decisão de 07/08
  let det=null;
  if(trSel==='camp:mais'){
    const nomes=[..._camps.map(c=>c.nome+(c.cat?' · '+c.cat:'')), ..._trofs.map(t=>t.nome||_trTipoNome(t.tipo))];
    det=`<b>🏆 Todos os troféus <span class="tr-pill tem">${nomes.length}</span></b>
      <p>${nomes.join(' — ')}</p>`;
  } else if(trSel && trSel.startsWith('db:')){
    const t=_trofs[+trSel.slice(3)];
    // etiqueta na própria cara, como o troféu de campeonato: de onde veio, quando
    if(t) det=`<b>🏆 ${t.nome||_trTipoNome(t.tipo)} <span class="tr-pill tem">pra sempre</span></b>
      <p>${t.etiqueta?t.etiqueta+' · ':''}${t.temporada?'Temporada '+t.temporada+' · ':''}${t.origem==='adm'?'entregue pelo app':'conquistado na temporada'} · ${_mesAno(t.criado_em)}</p>`;
  } else if(trSel && trSel.startsWith('camp:')){
    const c=_camps[+trSel.slice(5)];
    if(c) det=`<b>🏆 Campeão · ${c.nome}${c.cat?' · '+c.cat:''} <span class="tr-pill tem">pra sempre</span></b>
      <p>${c.esporte==='beach'?'Beach Tennis':'Tênis'} · chave de ${c.chave} · ${_mesAno(c.quando)}</p>`;
  } else if(trSel && trSel.startsWith('patch:')){
    const p=patches[+trSel.slice(6)];
    const quem=(u)=>(window._nomeDe?_nomeDe(u):null)||(typeof nome==='function'?nome(u):u);
    if(p) det=`<b>◈ ${p.t} <span class="tr-pill tem">pertencimento</span></b>
      <p>${p.adm?'Entregue pelo app':'Mandado por '+quem(p.de)+' na sua comunidade'}. Patch não se ganha — se recebe.</p>`;
  } else if(trSel==='cint'){
    const _pillC = _cint.tem ? 'com você' : _cint.ligado ? 'com '+_nomeCint(_cint.dono) : 'sem cinturão';
    const _txtC  = _cint.tem
      ? 'Defenda jogando — quem te vencer na comunidade leva.'
      : _cint.ligado
      ? 'Vença '+_nomeCint(_cint.dono)+' numa partida da comunidade pra tomar.'
      : 'Nenhuma comunidade sua tem cinturão ligado — quem liga é o gestor, na tela da comunidade.';
    det=`<b>Cinturão da Comunidade <span class="tr-pill ${temCint?'tem':'nao'}">${_pillC}</span></b>
      <p>${_txtC}</p>`;
  } else {
    const p=TR_PECAS.find(x=>x.id===trSel);
    if(p) det=`<b>${p.n} <span class="tr-pill ${got.has(p.id)?'tem':'nao'}">${got.has(p.id)?'conquistado':'bloqueado'}</span></b><p>${p.c}</p>`;
  }
  // texto de descanso por aba — cada objeto explica a própria natureza
  const vazio = trAba==='trofeus'
    ? `<b>Troféus</b><p>Vença um campeonato e a taça entra na prateleira — torneio, chave e data na etiqueta. Reinado e Coroa da temporada entram sozinhos. Pra sempre.</p>`
    : trAba==='patches'
    ? `<b>Patches</b><p>Patch vem da comunidade: quando alguém te mandar um, aparece aqui. É pertencimento, não mérito.</p>`
    : `<b>Toque numa peça</b><p>Bloqueada, ela fica de vulto e diz o que fazer pra conquistar.</p>`;
  $('#tr-det').innerHTML = det || vazio;
  el.querySelectorAll('[data-src]').forEach(x=>{ trNormalizar(x.dataset.src).then(u=>{ if(u) x.src=u }) });
}

function mostrarDesafioVS(m){

  const j=S.jogadores[advKey] || {nome:'Jogador', cor:'#5C2E3C', bon:'m1', nivel:1200};

  const q=(eu.cena&&eu.cena.quadra)||'saibro', mo=(eu.cena&&eu.cena.momento)||'noite';

    <div class="vs-arena">
      <div class="vs-lado" style="--camisa:${eu.cor}">${bonecoImg(eu,true)}<div class="vs-nome">Você</div></div>
      <div class="vs-x">VS</div>
      <div class="vs-lado" style="--camisa:${j.cor||'#5C2E3C'}">${bonecoImg(j,true)}<div class="vs-nome">${(j.nome||'').split(' ')[0]}</div></div>
    </div>
    <div class="vs-card">
      <div class="vs-adv"><b>${j.nome}</b> <span class="vs-id">${advId}</span>
        <div class="vs-meta">Classe ${div} · ${amigo?'<span style="color:var(--up)">✔ seu amigo</span>':'não é seu amigo'}</div></div>
      <div class="vs-acoes">

  el.classList.add('on');

}
function fecharVS(){ const el=document.getElementById('vs'); if(el) el.classList.remove('on') }

function _mgFicha(chave){
  const j = S.jogadores[chave] || {nome:'Jogador', bon:'m1', nivel:1200};
  const T = tabelaPontos();
  const ord = ordena(T.comunidade || {});
  const i = ord.indexOf(chave);
  return { j, chave, classe: classeDe(j), nivel: nivelDe(j),
           pts: (T.comunidade && T.comunidade[chave]) || 0,
           pos: i >= 0 ? i + 1 : null };
}
function mostrarMatchGame(m){
  const eu = _mgFicha(EU);
  /* `_advId`/`_chaveLocal` são const de net.js — no escopo global de script,
     mas fora de `window`. Referenciar direto lança ReferenceError se o arquivo
     não tiver carregado; `typeof` é o mesmo cuidado que net.js:2300 já toma. */
  const uid = (typeof _advId === 'function') ? _advId(m) : m.criador_id;
  const advKey = (typeof _chaveLocal === 'function') ? _chaveLocal(uid) : uid;
  const ad = _mgFicha(advKey);
  const q = (eu.j.cena && eu.j.cena.quadra) || 'saibro';
  const mo = (eu.j.cena && eu.j.cena.momento) || 'noite';

  /* selo 1 — o equilíbrio sai da CLASSE, que é a régua que o app já usa pra
     emparelhar (janela de ±1). Três barras acesas = mesma classe. */
  const mesma = eu.classe[0] === ad.classe[0];
  const barras = mesma ? 3 : 2;
  const selo1 = mesma ? 'Equilíbrio ótimo' : 'Classes vizinhas';
  /* selo 2 — "próxima" precisa de régua. 10% do maior dos dois é a mesma
     proporção que o arquivo insinua (0.000 contra 0.000). */
  const dif = Math.abs(eu.pts - ad.pts), teto = Math.max(eu.pts, ad.pts, 1);
  const selo2 = dif <= teto * 0.1 ? 'Pontuação próxima' : `${dif} pts de diferença`;
  /* selo 3 — fato puro, vem da partida */
  const selo3 = m.formato === 'set' ? 'Partida única' : 'Melhor de 3';

  const lado = (f)=> `
    <div class="mg-lado">
      <div class="mg-face" style="${estiloRosto(f.j.bon || 'm1')}"></div>
      <div class="mg-nome">${(f.j.nome || 'Jogador').split(' ')[0]}</div>
      <div class="mg-pil"><b>${f.classe}</b><span>${f.pts.toLocaleString('pt-BR')}</span></div>
      ${f.pos ? `<div class="mg-pos">${f.pos}º lugar na comunidade</div>` : ''}
    </div>`;

  let el = document.getElementById('mg');
  if(!el){ el = document.createElement('div'); el.id = 'mg'; document.body.appendChild(el); }
  el.innerHTML = `
    <div class="mg-bg" style="background-image:url('../quadras/${q}-${mo}.jpg')"></div>
    <div class="mg-scrim"></div>
    <div class="mg-in">
      <button class="mg-x" onclick="fecharMatchGame()" aria-label="Fechar">&#8249;</button>
      <div class="mg-kick">Desafio confirmado</div>
      <div class="mg-tit">Let&rsquo;s Ranket!</div>
      <div class="mg-rule"></div>
      <div class="mg-sub">Voc&ecirc;s t&ecirc;m um perfil compat&iacute;vel para jogar.</div>
      <div class="mg-duo">
        ${lado(eu)}
        <div class="mg-net"><img src="icones/mg-raquetes.png" alt=""></div>
        ${lado(ad)}
      </div>
      <div class="mg-selos">
        <div class="mg-selo"><span class="mg-barras">${
          [12,20,12].map((h,i)=>`<i style="height:${h}px;opacity:${i<barras?1:.25}"></i>`).join('')
        }</span><em>${selo1}</em></div>
        <div class="mg-selo">${MGIC.alvo}<em>${selo2}</em></div>
        <div class="mg-selo">${MGIC.trofeu}<em>${selo3}</em></div>
      </div>
      <div class="mg-acoes">
        <button class="mg-msg" onclick="fecharMatchGame();_net.abrirChatPartida('${m.id}')">${MGIC.chat}Enviar mensagem</button>
        <button class="mg-hora" onclick="fecharMatchGame();_net.abrirContra('${m.id}')">${MGIC.agenda}Propor hor&aacute;rio</button>
      </div>
    </div>`;
  el.classList.add('on');
}
function fecharMatchGame(){ const el = document.getElementById('mg'); if(el) el.classList.remove('on') }

function mostrarPartidaCriada(nomeAdv, ehDupla){
  const primeiro = (nomeAdv || '').split(' ')[0] || 'seu oponente';
  const txt = ehDupla
    ? 'Duplas proposta com sucesso. Enquanto os outros tr&ecirc;s n&atilde;o topam, voc&ecirc; segue dispon&iacute;vel no radar de outros jogadores.'
    : `Nova partida criada com sucesso. Caso ${primeiro} n&atilde;o aceite o desafio, voc&ecirc; ir&aacute; aparecer dispon&iacute;vel no radar de outros jogadores.`;
  let el = document.getElementById('np');
  if(!el){ el = document.createElement('div'); el.id = 'np'; document.body.appendChild(el); }
  el.innerHTML = `
    <div class="np-brilho"></div>
    <div class="np-in">
      <div class="np-marca">${NPIC.marca}</div>
      <div class="np-lettering">${NPIC.lettering}</div>
      <p class="np-txt">${txt}</p>
      <div class="np-acoes">
        <button class="np-share" onclick="partidaCriadaCompartilhar()">${NPIC.share}Compartilhar</button>
        <button class="np-ok" onclick="fecharPartidaCriada()">Concluir</button>
      </div>
    </div>`;
  el.classList.add('on');
}
/* mesmo caminho do `perfilCompartilhar`: share nativo, área de transferência
   como recuo, e o silêncio de quem fechou a folha não vira erro */
async function partidaCriadaCompartilhar(){
  const texto = 'Marquei uma partida no Ranket. Bora?';
  try{
    if(navigator.share){ await navigator.share({title:'Ranket', text:texto}); return; }
    if(navigator.clipboard){ await navigator.clipboard.writeText(texto); if(window.toast) toast('Copiado — é só colar.'); return; }
    if(window.toast) toast('Este navegador não deixa compartilhar daqui.');
  }catch(e){ /* fechou a folha: não é erro */ }
}
function fecharPartidaCriada(){ const el = document.getElementById('np'); if(el) el.classList.remove('on') }
window.mostrarPartidaCriada = mostrarPartidaCriada;
window.fecharPartidaCriada = fecharPartidaCriada;
window.partidaCriadaCompartilhar = partidaCriadaCompartilhar;

const CPIC = { perfil:`<svg viewBox="0 0 15.3333 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path id="Vector" d="M14.3333 18C14.3333 15.4963 11.3486 13.4667 7.66667 13.4667C3.98477 13.4667 1 15.4963 1 18M7.66667 10.0667C5.21207 10.0667 3.22222 8.03702 3.22222 5.53333C3.22222 3.02964 5.21207 1 7.66667 1C10.1213 1 12.1111 3.02964 12.1111 5.53333C12.1111 8.03702 10.1213 10.0667 7.66667 10.0667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`, grupos:`<svg viewBox="0 0 22 19" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path id="Vector" d="M21 17.9999C21 16.0261 19.1449 14.3469 16.5556 13.7245M14.3333 18C14.3333 15.4963 11.3486 13.4667 7.66667 13.4667C3.98477 13.4667 1 15.4963 1 18M14.3333 10.0667C16.7879 10.0667 18.7778 8.03702 18.7778 5.53333C18.7778 3.02964 16.7879 1 14.3333 1M7.66667 10.0667C5.21207 10.0667 3.22222 8.03702 3.22222 5.53333C3.22222 3.02964 5.21207 1 7.66667 1C10.1213 1 12.1111 3.02964 12.1111 5.53333C12.1111 8.03702 10.1213 10.0667 7.66667 10.0667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`, camera:`<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g id="Icon Frame"> <g id="Base"> </g> <path id="Rectangle 63" d="M5.5 9.16667H38.5V31.1667C38.5 33.1917 36.8584 34.8333 34.8333 34.8333H9.16667C7.14162 34.8333 5.5 33.1917 5.5 31.1667V9.16667Z" stroke="currentColor" stroke-width="3.03448" stroke-linejoin="round"/> <circle id="Ellipse 25" cx="22" cy="22" r="5.5" stroke="currentColor" stroke-width="3.03448" stroke-linecap="round" stroke-linejoin="round"/> <path id="Vector 77" d="M31.1667 3.66667L34.8333 3.66667" stroke="currentColor" stroke-width="3.03448" stroke-linecap="round" stroke-linejoin="round"/> </g></svg>` };
let _cp = { destino:'feed', grupo:null, arquivo:null };
async function abrirCriarPost(){
  _cp = { destino:'feed', grupo:null, arquivo:null };
  let el = document.getElementById('cp');
  if(!el){ el = document.createElement('div'); el.id = 'cp'; document.body.appendChild(el); }
  el.innerHTML = `
    <div class="cp-brilho"></div>
    <div class="cp-topo"><button class="cp-voltar" onclick="fecharCriarPost()" aria-label="Voltar">&#8249;</button></div>
    <div class="cp-in">
      <div class="cp-h1">Novo post</div>
      <div class="cp-cartao">
        <div class="cp-rot">Onde voc&ecirc; quer postar?</div>
        <div class="cp-dest">
          <button id="cp-d-feed" class="sel" onclick="cpDestino('feed')">${CPIC.perfil}
            <b>Meu feed</b><span>Aparece pra comunidade e na sua ficha.</span></button>
          <button id="cp-d-grupo" onclick="cpDestino('grupo')">${CPIC.grupos}
            <b>Grupos</b><span>S&oacute; quem participa do grupo escolhido v&ecirc;.</span></button>
        </div>
        <select class="cp-grupo" id="cp-sel-grupo" hidden onchange="_cp.grupo=this.value||null;cpValidar()">
          <option value="">Carregando seus grupos&hellip;</option>
        </select>
        <textarea class="cp-txt" id="cp-txt" placeholder="Diga algo sobre a partida" oninput="cpValidar()"></textarea>
        <input type="file" id="cp-file" accept="image/jpeg,image/png,image/webp" hidden onchange="cpFoto(this)">
        <button class="cp-foto" onclick="document.getElementById('cp-file').click()">${CPIC.camera}Adicionar foto</button>
        <img class="cp-previa" id="cp-previa" hidden alt="">
        <div class="cp-loc">
          <div class="cp-rot">Adicionar localiza&ccedil;&atilde;o (opcional)</div>
          <input class="cp-grupo" disabled placeholder="Em breve">
        </div>
      </div>
      <button class="cp-pub" id="cp-pub" disabled onclick="cpPublicar()">Publicar nova postagem</button>
    </div>`;
  el.classList.add('on');
  /* os grupos só são buscados quando a aba deles é escolhida — abrir a tela
     pra escrever no feed não precisa pagar duas consultas ao banco */
}
function cpDestino(d){
  _cp.destino = d;
  document.getElementById('cp-d-feed').classList.toggle('sel', d==='feed');
  document.getElementById('cp-d-grupo').classList.toggle('sel', d==='grupo');
  const sel = document.getElementById('cp-sel-grupo');
  sel.hidden = (d !== 'grupo');
  if(d === 'grupo' && !sel.dataset.pronto) cpCarregarGrupos(sel);
  if(d === 'feed') _cp.grupo = null;
  cpValidar();
}
async function cpCarregarGrupos(sel){
  try{
    const r = await _net.meusGrupos();
    const meus = (r && (r.meus || r)) || [];
    sel.innerHTML = meus.length
      ? '<option value="">Escolha o grupo</option>' + meus.map(g=>`<option value="${g.id}">${g.nome||'Grupo'}</option>`).join('')
      : '<option value="">Você ainda não participa de nenhum grupo</option>';
    sel.dataset.pronto = '1';
  }catch(e){ sel.innerHTML = '<option value="">Não deu pra carregar seus grupos</option>'; }
  cpValidar();
}
function cpFoto(input){
  const f = input.files && input.files[0];
  _cp.arquivo = f || null;
  const p = document.getElementById('cp-previa');
  if(f){ p.src = URL.createObjectURL(f); p.hidden = false; } else { p.hidden = true; }
  cpValidar();
}
/* o botão só acende quando o post pode existir: texto sempre, e grupo
   escolhido quando o destino é grupo. É a mesma regra que `netPostar`
   aplica — checar aqui evita a viagem até o banco pra ouvir não. */
function cpValidar(){
  const t = (document.getElementById('cp-txt').value||'').trim();
  const ok = !!t && (_cp.destino === 'feed' || !!_cp.grupo);
  document.getElementById('cp-pub').disabled = !ok;
}
async function cpPublicar(){
  const bt = document.getElementById('cp-pub');
  const t = (document.getElementById('cp-txt').value||'').trim();
  bt.disabled = true; bt.textContent = 'Publicando…';
  const r = await _net.postar(t, _cp.destino === 'grupo' ? _cp.grupo : null, _cp.arquivo);
  if(r && r.erro){
    bt.textContent = 'Publicar nova postagem'; bt.disabled = false;
    if(window.toast) toast(r.erro); else alert(r.erro);
    return;
  }
  fecharCriarPost();
  if(window.toast) toast('Publicado.');
  if(window.irFeed) irFeed();
}
function fecharCriarPost(){ const el = document.getElementById('cp'); if(el) el.classList.remove('on') }
window.abrirCriarPost = abrirCriarPost;
window.fecharCriarPost = fecharCriarPost;
window.cpDestino = cpDestino; window.cpFoto = cpFoto;
window.cpValidar = cpValidar; window.cpPublicar = cpPublicar;

   outro jogador nunca via nada.

   propôs, com o horário escolhido, e só vira jogo marcado quando o outro
   aceita. Toast que afirma o que não aconteceu é pior que botão que não faz
   nada — o botão morto você percebe na hora. */

}

/* 25/08: a vitrine manda o código na URL (`app/?convite=RANKET-XXXXX`) depois

   novo, porque parâmetro de URL é digitado por qualquer um e confiar nele
   seria trocar a porteira por um link. */
function _conviteDaURL(){
  try{
    const v = new URLSearchParams(location.search).get('convite');
    return v ? v.trim().toUpperCase().slice(0,32) : '';
  }catch(e){ return ''; }
}
function abrirCadastro(){ onb={step:0, tela:null, perfil:null, joga:null, apresentacao:'', telaEsportiva:false, convite:'', conviteVal:null, conviteOk:false, conviteMsg:'', int:{nome:'',contato:'',cidade:'',via:'email'}, nome:'', email:'', senha:'', verSenha:false, esportes:['tenis'], mao:null, tempo:'', bon:'m1', cor:'#C9663C', div:null, quiz:false, qidx:0, qskor:{D:0,C:0,B:0,A:0}, contaCriada:false}; document.getElementById('onb').classList.add('on');

     (conta em auth, cadastro interrompido antes da linha de `players`), as duas
     etapas de porta já foram vencidas na primeira passagem e não podem ser
     cobradas de novo: o signUp devolveria "e-mail já registrado" — a mesma
     parede, com outra mensagem — e o convite pode já ter sido consumido lá
     atrás, o que trancaria a pessoa na porteira com um código legítimo.
     A conta existir É a prova de que ela passou pelas duas. */
  if(typeof MEU_UID!=='undefined' && MEU_UID){ onb.retomada=true; onb.contaCriada=true; }

function onbConvite(v){ onb.convite=v; onb.conviteOk=false; onb.conviteVal=null }
async function onbConviteOk(){

  onb.conviteMsg='conferindo…'; renderOnb();
  const r = window.netConviteValidar ? await netConviteValidar(cod) : {valido:true};
  if(r.erro){ onb.conviteMsg='Não deu pra conferir agora — tente de novo.'; renderOnb(); return; }

/* Chamada pelo net.js quando a quadra é salva com o cadastro aberto.
   Auto-MARCA a quadra nova: quem acabou de cadastrar a própria quadra já
   respondeu "é aqui que eu jogo" no ato de cadastrar — nascer desmarcada
   pediria um segundo toque pra dizer o que já foi dito. E se for a primeira
   da lista, vira a principal, que também é o que se espera. */
window.onbQuadraCriada = function(id){
  if(typeof onb==='undefined' || !onb || !id) return;
  onb.locSel = onb.locSel||[];
  if(!onb.locSel.includes(id)) onb.locSel.push(id);
  onb.locais = undefined;         // força o recarregamento da lista no render
  renderOnb();
};

function onbLocal(id){
  onb.locSel = onb.locSel||[];
  const i=onb.locSel.indexOf(id);
  if(i>=0) onb.locSel.splice(i,1); else onb.locSel.push(id);
  renderOnb();
}

/* Idade completa na data de referência. Conta por ano/mês/dia em vez de
   dividir milissegundos: ano bissexto e fuso fazem a divisão errar por um dia
   justamente em quem faz aniversário hoje — que é o caso que mais importa. */
function idadeEm(nascISO, ref){
  if(!nascISO) return null;
  const [a,m,d] = nascISO.split('-').map(Number);
  if(!a || !m || !d) return null;
  let idade = ref.getFullYear() - a;
  const fezAniver = (ref.getMonth()+1 > m) || (ref.getMonth()+1 === m && ref.getDate() >= d);
  if(!fezAniver) idade--;
  return idade;
}
// PASSO 1 — só valida formato; a conta ainda não nasce (idade vem no passo 2)
// 25/08 (bug do Nuno): a validação era só /@/ — "nome@gmail" passava aqui e
// estourava no Supabase, em inglês. Normaliza (trim+minúscula) e exige
// usuário@domínio.tld de verdade.
function onbContaOk(){
  if(!onbTemConvite()) return;
  onb.email = (onb.email||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(onb.email)){
    alert('Esse e-mail não parece completo. Confere se está no formato nome@provedor.com (sem espaços).');
    return;
  }
  if(!onb.senha || onb.senha.length<6){ alert('A senha precisa de pelo menos 6 caracteres.'); return; }
  if(onb.senha !== (onb.senha2||'')){ alert('As duas senhas não estão iguais. Confere e tenta de novo.'); return; }
  onbNext();
}
// traduz os erros comuns do Supabase pra português de gente
function onbErroConta(msg){
  const m=(msg||'').toLowerCase();
  if(m.includes('registered') || m.includes('already')) return 'Esse e-mail já tem conta. Use "Já tenho conta" pra entrar.';
  if(m.includes('invalid'))    return 'O Supabase recusou esse e-mail como inválido. Confere se digitou certo (nome@provedor.com).';
  if(m.includes('rate limit')) return 'Muitas tentativas seguidas. Espera um minuto e tenta de novo.';
  return 'Não deu pra criar: '+msg;
}
/* A PORTA. Chamada antes de avançar do passo 1 e de novo antes do signUp:
   uma porta que só se confere na entrada não é porta, é aviso. Devolve à
   porteira em vez de dar alerta seco — a pessoa pode ter só apagado o campo. */
function onbTemConvite(){
  /* 31/08: na RETOMADA (conta já existe em auth, cadastro interrompido antes da
     linha de `players`) a porteira não se cobra de novo. O código pode já ter
     sido consumido na primeira passagem, e nesse caso a pessoa ficaria presa na
     porta com um convite legítimo. A conta existir é a prova de que ela passou.
     Não forjo um `conviteVal`: ele é o código VALIDADO, e o fim do cadastro o
     manda pro `netConviteConsumir` — inventar um faria o app tentar consumir
     código que nunca existiu. */
  if(onb.retomada) return true;
  if(onb.conviteOk && onb.conviteVal) return true;
  onb.tela='porta';
  onb.conviteMsg='Confirme o convite pra continuar — ele é a sua carteirinha aqui.';
  renderOnb();
  return false;
}

// PASSO 2 — nome + nascimento; a trava de idade roda e SÓ ENTÃO o signUp
async function onbDadosOk(){
  if(!onbTemConvite()) return;
  if(!onb.nome || !onb.nome.trim()){ alert('Digite seu nome.'); return; }
  if(!onb.sobrenome || !onb.sobrenome.trim()){ alert('Digite seu sobrenome.'); return; }
  /* 29/08 (board, node 29:256): o aceite virou caixa de marcar, e por isso
     virou GATE aqui em vez de letra miúda no rodapé. Ele mora junto da trava
     de 18 anos de propósito: as duas são a mesma pergunta — esta conta pode
     existir? — e separar deixaria uma delas passar sozinha. */
  if(!onb.termos){ alert('Para criar a conta é preciso aceitar os Termos de Uso.'); return; }
  const idade = idadeEm(onb.nasc, new Date());
  if(idade === null){ alert('Preencha sua data de nascimento.'); return; }
  if(idade < 18){
    alert('O Ranket é só para maiores de 18 anos.\n\nO app marca jogo presencial entre pessoas que não se conhecem, e por isso a conta é restrita. Guarde o convite — a gente se vê quando você fizer 18.');
    return;
  }
  if(idade > 120){ alert('Confira a data de nascimento.'); return; }
  onb.maiorDe18 = true;
  onb.idadeDeclaradaEm = new Date().toISOString();
  if(!onb.contaCriada && window.netSignUp){
    const r = await netSignUp(onb.email, onb.senha);
    if(r.erro){ alert(onbErroConta(r.erro)); return; }
    onb.contaCriada = true;
    /* o convite se consome AQUI, com a conta recém-criada na mão: antes disso
       não há `auth.uid()` pra carimbar, e depois disso a pessoa já está dentro.
       Se falhar (código consumido por outro no meio), a conta segue — barrar
       alguém que já criou conta deixaria um órfão no auth. Fica registrado. */
    if(onb.conviteVal && window.netConviteConsumir){
      const c = await netConviteConsumir(onb.conviteVal);
      onb.conviteConsumido = !!c.ok;
      if(!c.ok) console.warn('[convite] não consumiu no signUp:', onb.convite, c);
    }
  }
  onbNext();
}
function onbNext(){ onb.step++; renderOnb() }
function onbBack(){
  /* (66) da Ficha Esportiva do professor volta pra Ficha do Professor, não pro
     passo anterior — senão ele perde o que acabou de preencher. */
  if(onb.telaEsportiva){ onb.telaEsportiva=false; renderOnb(); return }
  if(onb.tela){
    if(onb.tela==='lista'||onb.tela==='intOk'){ onb.tela='porta'; renderOnb(); return }
    if(onb.tela==='papel'){ onb.tela='porta'; renderOnb(); return }
    /* sair da PORTEIRA devolve o passo junto. Sem isto o step ficava em 1 e o
       toque seguinte renderizava "Criar Conta" com o convite já apagado — o
       furo que a revisão achou. */
    onb.tela=null; onb.step=0; renderOnb(); return;
  }
  if(onb.step===0){ fecharCadastro(); return }
  // do passo 1 pra trás volta pra porteira, não pra abertura: o convite já foi
  // conferido e a pessoa perderia o caminho
  if(onb.step===1){ onb.tela='porta'; renderOnb(); return }
  onb.step--; renderOnb();
}

function completarCadastro(){
  const eu=S.jogadores[EU];
  // cópia ANTES do fecharCadastro() abaixo zerar o `onb` — o IIFE assíncrono
  // do fim roda depois e leria null
  const onbLocSel=(onb.locSel||[]).slice();
  const conviteUsado=onb.conviteVal||null, conviteJaConsumido=!!onb.conviteConsumido;
  const perfilEscolhido=onb.perfil||'jogador', apresentacaoDita=(onb.apresentacao||'').trim();
  /* 25/08: uma ou duas modalidades. O primeiro esporte marcado vira o ativo
     (e o cenário); o nível declarado semeia TODOS os escolhidos — decisão da
     Fase A. Esporte não escolhido continua nascendo C 1375, em calibragem
     própria, como desde 06/08. */
  const esc = (onb.esportes && onb.esportes.length) ? onb.esportes : ['tenis'];
  S.esporte = esc[0];
  eu.cena = S.esporte==='beach' ? {quadra:'areia',momento:'noite'} : {quadra:'saibro',momento:'noite'};
  eu.cenas = { [S.esporte]: eu.cena };
  /* 29/08: nome e sobrenome são campos separados na tela (board) e um só no
     estado — `eu.nome` é o que toda a lista de adversários, o quadro e o card
     exportado leem. Juntar aqui evita espalhar a mudança por 40 leitores. */
  const nomeCheio = [onb.nome, onb.sobrenome].map(x=>(x||'').trim()).filter(Boolean).join(' ');
  if(nomeCheio){ eu.nome=nomeCheio; eu.ap=nomeCheio.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase() }
  eu.bio    = (onb.bio||'').trim();
  eu.genero = onb.genero || '';
  // personagem (bon/cor/roupa/clube/etc) já vem do vestiário aberto no passo 4 — não sobrescreve.
  if(onb.div){
    if(esc.includes('tenis')){ eu.div =onb.div; eu.nivel =NIVEL_PTS[onb.div] } else { eu.div ='C'; eu.nivel =NIVEL_PTS.C }
    if(esc.includes('beach')){ eu.divB=onb.div; eu.nivelB=NIVEL_PTS[onb.div] } else { eu.divB='C'; eu.nivelB=NIVEL_PTS.C }
  }
  // 25/08 (telas novas): mão dominante e tempo de prática entram na ficha
  eu.mao = onb.mao || null;
  eu.tempoPratica = (onb.tempo||'').trim() || null;
  // 25/08 (mig 62): o canal preferido só viaja quando a pessoa escolheu E deu
  // o valor — canal sem contato não serve pra nada
  if(onb.canal && (onb.contato||'').trim()){
    eu.contatoCanal = onb.canal; eu.contatoValor = onb.contato.trim();
  }
  if(onb.email && onb.email.trim()) eu.email = onb.email.trim();
  // 11/08: a data é o dado, a declaração é o fato histórico. Guarda os dois.
  if(onb.nasc){ eu.nascimento = onb.nasc; eu.maiorDe18 = !!onb.maiorDe18; eu.idadeDeclaradaEm = onb.idadeDeclaradaEm || null; }
  /* (66) SÓ QUEM JOGA CALIBRA. Carimbar calibragem em quem só dá aula seria
     prometer que "as 8 primeiras partidas ajustam seu Nível" sobre partidas que
     ele não vai jogar. O Nível fica no padrão e some da tela dele — o motor não
     é tocado. */
  eu.perfil = onb.perfil || 'jogador';
  eu.joga   = (onb.joga !== false);
  eu.calibrando = eu.joga; eu.cal = 0;
  S.cadastroFeito=true;
  fecharCadastro(); aba='inicio'; pilha=[]; salvar(); render();
  (async()=>{
    if(window.netSyncJogador){ try{ await netSyncJogador(eu); }catch(e){} }
    /* 28/08 (mig 74): `joga` saiu do upsert do sync, e este é o INSERT que
       CRIA a linha — sem a coluna no payload vale o default do banco, que é
       `true`. Quem escolheu "Não, só dou aula" nasceria competindo: entraria
       no ranking da vitrine e no radar dos outros como adversário, contra o
       que esta mesma tela promete por escrito. Desligar é o caminho que a 74
       deixou livre de propósito — `true → false` não fabrica assento nenhum. */
    if(eu.joga === false && window.netJogaDesligar){
      try{ await netJogaDesligar(); }catch(e){ console.error('[cadastro] nao consegui desligar o joga', e); }
    }
    /* 25/08: SEGUNDA TENTATIVA do convite. A primeira roda no signUp (passo 2)
       e é a que vale; esta existe porque falha silenciosa ali deixava o código
       livre pra sempre — medido em teste real, com a FK apontando pro lugar
       errado (mig 56). Roda DEPOIS do sync, então a linha de players já existe
       e qualquer versão da FK aceita. Consumir duas vezes é inofensivo: o
       `where usado_por is null` da função devolve false na segunda. */
    if(conviteUsado && !conviteJaConsumido && window.netConviteConsumir){
      try{ await netConviteConsumir(conviteUsado); }catch(e){}
    }
    /* (66) a identidade de professor nasce JUNTO da conta. Se ficasse pra
       depois, ele terminaria o cadastro pela porta do professor e não
       apareceria na busca de professor — que é o motivo de ele ter entrado. */
    if(perfilEscolhido==='professor' && window._net && _net.salvarProfessor){
      try{ await _net.salvarProfessor({ apresentacao: apresentacaoDita, ativo:true,
             aceitandoAte: new Date(Date.now()+90*86400e3).toISOString().slice(0,10) }); }catch(e){}
    }
    if(onbLocSel.length && window._net && _net.salvarMeusLocais){
      try{ await _net.salvarMeusLocais(onbLocSel, onbLocSel[0]); }catch(e){}
    }
    if(window.netBoot){ try{ await netBoot(S.jogadores[EU]); }catch(e){} }
  })();
  toast(eu.joga
    ? 'Bem-vindo, '+eu.nome.split(' ')[0]+'! Você entra em <b>calibragem</b> — as 8 primeiras partidas ajustam seu Nível.'
    : 'Bem-vindo, '+eu.nome.split(' ')[0]+'! Monte sua <b>turma</b> e marque as aulas — é por aí que o app trabalha pra você.');
}

/* 29/08: mesma delegação, agora pras abas DENTRO da tela (abasHtml). No

document.addEventListener('click', (e)=>{

/* =========================================================================
   TELA DE CARREGAMENTO (18/08)
   O `render()` acima já desenhou: a partir daqui a splash está cobrindo tela
   pronta, e sair é só deixar de cobrir. O teto de 6s não é otimismo — é a
   garantia de que uma falha de rede não deixa ninguém preso olhando a marca.
   ========================================================================= */
function sairSplash(){
  const s=$('#splash'); if(!s || s.classList.contains('sai')) return;
  s.classList.add('sai');
  setTimeout(()=>{ if(s.parentNode) s.remove() }, 400);   // depois do fade
}
/* O teto vale sempre, inclusive quando o boot trava sem rejeitar — que é o modo
   de falha que mais aparece em 4G ruim. Quem engancha o boot é a chamada lá
   embaixo, onde o `netBoot` de fato acontece. */
setTimeout(sairSplash, 6000);
if(!window.netBoot) requestAnimationFrame(sairSplash);

/* =========================================================================
   INSTALAR NA TELA DE INÍCIO (18/08)
   Dois mundos e um só lugar na tela. No Android o navegador avisa que dá pra
   instalar (`beforeinstallprompt`) e entrega o convite pra disparar na hora
   certa; no iOS não existe API nenhuma — só dá pra ENSINAR o caminho, e mesmo
   isso só faz sentido no Safari, porque Chrome no iPhone não instala.

   Quem já instalou nunca vê: é justamente quem abriria mais o app, e oferecer
   o que a pessoa já fez é o jeito mais rápido de a faixa virar ruído.
   ========================================================================= */
(function instalar(){
  const faixa=$('#instale'); if(!faixa) return;
  const jaInstalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  if(jaInstalado || guarda.getItem('instalarNao')==='1') return;

  const fechar=()=>{ faixa.hidden=true; guarda.setItem('instalarNao','1') };
  $('#instale-nao').onclick=fechar;

  let convite=null;
  addEventListener('beforeinstallprompt', (e)=>{
    /* segurar o evento é o ponto: sem o preventDefault o Chrome mostra a barra
       dele, no momento dele, e o botão daqui nunca teria o que disparar. */
    e.preventDefault(); convite=e; faixa.hidden=false;
    $('#instale-sim').textContent='Instalar';
  });

  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const safari = iOS && !/crios|fxios|edgios/i.test(navigator.userAgent);
  if(safari){
    faixa.hidden=false;
    $('#instale-tx').textContent='No Safari: toque em Compartilhar e depois em "Adicionar à Tela de Início".';
    $('#instale-sim').textContent='Entendi';
  }

  $('#instale-sim').onclick=async ()=>{
    if(!convite){ fechar(); return; }              // iOS, ou convite que expirou
    convite.prompt();
    try{ await convite.userChoice; }catch(e){}
    convite=null; fechar();                         // aceitando ou não, não pergunta de novo
  };

  // instalou por fora (menu do navegador): a faixa perde o assunto na hora
  addEventListener('appinstalled', fechar);
})();

/* Hidrata o jogador local a partir da linha do banco (login em outro aparelho ou
   sessão que já tem conta). Copia tudo e marca cadastro feito — sem recriar nada. */
function hidratarJogador(row){
  const eu = S.jogadores[EU];
  eu.nome=row.nome; eu.ap=row.ap||eu.ap; eu.email=row.email||eu.email;
  eu.clube=row.clube||''; eu.nivel=row.nivel??1200; eu.nivelB=row.nivelb??1200;
  // (mig 46) a ladder de duplas hidrata junto — sem isto o meu próprio número
  // de duplas ficaria preso no default e a prévia usaria o trilho errado
  eu.nivel_duplas=row.nivel_duplas ?? row.nivel ?? 1200;
  eu.nivelb_duplas=row.nivelb_duplas ?? row.nivelb ?? 1200;
  eu.calibrando=!!row.calibrando; eu.cal=row.cal||0;
  if(row.bon) eu.bon=row.bon; if(row.roupa) eu.roupa=row.roupa; if(row.cor) eu.cor=row.cor;
  if(row.cena) eu.cena=row.cena; if(row.escudo) eu.escudo=row.escudo;
  if(row.patroc) eu.patroc=row.patroc; if(row.vestiario) eu.vestiario=row.vestiario;
  // 11/08: a declaração de idade viaja junto — sem ela o sync de outro aparelho
  // mandaria a linha sem nascimento e a pergunta voltaria pra quem já respondeu
  if(row.nascimento){ eu.nascimento=row.nascimento; eu.maiorDe18=!!row.maior_de_18; eu.idadeDeclaradaEm=row.idade_declarada_em||null; }
  // 18/08 (mig 42): o meu "livre até" vem do banco — o botão do radar lê daqui
  eu.livreAte = row.livre_ate || null;
  // 25/08 (mig 66): o papel vem do banco e alimenta a nav
  eu.perfil = row.perfil || 'jogador';
  eu.joga   = row.joga !== false;
  window.__perfil = { perfil: eu.perfil, joga: eu.joga };
  // 25/08 (mig 54): mão dominante e tempo de prática hidratam junto
  if(row.mao) eu.mao = row.mao;
  if(row.tempo_pratica) eu.tempoPratica = row.tempo_pratica;
  S.cadastroFeito=true;
  if(typeof onb!=='undefined' && onb) fecharCadastro();
  salvar(); render();
}
window.hidratarJogador = hidratarJogador;

/* Sair da conta: desloga, limpa o estado local e volta pra tela de entrar. */
async function sairDaConta(){
  if(window.netLogout){ try{ await netLogout(); }catch(e){} }
  try{ localStorage.removeItem('appTenis'); }catch(e){}
  location.reload();
}
window.sairDaConta = sairDaConta;

/* 28/08 (mig 72): o switch "eu compito" da ficha do professor. Desligar muda
   só descoberta (radar/quadro — mig 67); pendência e turma ficam. Ligar pode
   exigir declarar classe — quem decide é o BANCO (já jogou? nunca jogou?),
   nunca este arquivo. */
let jogaPick = false;   // a ficha está mostrando o seletor de classe?
async function jogaTrocar(){
  const eu = S.jogadores[EU];
  if(eu.joga){
    const r = window.netJogaDesligar ? await netJogaDesligar() : { erro:'sem conexão' };
    if(r && r.ok){ eu.joga=false; jogaPick=false; salvar(); render();
      toast('Você saiu do radar e do ranking. Partidas marcadas e turmas ficam como estão.'); }
    else toast('Não deu: '+((r&&r.erro)||'erro de rede'));
    return;
  }
  const r = window.netJogaLigar ? await netJogaLigar() : { erro:'sem conexão' };
  if(r && r.precisa_classe){ jogaPick=true; render(); return; }
  if(r && r.ok){ eu.joga=true; salvar(); render(); toast('Você voltou pro radar e pro ranking.'); }
  else toast('Não deu: '+((r&&r.erro)||'erro de rede'));
}
async function jogaEscolher(cl){
  const eu = S.jogadores[EU];
  const r = window.netJogaLigar ? await netJogaLigar(cl) : { erro:'sem conexão' };
  if(r && r.ok){
    eu.joga=true; jogaPick=false;
    // espelho local do nascimento esportivo — quem valeu foi o banco (mig 72)
    if(r.calibrando){ eu.calibrando=true; eu.cal=0;
      if(S.esporte==='beach') eu.nivelb=NIVEL_PTS[cl]; else eu.nivel=NIVEL_PTS[cl]; }
    salvar(); render();
    toast('Bem-vindo ao jogo — as 8 primeiras partidas calibram seu Nível.');
  } else toast('Não deu: '+((r&&r.erro)||'erro de rede'));
}
window.jogaTrocar = jogaTrocar; window.jogaEscolher = jogaEscolher;

/* Injeta os jogadores REAIS do banco no estado (chamado pelo netBoot ao conectar).
   Some qualquer elenco fake que tenha sobrado no localStorage: reconstrói o mundo
   só com você (EU) + quem se cadastrou de verdade. */
function aplicarJogadoresReais(lista){
  const eu = S.jogadores[EU];
  const novo = { [EU]: eu };
  (lista||[]).forEach(a=>{
    if(!a || !a.id || a.id===EU) return;
    novo[a.id] = {
      nome:a.nome, ap:a.ap || (a.nome||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),
      joga: a.joga !== false, perfil: a.perfil || 'jogador',
      nivel:a.nivel ?? 1200, div:divisaoDe(a.nivel ?? 1200),
      nivelB:a.nivelb ?? 1200, divB:divisaoDe(a.nivelb ?? 1200),
      /* (mig 46) A LADDER DE DUPLAS — trilho próprio, sem divisão. NÃO passa
         por `divisaoDe`: duplas não gera A/B/C/D (31/07), e derivar classe
         daqui seria criar a segunda régua que a decisão recusa. Semeada com o
         simples no banco; o `??` é rede, não regra. */
      nivel_duplas:a.nivel_duplas ?? a.nivel ?? 1200,
      nivelb_duplas:a.nivelb_duplas ?? a.nivelb ?? 1200,
      bon:a.bon || 'm1', cor:a.cor || '#5C2E3C',
      // 18/08 (mig 41 e 42): as duas marcas viajam pro elenco local. O radar
      // e a busca leem daqui; o inbox ignora — precisa do banido pelo nome.
      banido: !!a.banido_em,
      livreAte: a.livre_ate || null,
      // 18/08: as marcas viajam junto. Sem estas duas linhas o `pintarChave`
      // desenha o adversário de camisa limpa — o escudo e o patrocinador dele
      // existiam no banco e não chegavam em tela nenhuma além da própria.
      escudo: a.escudo || null,
      patroc: a.patroc || null,
      /* 29/08 (mig 78): a bio viaja pro elenco. O board a exibe no perfil que
         OUTRA pessoa abre — é justamente esse o uso dela. Sem esta linha o
         dado existiria no banco e não chegaria a tela nenhuma além da própria,
         que é o mesmo defeito que o escudo e o patrocinador tiveram até 18/08. */
      bio: a.bio || '',
      vistoEm: a.app_visto_em || null,   // (mig 32) o "Online agora" do board
    };
  });
  /* (66) QUEM NÃO JOGA NÃO ENTRA NO ELENCO COMPETITIVO. Este é o ponto único
     por onde toda linha de `players` virava adversário no radar E membro da
     comunidade — um professor que só dá aula apareceria no ranking com zero
     pontos e no radar como oponente. Ele continua existindo em `S.jogadores`
     (o nome dele precisa aparecer na turma, no chat e na busca de professor);
     o que ele NÃO faz é entrar em `S.comunidade.membros`, que é a lista de
     quem compete. */
  S.jogadores = novo;
  const ids = Object.keys(novo);
  S.comunidade.membros = ids.filter(id=> id===EU ? (eu.joga!==false) : (novo[id].joga!==false));
  const soReais = (tab)=>{ const o={}; ids.forEach(id=> o[id] = (tab && tab[id]) || 0); return o; };
  S.pontos.comunidade  = soReais(S.pontos.comunidade);
  S.pontosB.comunidade = soReais(S.pontosB.comunidade);
  // qualquer referência a jogador que não é real some (lixo de localStorage antigo)
  S.historico = (S.historico||[]).filter(h=> novo[h.adv]);
  S.pendentes = (S.pendentes||[]).filter(p=> novo[p.adv]);
  if(S.aguardando && !novo[S.aguardando.adv]) S.aguardando = null;
  if(S.comunidade.cinturao && !novo[S.comunidade.cinturao.dono]) S.comunidade.cinturao = null;
  S.comunidade.patches = (S.comunidade.patches||[]).filter(p=> novo[p.de]);
  S.feed = [];
  S.semana = 0;   // pré-lançamento: temporada ainda não começou
  // começa zerado: nenhum selo conquistado, nenhum título — vêm do jogo real
  (S.selos||[]).forEach(s=> s.tem=false);
  S.titulos = [];
  salvar();
}
window.aplicarJogadoresReais = aplicarJogadoresReais;

/* Passo 3 do backend: conecta no Supabase e espelha meu jogador no banco.
   Não bloqueia — se cair, o protótipo roda offline igual.
   18/08: é aqui que a splash sai. Os dois desfechos servem — conectado ou
   offline, o app já está utilizável nos dois. */
if(window.netBoot) netBoot(S.jogadores[EU]).then(sairSplash, sairSplash);

/* (26/08) SELO DE AMBIENTE. O beta e a produção são o mesmo app em dois
   endereços parecidos, falando com bancos DIFERENTES. Sem uma marca na tela,
   lançar um placar de teste achando que é o do jogo real é questão de tempo —
   e o estrago não aparece na hora, aparece no ranking de outra pessoa.

   Vive aqui e não numa branch de configuração porque a pergunta é do RUNTIME:
   quem responde é a URL de onde o app foi servido, não quem o compilou. Se
   este código um dia chegar em /app/, o selo some sozinho — que é a única
   forma de ele não virar uma tarja "BETA" na cara de quem usa de verdade. */
if(location.pathname.startsWith('/beta/')){
  const selo=document.createElement('div');
  selo.textContent='BETA · banco de testes';
  selo.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;'
    +'background:#B3541E;color:var(--ink);font:600 10px/1.9 var(--f-ui),sans-serif;'
    +'text-align:center;letter-spacing:.08em;pointer-events:none';
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(selo));
  if(document.body) document.body.appendChild(selo);
}

/* Os números do escudo e do patrocinador são medidos por sprite e vivem fora do
   código (atleta-numeros.json), gerados a partir da calibragem no editor.
   O app renderiza antes deles chegarem — sem eles o boneco aparece pintado e sem
   logo, e ao chegar repinta. Nunca segurar a primeira tela esperando arquivo. */
fetch('atleta-numeros.json')
  .then(r=> r.ok ? r.json() : null)
  .then(j=>{ if(!j) return;
    NUMEROS = j;
    // limpar só o cache não basta: cada <img> guarda em data-pronto a chave que
    // já desenhou, e sem zerar isso o repintar acha que está tudo em dia e o
    // boneco fica sem logo até a próxima navegação.
    _pintado.clear();
    document.querySelectorAll('img.bcv').forEach(el=> delete el.dataset.pronto);
    pintarBonecos();
  })
  .catch(()=>{});

/* =========================================================================
   12/08 — VERSÃO NOVA NO AR

   O GitHub Pages serve o index.html com max-age=600: por até 10 minutos o
   aparelho continua rodando a versão velha depois de uma publicação, e em app
   instalado na tela de início isso dura muito mais — ele fica aberto por dias
   sem nunca recarregar. O `?v=` do <script> protege só o net.js; o motor mora
   num <script> embutido AQUI, e nada guardava o index.

   Num host estático não dá pra mandar cabeçalho, então a saída é o app
   PERGUNTAR: busca um versao.json com o cache desligado e compara com a
   própria versão. Achando número maior, oferece a troca em vez de recarregar
   sozinho — trocar a página embaixo de alguém que está digitando um placar
   seria pior que o problema.
   ========================================================================= */
const VERSAO = +(((document.querySelector('script[src^="net.js"]')||{}).src||'')
                 .match(/[?&]v=(\d+)/)||[])[1] || 0;

function ofereceVersaoNova(nova){
  if(document.getElementById('vnova')) return;
  const b = document.createElement('div');
  b.id = 'vnova';
  b.innerHTML = '<b>Tem versão nova do Ranket.</b> Toque pra atualizar.';
  /* troca a URL em vez de dar reload: `?v=N` é OUTRA chave de cache, então o
     navegador é obrigado a buscar o index novo. Um reload pode devolver o
     mesmo arquivo do cache — e aí o app fica preso na versão velha achando
     que atualizou, que é o tipo de mentira que só se descobre muito depois. */
  b.onclick = ()=> location.replace(location.pathname + '?v=' + nova);
  ($('#fone')||document.body).appendChild(b);
}

function conferirVersao(){
  fetch('versao.json', {cache:'no-store'})
    .then(r=> r.ok ? r.json() : null)
    .then(j=>{ if(j && +j.v > VERSAO) ofereceVersaoNova(+j.v) })
    .catch(()=>{});                      // sem rede o app roda igual, só não sabe da versão
}
conferirVersao();

/* app instalado passa dias aberto: a volta pro primeiro plano é a única hora
   em que dá pra perguntar de novo sem custo nenhum. */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){
  conferirVersao();
  if(window.netAvisos) netAvisos();   // (51) a volta ao primeiro plano reconta os recados
}});

/* o `?v=` cumpriu o papel de furar o cache uma vez; limpar evita que ele fique
   grudado no atalho salvo na tela de início. */
if(/[?&]v=/.test(location.search)) history.replaceState(null,'',location.pathname);
</script>
