function completarCadastro(){
  const eu=S.jogadores[EU];
  // esporte escolhido no início: define o esporte ativo E o cenário (quadra).
  S.esporte = onb.esporte || 'tenis';
  eu.cena = S.esporte==='beach' ? {quadra:'areia',momento:'noite'} : {quadra:'saibro',momento:'noite'};
  eu.cenas = { [S.esporte]: eu.cena };
  if(onb.nome.trim()){ eu.nome=onb.nome.trim(); eu.ap=onb.nome.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase() }
  // personagem (bon/cor/roupa/clube/etc) já vem do vestiário aberto no passo 2 — não sobrescreve.
  // 06/08: a calibragem declara a divisão do esporte em que o cadastro rodou.
  // O outro esporte nasce em calibragem própria, no meio da tabela — nunca herda.
  if(onb.div){
    if(ehBeach()){ eu.divB=onb.div; eu.nivelB=NIVEL_PTS[onb.div]; eu.div='C'; eu.nivel=NIVEL_PTS.C }
    else         { eu.div =onb.div; eu.nivel =NIVEL_PTS[onb.div]; eu.divB='C'; eu.nivelB=NIVEL_PTS.C }
  }
  if(onb.email && onb.email.trim()) eu.email = onb.email.trim();
  // 11/08: a data é o dado, a declaração é o fato histórico. Guarda os dois —
  // um responde "que idade tem", o outro responde "o que a pessoa afirmou, e
  // quando", que é o que importa se alguém cobrar.
  if(onb.nasc){ eu.nascimento = onb.nasc; eu.maiorDe18 = !!onb.maiorDe18; eu.idadeDeclaradaEm = onb.idadeDeclaradaEm || null; }
  eu.calibrando=true; eu.cal=0;
  S.cadastroFeito=true;
  fecharCadastro(); aba='inicio'; pilha=[]; salvar(); render();
  // Sobe o jogador pro banco e faz a carga pós-login (roster, tempo-real, inbox),
  // já que a conta acabou de ser criada com email+senha nesta sessão.
  (async()=>{
    if(window.netSyncJogador){ try{ await netSyncJogador(eu); }catch(e){} }
    if(window.netBoot){ try{ await netBoot(S.jogadores[EU]); }catch(e){} }
  })();
  toast('Bem-vindo, '+eu.nome.split(' ')[0]+'! Você entra em <b>calibragem</b> — as 8 primeiras partidas ajustam seu Nível.');
}

function hidratarJogador(row){

  const eu = S.jogadores[EU];
  const novo = { [EU]: eu };
  (lista||[]).forEach(a=>{
    if(!a || !a.id || a.id===EU) return;
    novo[a.id] = {
      nome:a.nome, ap:a.ap || (a.nome||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(),
      nivel:a.nivel ?? 1200, div:divisaoDe(a.nivel ?? 1200),
      nivelB:a.nivelb ?? 1200, divB:divisaoDe(a.nivelb ?? 1200),
      bon:a.bon || 'm1', cor:a.cor || '#5C2E3C',
    };
  });
  S.jogadores = novo;
  const ids = Object.keys(novo);
  S.comunidade.membros = ids.slice();
  const soReais = (tab)=>{ const o={}; ids.forEach(id=> o[id] = (tab && tab[id]) || 0); return o; };
  S.pontos.comunidade  = soReais(S.pontos.comunidade);  S.pontos.c_clube  = soReais(S.pontos.c_clube);
  S.pontosB.comunidade = soReais(S.pontosB.comunidade); S.pontosB.c_clube = soReais(S.pontosB.c_clube);
  S.circuitos.forEach(c=> c.membros = ids.length);
  // qualquer referência a jogador que não é real some (lixo de localStorage antigo)
  S.historico = (S.historico||[]).filter(h=> novo[h.adv]);
  S.pendentes = (S.pendentes||[]).filter(p=> novo[p.adv]);
  if(S.aguardando && !novo[S.aguardando.adv]) S.aguardando = null;
  if(S.comunidade.cinturao && !novo[S.comunidade.cinturao.dono]) S.comunidade.cinturao = null;
  S.comunidade.patches = (S.comunidade.patches||[]).filter(p=> novo[p.de]);
  S.feed = [];
  S.semana = 0;   // pré-lançamento: temporada ainda não começou
  // começa zerado: nenhum selo conquistado, nenhum título — vêm do jogo real
  (S.selos||[]).forEach(s=> s.tem=false);
  S.titulos = [];
  salvar();
}
window.aplicarJogadoresReais = aplicarJogadoresReais;

/* Passo 3 do backend: conecta no Supabase e espelha meu jogador no banco.
   Não bloqueia — se cair, o protótipo roda offline igual. */
if(window.netBoot) netBoot(S.jogadores[EU]);

/* Os números do escudo e do patrocinador são medidos por sprite e vivem fora do
   código (atleta-numeros.json), gerados a partir da calibragem no editor.
   O app renderiza antes deles chegarem — sem eles o boneco aparece pintado e sem
   logo, e ao chegar repinta. Nunca segurar a primeira tela esperando arquivo. */
fetch('atleta-numeros.json')
  .then(r=> r.ok ? r.json() : null)
  .then(j=>{ if(!j) return;
    NUMEROS = j;
    // limpar só o cache não basta: cada <img> guarda em data-pronto a chave que
    // já desenhou, e sem zerar isso o repintar acha que está tudo em dia e o
    // boneco fica sem logo até a próxima navegação.
    _pintado.clear();
    document.querySelectorAll('img.bcv').forEach(el=> delete el.dataset.pronto);
    pintarBonecos();
  })
  .catch(()=>{});
</script>
